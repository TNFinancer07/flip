i a été vérifié en le voyant planter silencieusement pendant les\n     tests. Toutes les autres données de la classe restent de simples champs\n     — seule cette forme précise posait problème. */\n  iphoneImage(modelIdOuNom, colIndex){\n    let m = this.MODELS.find(x => x.id === modelIdOuNom);\n    if(!m) m = this.MODELS.find(x => x.n === modelIdOuNom);\n    if(!m && typeof modelIdOuNom === 'string'){\n      const bas = modelIdOuNom.toLowerCase();\n      m = this.MODELS.find(x => bas.indexOf(x.n.toLowerCase()) === 0);\n    }\n    return this.deviceView(m, colIndex || 0);\n  }\n  iphoneImageCoverage(){\n    return this.MODELS.filter(m => !!this.DEVICE[m.id]).length + '/' + this.MODELS.length;\n  }\n\n  /* Reconnaît une teinte évoquée dans un texte libre et la relie à la vraie\n     finition du modèle si elle existe dans son nuancier — jamais inventée. */\n  COLOR_ALIAS = {minuit:'Minuit', noir:'Minuit', black:'Minuit',\n    stellaire:'Lumière stellaire', blanc:'Lumière stellaire', white:'Lumière stellaire',\n    bleu:'Bleu', blue:'Bleu', rouge:'Rouge', red:'Rouge', product:'Rouge',\n    rose:'Rose', pink:'Rose', vert:'Vert', green:'Vert',\n    mauve:'Mauve', purple:'Mauve', jaune:'Jaune', yellow:'Jaune'};\n\n  finishSwatch(modelId, texte){\n    const d = this.DEVICE[modelId];\n    if(!d || !texte) return null;\n    const bas = texte.toLowerCase();\n    for(const mot in this.COLOR_ALIAS){\n      if(bas.indexOf(mot) === -1) continue;\n      const nom = this.COLOR_ALIAS[mot];\n      const col = d.cols.find(c => c[0] === nom);\n      if(col) return {nom: col[0], hex: col[1]};\n    }\n    return null;\n  }\n\n  gradeOf(){ return this.GRADES.find(g => g.id === this.state.grade) || this.GRADES[2]; }\n\n  /* Changer de grade recalcule coût, temps et provision sans toucher aux\n     réparations déjà cochées. */\n  setGrade(id){\n    this.setState(s => {\n      const g = this.GRADES.find(x => x.id === id) || this.GRADES[2];\n      const gen = (this.MODELS.find(m => m.id === s.modelId) || {gen:'g11'}).gen;\n      let cost = 0, min = 0, risk = 0;\n      this.REPAIRS.filter(r => s.picks[r.code]).forEach(r => {\n        cost += r.piece ? this.PIECES.find(x => x.id === r.piece).p[gen] * g.kp : 0;\n        min += r.temps * g.kt;\n        risk = Math.max(risk, (this.REPAIR_RISK[r.code] || {casse:1}).casse);\n      });\n      return {grade:id, pieces:String(Math.round(cost)), temps:String(Math.round(min)), casse:String(risk || 1)};\n    });\n  }\n\n  /* Coût, temps, valeur débloquée et risque de la configuration courante. */\n  repairPlan(){\n    const s = this.state, g = this.gradeOf();\n    const gen = (this.curModel() || {gen:'g11'}).gen;\n    const rows = this.REPAIRS.filter(r => s.picks[r.code]).map(r => {\n      const base = r.piece ? this.PIECES.find(x => x.id === r.piece).p[gen] : 0;\n      const cout = Math.round(base * g.kp);\n      const temps = Math.round(r.temps * g.kt);\n      const gain = r.gain[gen] || 0;\n      const risk = this.REPAIR_RISK[r.code] || {d:2, casse:2};\n      return {code:r.code, t:r.t, cout, temps, gain, net: gain - cout,\n        roi: cout > 0 ? (gain - cout) / cout * 100 : 0, d:risk.d, casse:risk.casse};\n    });\n    const cout = rows.reduce((a, x) => a + x.cout, 0);\n    const temps = rows.reduce((a, x) => a + x.temps, 0);\n    const gain = rows.reduce((a, x) => a + x.gain, 0);\n    const casse = rows.length ? Math.max.apply(null, rows.map(x => x.casse)) : 1;\n    const heures = temps / 60;\n    const tauxCible = this.num(s.taux);\n    return {rows, cout, temps, gain, net: gain - cout, casse, heures,\n      taux: heures > 0 ? (gain - cout) / heures : 0, tauxCible, grade:g};\n  }\n\n  /* Trois horizons de sortie : le PAM se resserre quand on veut aller vite. */\n  scenarios(){\n    const r = this.pamResult(), s = this.state;\n    const base = r.pam;\n    return [\n      {k:'Vente urgente', d:'24 à 48 h, prix cassé', kp:0.82, c:'var(--fp-bad)',\n        note:\"Tu récupères vite mais tu laisses la marge sur la table.\"},\n      {k:'Vente standard', d: this.num(s.ro.delai) + ' jours, marché normal', kp:1, c:'var(--fp-ok)',\n        note:\"Le cas de référence, celui que calcule le PAM.\"},\n      {k:'Vente optimale', d:'carnet privé, acheteur qui attend', kp:1.12, c:'var(--fp-blue)',\n        note:\"Prix tenu, aucune négociation : tu peux monter ton plafond d'achat.\"}\n    ].map(x => ({k:x.k, d:x.d, c:x.c, note:x.note,\n      pam: Math.round(base * x.kp), offre: Math.round(base * x.kp * 0.8),\n      ecart: (x.kp === 1 ? 'référence' : (x.kp > 1 ? '+' : '') + Math.round((x.kp - 1) * 100) + ' %')}));\n  }\n\n  /* Bilan des points échoués, prêt pour la contre-offre. */\n  bilanTerrain(){\n    const s = this.state, t = this.terrainScore();\n    const ko = t.src.filter(c => (t.store[c.id] || '') === 'ko');\n    const bloquants = ko.filter(c => c.type === 'B');\n    const majeurs = ko.filter(c => c.type === 'M');\n    const mineurs = ko.filter(c => c.type === 'm');\n    /* Chaque défaut constaté vaut la décote correspondante quand elle existe. */\n    let montant = 0;\n    ko.forEach(c => {\n      const id = this.CKDEC[c.id];\n      const d = id ? this.DECOTES.find(x => x.id === id) : null;\n      montant += d ? d.v : (c.type === 'M' ? 15 : 5);\n    });\n    return {ko, bloquants, majeurs, mineurs, montant, testes: t.filled, total: t.total};\n  }\n\n  /* Reporte les échecs terrain sur les décotes et le conseiller. */\n  transfererBilan(){\n    const b = this.bilanTerrain();\n    const dc = Object.assign({}, this.state.dc);\n    b.ko.forEach(c => { const id = this.CKDEC[c.id]; if(id) dc[id] = true; });\n    this.setState({dc, view:'pam', pamSub:'nego', chatPhase:'contre'});\n    this._bilanNote = b;\n  }\n\n  /* ══════════ Synchronisation multi-utilisateur ══════════\n     Deux transports superposés.\n     1. Local : BroadcastChannel, doublé de l'événement storage. Fonctionne\n        hors ligne, sans dépendance, entre les onglets et fenêtres d'un même\n        appareil et d'une même origine.\n     2. Distant : Firebase Realtime Database, chargé à la demande et\n        uniquement si tu as collé ta propre configuration. Tant qu'aucune\n        configuration n'est enregistrée, aucun octet ne part sur le réseau et\n        l'application démarre exactement comme aujourd'hui.\n     Le registre d'achat est délibérément exclu de la synchronisation : il\n     contient le nom et le numéro de pièce d'identité du vendeur. */\n  SYNC_CANAL = 'flip-mtl-sync';\n  SYNC_EXCLU = ['reg'];\n\n  syncBoot(){\n    if(this._syncUp) return;\n    this._syncUp = true;\n    this._peerId = 'p' + Math.floor(Date.now() % 1e7) + '-' + String(this.state.pipe.length);\n    this._peers = {};\n\n    var appliquer = (msg) => {\n      if(!msg || msg.from === this._peerId) return;\n      if(msg.kind === 'ping'){ this._peers[msg.from] = Date.now(); this.syncCount(); return; }\n      if(msg.kind !== 'state' || !msg.data) return;\n      /* Dernière écriture gagnante, et jamais pendant une saisie : écraser un\n         champ que l'autre est en train de remplir serait pire que désynchroniser. */\n      if(msg.ts <= (this._lastTs || 0)) return;\n      var tag = (document.activeElement || {}).tagName;\n      if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT'){ this._enAttente = msg; return; }\n      this._lastTs = msg.ts;\n      this._distant = true;\n      this.setState(msg.data);\n      this.setState({syncFlash: Date.now()});\n      /* La sauvegarde locale se déclenche 400 ms après un changement d'état\n         (componentDidUpdate) : ce délai doit couvrir cette fenêtre, sinon\n         _distant retombe à false avant la sauvegarde et syncBroadcast\n         réémet aussitôt ce qu'on vient de recevoir — ping-pong sans fin\n         entre deux onglets qui se renvoient le même instantané. */\n      clearTimeout(this._distantOff);\n      this._distantOff = setTimeout(() => { this._distant = false; }, 600);\n    };\n\n    try{\n      if(typeof BroadcastChannel !== 'undefined'){\n        this._bc = new BroadcastChannel(this.SYNC_CANAL);\n        this._bc.onmessage = e => appliquer(e.data);\n      }\n    }catch(e){}\n\n    /* Repli pour les contextes sans BroadcastChannel. */\n    this._onStorage = e => {\n      if(e.key !== this.SYNC_CANAL || !e.newValue) return;\n      try{ appliquer(JSON.parse(e.newValue)); }catch(err){}\n    };\n    window.addEventListener('storage', this._onStorage);\n\n    this._onNet = () => { this.setState({syncNet: navigator.onLine}); if(navigator.onLine) this.syncFlush(); };\n    window.addEventListener('online', this._onNet);\n    window.addEventListener('offline', this._onNet);\n\n    this._ping = setInterval(() => {\n      this.syncEmit({kind:'ping', from:this._peerId, ts:Date.now()});\n      this.syncCount();\n    }, 4000);\n    this.syncEmit({kind:'ping', from:this._peerId, ts:Date.now()});\n    this.syncRemoteConnect();\n  }\n\n  /* Nombre de pairs vus dans les douze dernières secondes, soi-même compris. */\n  syncCount(){\n    var n = 1, now = Date.now();\n    Object.keys(this._peers || {}).forEach(k => { if(now - this._peers[k] < 12000) n++; else delete this._peers[k]; });\n    if(n !== this.state.syncPeers) this.setState({syncPeers: n});\n  }\n\n  syncEmit(msg){\n    try{ if(this._bc) this._bc.postMessage(msg); }catch(e){}\n    try{ localStorage.setItem(this.SYNC_CANAL, JSON.stringify(msg)); }catch(e){}\n  }\n\n  /* Diffuse l'état après chaque sauvegarde. */\n  syncBroadcast(keep){\n    if(this._distant) return;\n    var data = {};\n    Object.keys(keep).forEach(k => { if(this.SYNC_EXCLU.indexOf(k) === -1) data[k] = keep[k]; });\n    var msg = {kind:'state', from:this._peerId, ts:Date.now(), data:data};\n    this._lastTs = msg.ts;\n    this.syncEmit(msg);\n    if(this.state.sync && this.state.sync.cfg){\n      if(navigator.onLine && this._fbRef) this.syncRemoteWrite(msg);\n      else this.syncQueue(msg);\n    }\n  }\n\n  /* File d'attente hors ligne, conservée d'une session à l'autre. */\n  syncQueue(msg){\n    try{\n      var q = JSON.parse(localStorage.getItem('fpMtlQueue') || '[]');\n      q.push(msg);\n      localStorage.setItem('fpMtlQueue', JSON.stringify(q.slice(-40)));\n      this.setState({syncQueued: Math.min(40, q.length)});\n    }catch(e){}\n  }\n\n  syncFlush(){\n    var q = [];\n    try{ q = JSON.parse(localStorage.getItem('fpMtlQueue') || '[]'); }catch(e){}\n    if(!q.length || !this._fbRef) return;\n    var dernier = q[q.length - 1];\n    this.syncRemoteWrite(dernier);\n    try{ localStorage.removeItem('fpMtlQueue'); }catch(e){}\n    this.setState({syncQueued: 0});\n  }\n\n  /* Connexion distante : le SDK n'est chargé que si une configuration a été\n     saisie, et jamais depuis une page ouverte en fichier local. */\n  syncRemoteConnect(){\n    var s = this.state;\n    if(!s.sync || !s.sync.cfg) return;\n    if(location.protocol !== 'http:' && location.protocol !== 'https:'){\n      this.setState({syncErr: 'La synchronisation distante exige une page servie en HTTP(S) : ouverte en fichier local, seule la synchro entre onglets fonctionne.'});\n      return;\n    }\n    var cfg;\n    try{ cfg = JSON.parse(s.sync.cfg); }catch(e){\n      this.setState({syncErr: 'Configuration illisible : colle le bloc JSON fourni par la console Firebase.'}); return;\n    }\n    if(!cfg.databaseURL){\n      this.setState({syncErr: 'La configuration ne contient pas de databaseURL : la Realtime Database n’est pas activée sur ce projet.'}); return;\n    }\n    this.setState({syncErr:'', syncState:'connecting'});\n    var charger = (src) => new Promise((ok, ko) => {\n      var sc = document.createElement('script');\n      sc.src = src; sc.async = true;\n      sc.onload = ok; sc.onerror = () => ko(new Error('chargement impossible'));\n      document.head.appendChild(sc);\n    });\n    var base = 'https://www.gstatic.com/firebasejs/10.12.0/';\n    charger(base + 'firebase-app-compat.js')\n      .then(() => charger(base + 'firebase-database-compat.js'))\n      .then(() => {\n        var fb = window.firebase;\n        if(!fb) throw new Error('SDK absent');\n        if(!fb.apps.length) fb.initializeApp(cfg);\n        var salle = (s.sync.room || 'equipe').replace(/[^\\w-]/g, '');\n        this._fbRef = fb.database().ref('flipmtl/' + salle);\n        this._fbRef.child('state').on('value', snap => {\n          var v = snap.val();\n          if(v && v.ts > (this._lastTs || 0) && v.from !== this._peerId){\n            var tag = (document.activeElement || {}).tagName;\n            if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;\n            this._lastTs = v.ts; this._distant = true;\n            this.setState(v.data || {});\n            setTimeout(() => { this._distant = false; }, 60);\n          }\n        });\n        var moi = this._fbRef.child('peers').child(this._peerId);\n        moi.set(Date.now());\n        moi.onDisconnect().remove();\n        this._fbRef.child('peers').on('value', snap => {\n          var v = snap.val() || {};\n          this.setState({syncRemotePeers: Object.keys(v).length});\n        });\n        this.setState({syncState:'live', syncErr:''});\n        this.syncFlush();\n      })\n      .catch(err => {\n        this.setState({syncState:'off',\n          syncErr: 'Connexion impossible (' + (err && err.message ? err.message : 'erreur') + '). L’application continue de fonctionner en local.'});\n      });\n  }\n\n  syncRemoteWrite(msg){\n    try{ if(this._fbRef) this._fbRef.child('state').set(msg); }catch(e){}\n  }\n\n  syncSetCfg(champ, val){\n    this.setState(s => ({sync: Object.assign({}, s.sync, {[champ]: val})}));\n  }\n\n  syncActiver(){\n    this.setState({syncState:'connecting', syncErr:''});\n    setTimeout(() => this.syncRemoteConnect(), 30);\n  }\n\n  syncCouper(){\n    try{ if(this._fbRef){ this._fbRef.off(); this._fbRef = null; } }catch(e){}\n    this.setState({sync:{on:false, cfg:'', room:'equipe'}, syncState:'off', syncErr:'', syncRemotePeers:0});\n  }\n\n  /* ══════════ 11 · Académie ══════════ */\n  MODULES = [\n    {id:'M01', t:'Calibrage & algorithme PRV', xp:20,\n     r:\"Relever soi-même les prix de vente conclus, pas les prix affichés.\",\n     p:[\"Sur eBay, filtre « objets vendus » : c'est le seul prix qui existe vraiment.\",\n        \"Relève cinq ventes du même modèle et de la même capacité, prends la médiane, pas la moyenne.\",\n        \"Reporte-la dans le catalogue Modèles : le PAM se recalcule sur ta donnée, plus sur la mienne.\",\n        \"Recommence tous les six mois — la pastille du catalogue te le rappellera.\"]},\n    {id:'M02', t:'Inspection 20 points & vices cachés', xp:25,\n     r:\"Un défaut trouvé sur place vaut une décote ; un défaut trouvé après vaut une perte.\",\n     p:[\"Lance le chrono de 12 minutes : au-delà, tu discutes au lieu d'inspecter.\",\n        \"Ouvre la mire écran avant tout : pixels morts et burn-in se voient en dix secondes.\",\n        \"Tiroir SIM dehors, pastille LCI à la lampe. Rose ou rouge, tu te lèves.\",\n        \"Réglages → Général → Informations → Historique des pièces : Apple te dit lui-même ce qui a été changé.\"]},\n    {id:'M03', t:'Matrice de négociation & cadrage', xp:20,\n     r:\"On ouvre à l'offre cible, jamais au plafond. Le PAM ne se dit qu'en réponse.\",\n     p:[\"Ouvre à 80 % du PAM et laisse le silence travailler.\",\n        \"Chaque défaut coché devient un chiffre : « batterie à 73 %, c'est 25 $ de cellule ».\",\n        \"Le vendeur qui a publié il y a trois semaines est plus fatigué que toi.\",\n        \"Au-dessus du PAM, tu te lèves — poliment, en laissant ton numéro.\"]},\n    {id:'M04', t:'Logistique & sécurité terrain (MTL)', xp:15,\n     r:\"Lieu public, éclairé, filmé. Toujours.\",\n     p:[\"Station de métro, café, ou stationnement d'un poste de quartier pour les gros montants.\",\n        \"Montant exact compté à l'avance, jamais de liasse visible.\",\n        \"La déconnexion iCloud se fait devant toi, avec le mot de passe du vendeur, avant le paiement.\",\n        \"Remplis le registre d'achat : nom, pièce d'identité, IMEI. C'est ta seule protection après coup.\"]},\n    {id:'M05', t:'Objections & ghosting', xp:10,\n     r:\"Une relance n'immobilise pas ton capital : tant que rien n'est payé, tu es libre.\",\n     p:[\"Relance à 6 h le même jour, puis à 24 h. Jamais trois fois.\",\n        \"« Prix ferme » n'est pas une fin de discussion, c'est une position d'ouverture.\",\n        \"Un vendeur qui ne répond plus a souvent une meilleure offre : demande-lui simplement.\",\n        \"Garde le carnet : l'annonce qui traîne trois semaines revient toujours vers toi.\"]},\n    {id:'M06', t:'Escalade & vente rapide', xp:10,\n     r:\"Le stock qui dort coûte 20 $ par tranche de 14 jours.\",\n     p:[\"Au-delà de 14 jours, applique la vente flash : tu récupères achat, pièces et frais.\",\n        \"Change de canal avant de baisser le prix : le carnet privé paye 9 % de plus.\",\n        \"Un lot se négocie en un seul chiffre pour le tout, jamais appareil par appareil.\",\n        \"Ne descends jamais sous le prix de liquidation : en dessous, tu finances l'acheteur.\"]}\n  ];\n\n  /* Cas pratiques : chaque réponse a un effet chiffré sur la marge. */\n  CAS = [\n    {id:'c1', q:\"Le vendeur exige 50 $ de plus que ton plafond, en fin d'inspection, alors que tu as déjà fait le déplacement.\",\n     opts:[\n       {t:\"Accepter : le déplacement est déjà payé, autant repartir avec l'appareil.\", d:-50, f:\"Le déplacement est un coût irrécupérable — il ne justifie jamais de dépasser le plafond. Tu viens d'effacer la moitié de ta marge.\"},\n       {t:\"Rappeler les défauts chiffrés et maintenir le plafond, prêt à partir.\", d:0, f:\"C'est la bonne réponse. Les défauts constatés sont ta justification, et un acheteur qui peut partir garde toujours le pouvoir.\"},\n       {t:\"Couper la poire en deux à +25 $.\", d:-25, f:\"Tu viens d'apprendre au vendeur que ton plafond est négociable. Il testera encore.\"}]},\n    {id:'c2', q:\"À la remise, l'appareil est encore lié à un compte iCloud. Le vendeur dit qu'il le fera « ce soir en rentrant ».\",\n     opts:[\n       {t:\"Payer et faire confiance : il a l'air honnête et tu as son numéro.\", d:-999, f:\"NO-GO absolu. Un appareil non dissocié est invendable et peut être bloqué à distance après ton paiement. Tu viens de perdre la totalité.\"},\n       {t:\"Refuser le paiement tant que la déconnexion n'est pas faite devant toi.\", d:0, f:\"Exact. C'est la seule règle qui ne se discute jamais, quel que soit le prix.\"},\n       {t:\"Payer la moitié maintenant, la moitié après déconnexion.\", d:-120, f:\"Tu as engagé de l'argent sur un appareil que tu ne peux pas revendre. Un demi-risque reste un risque.\"}]},\n    {id:'c3', q:\"L'annonce dit « écran changé récemment ». L'appareil est un iPhone 13.\",\n     opts:[\n       {t:\"Bon point : l'écran est neuf, ça valorise l'appareil.\", d:-60, f:\"Sur un 13, un écran remplacé sans reprogrammation désactive Face ID définitivement. Teste-le avant toute offre.\"},\n       {t:\"Tester Face ID immédiatement et vérifier l'historique des pièces.\", d:0, f:\"C'est le réflexe de cette génération. Face ID mort, c'est 60 $ de décote au minimum.\"},\n       {t:\"Baisser de 20 $ par principe sans tester.\", d:-40, f:\"Tu décotes à l'aveugle : soit tu perds la vente, soit tu rates un défaut à 60 $.\"}]},\n    {id:'c4', q:\"Un appareil dort depuis 18 jours dans ton pipeline.\",\n     opts:[\n       {t:\"Attendre encore : le bon acheteur finira par venir.\", d:-40, f:\"Chaque tranche de 14 jours coûte 20 $ de décote, et ton capital reste bloqué. L'attente n'est pas gratuite.\"},\n       {t:\"Passer en vente flash au prix qui couvre achat, pièces et frais.\", d:0, f:\"Bonne décision : tu récupères ton capital sans perte sèche et tu le remets au travail.\"},\n       {t:\"Baisser de 5 $ et republier.\", d:-20, f:\"Trop peu, trop tard : tu vas répéter l'opération trois fois et perdre un mois.\"}]}\n  ];\n\n  academieScore(){\n    const s = this.state;\n    const faits = this.MODULES.filter(m => s.acad[m.id]);\n    const xp = faits.reduce((a, m) => a + m.xp, 0);\n    const total = this.MODULES.reduce((a, m) => a + m.xp, 0);\n    const rep = Object.keys(s.cas).length;\n    const bons = this.CAS.filter(c => { const i = s.cas[c.id]; return i !== undefined && c.opts[i].d === 0; }).length;\n    const xpCas = bons * 5;\n    const tot = xp + xpCas;\n    const niveau = tot >= 90 ? 3 : tot >= 45 ? 2 : 1;\n    return {faits: faits.length, xp: tot, total: total + this.CAS.length * 5, niveau,\n      nom: niveau === 3 ? 'Master arbitrage' : niveau === 2 ? 'Opérateur confirmé' : 'Rookie',\n      rep, bons, cas: this.CAS.length,\n      badges: [\n        {t:'Calibrage PRV', on: !!s.acad.M01},\n        {t:'Inspection 12 min', on: !!s.acad.M02},\n        {t:'Maître de la contre-offre', on: !!s.acad.M03},\n        {t:'Terrain sécurisé', on: !!s.acad.M04},\n        {t:'Sang-froid', on: bons >= 3}\n      ]};\n  }\n\n  /* ══════════ 07 · Studio de prompts ══════════\n     Les balises sont remplacées par les valeurs du deal en cours : le prompt\n     se copie tel quel dans n'importe quel assistant. */\n  PROMPT_CTX = [\n    {id:'annonce', n:'Analyser une annonce',\n     x:\"Tu es un acheteur-revendeur d'iPhone d'occasion à Montréal, méthodique et sceptique.\\n\\nVoici le texte d'une annonce :\\n\\\"\\\"\\\"\\n[COLLE L'ANNONCE ICI]\\n\\\"\\\"\\\"\\n\\nMon contexte : je vise un {modele}, mon prix de revente réaliste est {prv} et mon plafond d'achat absolu est {pam}.\\n\\nDonne-moi :\\n1. Les signaux d'alerte, classés en bloquants et en simples décotes, avec un montant estimé pour chacun.\\n2. Les trois questions à poser au vendeur AVANT de me déplacer.\\n3. Une offre d'ouverture chiffrée et la phrase exacte pour l'envoyer.\\nSois bref et chiffré. Pas de généralités.\"},\n    {id:'contre', n:'Rédiger une contre-offre',\n     x:\"Tu es un négociateur calme qui achète des iPhone d'occasion.\\n\\nSituation : {modele}. Le vendeur demande [PRIX DEMANDÉ]. Mon plafond absolu est {pam} et mon offre d'ouverture était {offre}.\\nDéfauts constatés à l'inspection : {defauts}.\\n\\nÉcris-moi trois messages de contre-offre, du plus factuel au plus ferme, qui :\\n- s'appuient sur les défauts constatés en les chiffrant,\\n- ne dépassent jamais {pam},\\n- laissent la porte ouverte si le vendeur refuse.\\nTon courtois, phrases courtes, aucun jargon.\"},\n    {id:'revente', n:'Créer une annonce haute conversion',\n     x:\"Tu écris une annonce de revente pour Marketplace et Kijiji à Montréal.\\n\\nAppareil : {modele}, prix demandé {prv}.\\nÉtat et travaux réalisés : {defauts}.\\n\\nProduis :\\n1. Trois titres d'annonce de moins de 60 caractères.\\n2. Une description de 120 mots maximum, honnête, qui met en avant la remise en état et la garantie 30 jours.\\n3. Les trois objections les plus probables et la réponse courte à chacune.\\nPas de superlatifs, pas d'émojis en rafale : les acheteurs sérieux s'en méfient.\"},\n    {id:'lot', n:'Négocier un lot B2B',\n     x:\"Tu m'aides à négocier un achat groupé auprès d'un revendeur à Montréal.\\n\\nLot visé : [NOMBRE] appareils, dont des {modele}. Mon plafond unitaire est {pam}, soit un plafond global à ne jamais dépasser.\\n\\nDonne-moi :\\n1. L'argumentaire pour obtenir une remise de lot, du point de vue du vendeur (ce que MOI je lui apporte).\\n2. Le message d'ouverture, avec un seul chiffre global.\\n3. La réponse à « je préfère vendre à l'unité ».\\nUn lot ne se négocie qu'en un chiffre pour le tout.\"}\n  ];\n\n  PROMPT_LIB = [\n    {id:'snipe', n:'Sniping — extraction d\\'annonce', ic:'🎯',\n     x:\"Voici la capture d'écran (ou le texte) d'une annonce d'iPhone.\\n\\nExtrais uniquement, en JSON, sans commentaire :\\n{\\\"modele\\\":\\\"\\\",\\\"capacite\\\":\\\"\\\",\\\"prix_demande\\\":0,\\\"etat_annonce\\\":\\\"\\\",\\\"defauts_mentionnes\\\":[],\\\"batterie_pct\\\":null,\\\"icloud\\\":\\\"inconnu|actif|desactive\\\",\\\"anciennete_annonce_jours\\\":null,\\\"signaux_risque\\\":[],\\\"questions_a_poser\\\":[]}\\n\\nSi une information est absente, mets null — n'invente jamais de valeur.\"},\n    {id:'faux', n:'Repérage de faux & arnaques', ic:'🕵',\n     x:\"Analyse ce texte d'annonce d'iPhone et repère les incohérences qui trahissent une arnaque ou un appareil problématique :\\n\\\"\\\"\\\"\\n[COLLE L'ANNONCE ICI]\\n\\\"\\\"\\\"\\n\\nCherche notamment : prix anormalement bas pour le modèle, refus de rencontre en personne, demande d'acompte, photos génériques ou volées, modèle et capacité incohérents, mention d'un compte encore lié, vocabulaire de revendeur masqué en particulier.\\n\\nRends un verdict sur 10 avec la liste des indices trouvés et la question précise qui ferait tomber le masque.\"},\n    {id:'fache', n:'Re-négo — vendeur fâché', ic:'🧊',\n     x:\"Un vendeur s'est vexé de mon offre sur un {modele} et répond sèchement.\\n\\nMon plafond reste {pam} et mon offre d'ouverture était {offre}. Défauts constatés : {defauts}.\\n\\nÉcris-moi une réponse qui :\\n- désamorce la tension sans m'excuser d'avoir fait une offre,\\n- réaffirme le chiffre sans le monter,\\n- rappelle ce que j'apporte : comptant, immédiat, déplacement à ma charge,\\n- se termine par une porte ouverte sans relance insistante.\\nTrois phrases maximum.\"},\n    {id:'brief', n:'Brief d\\'inspection par modèle', ic:'🔧',\n     x:\"Je vais inspecter un {modele} dans une heure à Montréal.\\n\\nDonne-moi la checklist d'inspection SPÉCIFIQUE à ce modèle exact — pas une liste générique :\\n- les pannes connues de cette génération,\\n- le test précis pour chacune, réalisable en moins d'une minute sans outil,\\n- la décote en dollars canadiens que chaque défaut justifie.\\n\\nClasse par ordre décroissant d'impact financier. Maximum 10 points.\"}\n  ];\n\n  promptVars(txt){\n    const m = this.curModel(), r = this.pamResult(), s = this.state;\n    const def = this.chatDefects();\n    return txt\n      .replace(/\\{modele\\}/g, (m ? m.n : 'iPhone') + ' ' + s.storage + ' Go')\n      .replace(/\\{pam\\}/g, Math.round(r.pam) + ' $')\n      .replace(/\\{offre\\}/g, Math.round(r.pam * 0.8) + ' $')\n      .replace(/\\{prv\\}/g, Math.round(r.prv) + ' $')\n      .replace(/\\{defauts\\}/g, def.length ? def.join(', ') : 'aucun défaut relevé pour l’instant');\n  }\n\n  /* ══════════ Price Low Ball — moteur ══════════ */\n  toast(msg){\n    this.setState({toast: {msg, ts: Date.now()}});\n    clearTimeout(this._toastT);\n    this._toastT = setTimeout(() => this.setState({toast: {msg:'', ts:0}}), 2400);\n  }\n\n  lbMid(lo, hi){ return (lo + hi) / 2; }\n\n  /* Marge = Δ(Prix cible Youssef − Offre basse Sony), formule demandée telle\n     quelle. Ce n'est pas un profit d'achat-revente — c'est l'écart entre les\n     deux ancrages de négociation de l'équipe. Une valeur négative signale que\n     l'offre basse dépasse le prix cible : à vérifier, pas à masquer. */\n  lbCalc(row){\n    const oLow = this.ov1('lbLowOverride', row.id, this.lbMid(row.sLo, row.sHi));\n    const oTarget = this.ov1('lbTargetOverride', row.id, this.lbMid(row.yLo, row.yHi));\n    const sMid = oLow.v, yMid = oTarget.v;\n    const marge = yMid - sMid;\n    return {sMid, yMid, marge, roi: sMid > 0 ? marge / sMid * 100 : 0, lowEdit: oLow.edit, targetEdit: oTarget.edit};\n  }\n\n  lbGenList(){\n    const seen = {};\n    return this.LOWBALL.filter(r => !seen[r.badge] && (seen[r.badge] = true))\n      .map(r => r.badge);\n  }\n\n  /* Une fiche est « documentée » quand la colonne Modèle & spécificités\n     porte réellement une précision — couleur, capacité, état de batterie,\n     quartier ou vendeur — et pas seulement un nom de modèle nu. Le tiret\n     cadratin est le séparateur utilisé par la liste source. Sur le terrain\n     une ligne « iPhone 14 » sans rien d'autre ne permet ni de chiffrer ni\n     de reconnaître l'appareil : ces lignes sont du bruit tant qu'on ne les\n     a pas complétées. */\n  lbSpecs(label){\n    const i = String(label || '').indexOf('—');\n    return i === -1 ? '' : label.slice(i + 1).trim();\n  }\n  lbDocList(){\n    return this.LOWBALL.filter(r => this.lbSpecs(r.label) && !this.state.lbDismissed[r.id]);\n  }\n\n  /* Ensemble filtré + trié, avant pagination — c'est aussi ce que lisent les\n     KPI et l'export, pour rester cohérents avec ce que l'écran montre. */\n  lbFiltered(){\n    const s = this.state, lb = s.lb;\n    const q = (lb.q || '').trim().toLowerCase();\n    const gensActifs = Object.keys(lb.gens || {}).filter(g => lb.gens[g]);\n    const showDismissed = !!s.lbShowDismissed;\n    let rows = this.LOWBALL.filter(r => {\n      if(!!s.lbDismissed[r.id] !== showDismissed) return false;\n      /* Seule la présence d'une spécification documentée peut retirer une\n         ligne de la liste. La tranche de prix n'est jamais un critère de\n         filtrage : c'est une métadonnée permanente de la fiche, affichée\n         en repère sous chaque prix, et le sélecteur ne fait que pointer\n         une fiche sans jamais réduire le nombre de résultats. */\n      if(lb.docOnly && !this.lbSpecs(r.label)) return false;\n      if(gensActifs.length && gensActifs.indexOf(r.badge) === -1) return false;\n      if(q && r.label.toLowerCase().indexOf(q) === -1) return false;\n      return true;\n    }).map(r => Object.assign({}, r, this.lbCalc(r)));\n    const [clef, dir] = (lb.sort || 'yous_desc').split('_');\n    const sgn = dir === 'asc' ? 1 : -1;\n    rows.sort((a, b) => {\n      if(clef === 'modele') return a.label.localeCompare(b.label) * sgn;\n      if(clef === 'marge') return (a.marge - b.marge) * sgn;\n      return (a.yMid - b.yMid) * sgn;   // 'yous'\n    });\n    return rows;\n  }\n\n  lbKpis(){\n    const rows = this.lbFiltered();\n    const n = rows.length;\n    const prixMoyen = n ? rows.reduce((a, r) => a + r.yMid, 0) / n : 0;\n    const margeTotale = rows.reduce((a, r) => a + r.marge, 0);\n    const negatives = rows.filter(r => r.marge < 0).length;\n    const gammes = {}; rows.forEach(r => { gammes[r.badge] = true; });\n    return {n, prixMoyen, margeTotale, negatives, gammes: Object.keys(gammes).length};\n  }\n\n  lbSetSearch(v){\n    this.setState(s => ({lb: Object.assign({}, s.lb, {qDraft: v})}));\n    clearTimeout(this._lbDeb);\n    this._lbDeb = setTimeout(() => {\n      this.setState(s => ({lb: Object.assign({}, s.lb, {q: v, page: 1})}));\n    }, 220);\n  }\n  lbToggleGen(badge){\n    this.setState(s => {\n      const gens = Object.assign({}, s.lb.gens);\n      gens[badge] = !gens[badge];\n      return {lb: Object.assign({}, s.lb, {gens, page: 1})};\n    });\n  }\n  lbSetSort(v){ this.setState(s => ({lb: Object.assign({}, s.lb, {sort: v})})); }\n  lbReset(){ this.setState(s => ({lb: Object.assign({}, s.lb, {q:'', qDraft:'', gens:{}, page:1, docOnly:false, focus:''})})); }\n  lbToggleDocOnly(){\n    this.setState(s => ({lb: Object.assign({}, s.lb, {docOnly: !s.lb.docOnly, focus:'', page:1})}));\n  }\n  /* Le sélecteur pointe une fiche : il amène à la page qui la contient et\n     la marque d'un liseré, sans retirer une seule ligne de la grille. */\n  lbSetFocus(v){\n    const id = v ? Number(v) : 0;\n    let page = 1;\n    if(id){\n      const idx = this.lbFiltered().findIndex(r => r.id === id);\n      if(idx >= 0) page = Math.floor(idx / 10) + 1;\n    }\n    this.setState(s => ({lb: Object.assign({}, s.lb, {focus: v, page})}));\n  }\n  lbSetPage(n){ this.setState(s => ({lb: Object.assign({}, s.lb, {page: n})})); }\n  lbToggleSel(id){\n    this.setState(s => {\n      const sel = Object.assign({}, s.lb.sel || {});\n      if(sel[id]) delete sel[id]; else sel[id] = true;\n      return {lb: Object.assign({}, s.lb, {sel})};\n    });\n  }\n  lbSetUrl(id, url){\n    this.setState(s => ({lbUrls: Object.assign({}, s.lbUrls, {[id]: url})}));\n  }\n\n  /* Importe une ligne dans le pipeline : coût = offre basse Sony (ce que\n     l'équipe compte réellement payer), PRV cible = prix cible Youssef. */\n  lbImport(id){\n    const row = this.LOWBALL.find(r => r.id === id);\n    if(!row || this.state.lbImported[id]) return;\n    const calc = this.lbCalc(row);\n    this.setState(s => ({\n      pipe: s.pipe.concat([{id: 'lb' + id + '-' + Date.now(), model: row.label,\n        achat: Math.round(calc.sMid), pieces: 0, prv: Math.round(calc.yMid),\n        col:0, days:0, t0: Date.now(), lieu:'Chez moi'}]),\n      lbImported: Object.assign({}, s.lbImported, {[id]: true})\n    }));\n    this.toast('Importé au pipeline · ' + row.label);\n  }\n  lbImportSelection(){\n    const ids = Object.keys(this.state.lb.sel || {}).map(Number).filter(id => !this.state.lbImported[id]);\n    if(!ids.length) return;\n    ids.forEach(id => this.lbImport(id));\n    this.setState(s => ({lb: Object.assign({}, s.lb, {sel:{}})}));\n    this.toast(ids.length + ' appareil(s) importés au pipeline');\n  }\n\n  /* Retrait « archivé » plutôt que suppression : la fiche reste dans\n     LOWBALL (donnée de référence, jamais mutée), juste masquée de la\n     liste active et récupérable via le bouton Retirés. */\n  lbDismiss(id){\n    const row = this.LOWBALL.find(r => r.id === id);\n    this.setState(s => ({\n      lbDismissed: Object.assign({}, s.lbDismissed, {[id]: true}),\n      lb: Object.assign({}, s.lb, {sel: (() => { const sel = Object.assign({}, s.lb.sel || {}); delete sel[id]; return sel; })()})\n    }));\n    if(row) this.toast('Retiré · ' + row.label + ' · restaurable via « Retirés »');\n  }\n  lbRestore(id){\n    const row = this.LOWBALL.find(r => r.id === id);\n    this.setState(s => {\n      const next = Object.assign({}, s.lbDismissed);\n      delete next[id];\n      return {lbDismissed: next};\n    });\n    if(row) this.toast('Restauré · ' + row.label);\n  }\n  lbToggleShowDismissed(){\n    this.setState(s => ({lbShowDismissed: !s.lbShowDismissed}));\n  }\n\n  lbCopyOffer(row){\n    const calc = this.lbCalc(row);\n    const txt = 'Bonjour, votre ' + row.label.replace(/—.*/, '').trim()\n      + ' m’intéresse. Je peux passer aujourd’hui, comptant, à ' + Math.round(calc.sMid)\n      + ' $. Je me déplace où vous voulez sur l’île, disponible tout de suite.';\n    if(navigator.clipboard) navigator.clipboard.writeText(txt);\n    this.toast('Offre copiée · ' + row.label);\n  }\n\n  lbCsv(){\n    const rows = this.lbFiltered();\n    const lignes = [['#','Modèle','Gamme','Offre basse Sony ($)','Prix cible Youssef ($)','Écart Δ ($)','ROI (%)','Lien Marketplace']];\n    rows.forEach(r => lignes.push([r.id, r.label, this.LOWBALL_BADGE[r.badge].n,\n      Math.round(r.sMid), Math.round(r.yMid), Math.round(r.marge), r.roi.toFixed(0),\n      this.state.lbUrls[r.id] || '']));\n    const csv = lignes.map(l => l.map(c => {\n      const t = String(c);\n      return /[\",;]/.test(t) ? '\"' + t.replace(/\"/g, '\"\"') + '\"' : t;\n    }).join(';')).join('\\r\\n');\n    const blob = new Blob(['\\uFEFF' + csv], {type:'text/csv;charset=utf-8'});\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url; a.download = 'price-low-ball.csv';\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(() => URL.revokeObjectURL(url), 4000);\n    this.toast('Export CSV téléchargé · ' + rows.length + ' lignes');\n  }\n\n  lbPrint(){ window.print(); }\n\n  /* ══════════ Rôles & gouvernance ══════════\n     Quatre fonctions, des droits explicites. La matrice existe pour qu'on\n     sache qui engage l'argent avant qu'un litige ne se pose. */\n  ROLES = [\n    {id:'ceo', ini:'CEO', nom:'CEO & Fondateur', role:'Fondation / Stratégie', c:'#a78bfa',\n     statut:'Actif', comm:0, obj:'Arbitrage & capital',\n     mission:\"Direction stratégique, validation finale des budgets, arbitrage des PAM et véto global. Seul à pouvoir déplacer les règles financières : marge minimale exigée et plafond de capital d'achat.\"},\n    {id:'sony', ini:'S', nom:'Sony', role:'Sourcing · Négociation · Pipeline', c:'#3b82f6',\n     statut:'Actif', comm:15, obj:'20 offres / mois',\n     mission:\"Repère les annonces, mène la négociation et pilote le pipeline de revente jusqu'à l'encaissement. Fixe le prix de sortie, jamais les planchers.\"},\n    {id:'coo', ini:'Y', nom:'Youssef · COO', role:'Opérateur terrain', c:'#10b981',\n     statut:'En mission', comm:0, obj:'8 appareils / mois',\n     mission:\"Inspection physique, checklist 20 points et exécution des réparations à l'atelier. Il tient le NO-GO terrain.\"}\n  ];\n\n  /* Droits par rôle : 1 accordé, 0 refusé. Les règles financières globales\n     sont le seul domaine réservé au CEO. */\n  PERMS = [\n    {k:'Valider un deal',                    v:{ceo:1, sony:1, coo:1}},\n    {k:'Engager le capital',                 v:{ceo:1, sony:0, coo:0}},\n    {k:'Modifier la marge minimale exigée',  v:{ceo:1, sony:0, coo:0}},\n    {k:'Modifier le plafond de capital',     v:{ceo:1, sony:0, coo:0}},\n    {k:'Modifier les plafonds PAM',          v:{ceo:1, sony:0, coo:0}},\n    {k:'Véto sur un achat',                  v:{ceo:1, sony:0, coo:0}},\n    {k:'Fixer le prix de revente',           v:{ceo:1, sony:1, coo:0}},\n    {k:'Sortir du stock (vendu)',            v:{ceo:1, sony:1, coo:0}},\n    {k:'Déclarer un NO-GO terrain',          v:{ceo:1, sony:1, coo:1}},\n    {k:'Commander des pièces',               v:{ceo:1, sony:0, coo:1}}\n  ];\n\n  /* Les trois décisions qui rapportent le plus aujourd'hui. */\n  actionsJour(){\n    const s = this.state, out = [];\n    const open = s.pipe.filter(p => p.col < 3);\n\n    const vieux = open.filter(p => this.daysOf(p) > 14)\n      .sort((a, b) => this.daysOf(b) - this.daysOf(a))[0];\n    if(vieux){\n      const e = this.cardEco(vieux);\n      out.push({ic:'📉', t:'Baisser ' + vieux.model,\n        d: e.days + ' jours en stock, décote d’âge de ' + this.fmt(e.haircut) + ' déjà encaissée. Descends de 20 $ ou passe en vente flash à ' + this.fmt(e.flash) + '.',\n        c:'var(--fp-bad)', go:'pipeline'});\n    }\n    const enVente = open.filter(p => p.col === 2)[0];\n    if(enVente) out.push({ic:'📦', t:'Livrer ' + enVente.model,\n      d:'En vente : prépare la fiche de revente avec QR et le reçu d’achat avant la rencontre.',\n      c:'var(--fp-blue)', go:'pam'});\n    if(s.adText && s.adText.trim()){\n      const a = this.adScan();\n      out.push({ic:'💬', t:'Relancer l’annonce analysée',\n        d:'Indice d’opportunité ' + a.score + '/100 — ' + (a.nogo ? 'un signal bloquant a été relevé, ne relance pas.' : 'passe au conseiller de discussion, phase relance.'),\n        c: a.nogo ? 'var(--fp-bad)' : 'var(--fp-ok)', go:'pam'});\n    }\n    const r = this.runway();\n    if(!r.tenu) out.push({ic:'⚠️', t:'Runway sous 21 jours',\n      d: r.jours + ' jours de survie si le stock se fige. Liquide une unité ou garde du cash avant le prochain achat.',\n      c:'var(--fp-warn)', go:'reinvest'});\n    if(!out.length) out.push({ic:'🎯', t:'Rien d’urgent',\n      d:'Aucune unité en alerte, aucun runway tendu. C’est le moment de sourcer.', c:'var(--fp-ok)', go:'sourcing'});\n    return out.slice(0, 3);\n  }\n\n  /* ══════════ Pipeline, sourcing, réinvestissement, scale ══════════ */\n\n  /* Écart de marge et de rotation selon le canal de revente. */\n  CHAN_ECART = [\n    {n:'Marketplace', d:0,   j:0,  note:\"Le plus gros bassin de Montréal, mais le plus de temps perdu en messages.\"},\n    {n:'Kijiji',      d:-4,  j:2,  note:\"Moins de volume, acheteurs plus sérieux, négociation plus dure.\"},\n    {n:'Client VIP',  d:9,   j:-3, note:\"Ton carnet : prix tenu, aucune négociation, paiement immédiat.\"},\n    {n:'B2B',         d:-18, j:-5, note:\"Prix de gros, mais tu écoules tout d'un coup et tu libères le capital.\"}\n  ];\n\n  /* Densité d'annonces observée et distance depuis le centre. */\n  ZONES = [\n    {n:'Centre-ville', dens:9, km:5},\n    {n:'Plateau',      dens:8, km:5},\n    {n:'Rosemont',     dens:8, km:6},\n    {n:'Verdun',       dens:6, km:9},\n    {n:'Longueuil',    dens:5, km:18},\n    {n:'Laval',        dens:7, km:22}\n  ];\n\n  LIEUX = ['Chez moi', 'Atelier', 'Acheteur terrain', 'Technicien'];\n\n  RELANCE_CANAL = {\n    Marketplace: [\n      {t:'Relance courte — Marketplace', x:\"Bonjour ! Toujours disponible ? Je peux passer aujourd'hui, comptant. Dites-moi simplement oui ou non, je ne veux pas vous faire perdre de temps.\"},\n      {t:'Relance avec créneau — Marketplace', x:\"Bonjour, je relance une dernière fois : je suis dans le secteur cet après-midi. Si l'appareil est encore là, je le prends au prix convenu, comptant.\"}\n    ],\n    Kijiji: [\n      {t:'Relance courte — Kijiji', x:\"Bonjour, votre annonce est-elle toujours active ? Je suis acheteur sérieux, paiement comptant, je me déplace. Merci de me confirmer.\"},\n      {t:'Relance annonce ancienne — Kijiji', x:\"Bonjour, j'ai vu que l'annonce est en ligne depuis un moment. Si vous souhaitez conclure rapidement, mon offre comptant tient aujourd'hui.\"}\n    ],\n    'Client VIP': [\n      {t:'Relance carnet privé', x:\"Salut ! J'ai un appareil qui correspond à ce que tu cherchais. Je te le réserve 24 h avant de le publier — dis-moi.\"}\n    ],\n    B2B: [\n      {t:'Relance revendeur', x:\"Bonjour, j'ai du stock disponible cette semaine. Je peux faire un prix de lot si vous prenez l'ensemble. Combien d'unités vous intéressent ?\"}\n    ]\n  };\n\n  /* Jours réellement écoulés : les cartes créées par l'application portent un\n     horodatage, les cartes d'exemple gardent leur valeur figée. */\n  daysOf(p){\n    if(!p.t0) return this.num(p.days);\n    return this.num(p.days) + Math.floor((Date.now() - p.t0) / 86400000);\n  }\n\n  /* Décote d'âge : −20 $ par tranche de 14 jours au-delà de la première. */\n  ageHaircut(days){ return days > 14 ? 20 * Math.floor(days / 14) : 0; }\n\n  /* Économie complète d'une carte du pipeline, canal compris. */\n  cardEco(p){\n    const s = this.state;\n    const days = this.daysOf(p);\n    const ch = this.CHAN_ECART.find(c => c.n === (p.chan || 'Marketplace')) || this.CHAN_ECART[0];\n    const prvCanal = this.num(p.prv) * (1 + ch.d / 100);\n    const haircut = this.ageHaircut(days);\n    const frais = this.num(s.kit) + this.num(s.deplac);\n    const reserve = prvCanal * this.num(s.garantie) / 100;\n    const casse = prvCanal * this.num(s.casse) / 100;\n    const invest = this.num(p.achat) + this.num(p.pieces);\n    const marge = prvCanal - invest - frais - reserve - casse - haircut;\n    const roi = invest > 0 ? marge / invest * 100 : 0;\n    /* Prix plancher pour écouler en 24 h sans perte sèche : on récupère\n       l'investissement et les frais engagés, on renonce à la marge. */\n    const flash = Math.ceil((invest + frais) / 5) * 5;\n    return {days, ch, prvCanal, haircut, frais, reserve, casse, invest, marge, roi, flash,\n      alerte: days > 14, rotation: Math.max(1, this.num(s.ro.delai) + ch.j)};\n  }\n\n  /* Temps moyen par étape, mesuré sur le stock courant. */\n  stageStats(){\n    const s = this.state;\n    return this.PIPE_COLS.map((n, i) => {\n      const items = s.pipe.filter(p => p.col === i);\n      const moy = items.length ? items.reduce((a, p) => a + this.daysOf(p), 0) / items.length : 0;\n      return {n, count: items.length, moy};\n    });\n  }\n\n  /* ── Réinvestissement ── */\n  compound(){\n    const s = this.state;\n    const capital = Math.max(0, this.num(s.ro.capital) - this.num(s.ro.coussin));\n    const cout = Math.max(1, this.num(s.ro.cout));\n    const profit = this.num(s.ro.profit);\n    const delai = Math.max(1, this.num(s.ro.delai));\n    const roi = profit / cout;\n    const at = d => capital * Math.pow(1 + roi, d / delai);\n\n    /* Courbe théorique : capital composé sans aucune limite.\n       Courbe réelle : bornée par le bassin d'affaires trouvables à Montréal —\n       une dizaine de vraies occasions par mois — et par le nombre d'appareils\n       que le capital permet d'engager en parallèle. Sans ce plafond, la\n       projection annonce des montants que le sourcing ne peut pas suivre. */\n    const capMois = Math.max(1, this.num(s.ro.capMois) || 10);\n    const parCycle = capMois * delai / 30;\n    const pts = [];\n    let cash = capital, reel = capital;\n    for(let j = 0; j <= 90; j += 3){\n      pts.push({j, c: at(j), r: reel});\n      if(j % delai < 3 && j > 0){\n        const n = Math.min(Math.floor(cash / cout), parCycle);\n        cash += n * profit; reel = cash;\n      }\n    }\n    const reelFin = reel;\n    return {capital, roi, delai, pts, j30: at(30), j60: at(60), j90: at(90),\n      reel90: reelFin, capMois, unites: Math.floor(capital / cout)};\n  }\n\n  /* Répartition de chaque encaissement en trois piles. */\n  piles(){\n    const s = this.state;\n    const profit = this.num(s.ro.profit);\n    const cout = this.num(s.ro.cout);\n    const gar = this.num(s.garantie);\n    const reserve = Math.round((cout + profit) * gar / 100);\n    const retirable = Math.max(0, profit - reserve);\n    return [\n      {k:'Capital d’achat', v: cout, c:'var(--fp-blue)', d:'Retourne immédiatement au stock.'},\n      {k:'Réserve garantie', v: reserve, c:'var(--fp-warn)', d: gar + ' % mis de côté pour les retours 30 jours.'},\n      {k:'Bénéfice retirable', v: retirable, c:'var(--fp-ok)', d:'Ce que tu peux sortir sans casser la chaîne.'}\n    ];\n  }\n\n  /* Nombre de jours tenus si tout le stock restait bloqué. */\n  runway(){\n    const s = this.state;\n    const dispo = Math.max(0, this.num(s.ro.capital) - s.pipe.reduce((a, p) => a + this.num(p.achat) + this.num(p.pieces), 0));\n    const bruleJour = (this.num(s.kit) + this.num(s.deplac)) / Math.max(1, this.num(s.ro.delai));\n    const jours = bruleJour > 0 ? Math.floor(dispo / bruleJour) : 999;\n    return {dispo, bruleJour, jours, tenu: jours >= 21};\n  }\n\n  /* Rendement net des provisions réellement consommées. */\n  rendementAjuste(){\n    const s = this.state;\n    const profit = this.num(s.ro.profit);\n    const provCasse = profit * this.num(s.casse) / 100;\n    const provGarantie = profit * this.num(s.garantie) / 100;\n    const net = profit - provCasse - provGarantie;\n    return {profit, provCasse, provGarantie, net,\n      pct: profit > 0 ? net / profit * 100 : 0};\n  }\n\n  /* Champ du registre : un gestionnaire stable par clé, pour éviter d'en\n     recréer un à chaque rendu. */\n  onRegField(k){ return this.objField('reg', k); }\n  onSrcField(k){ return this.objField('src', k); }\n  onCommField(k){ return this.objField('comm', k); }\n  onGoalField(k){ return this.objField('goals', k); }\n\n  /* Un gestionnaire stable par (objet, clé) : évite d'en recréer un à chaque\n     rendu, ce qui ferait perdre le focus du champ en cours de saisie. */\n  objField(obj, k){\n    this._fH = this._fH || {};\n    const id = obj + '.' + k;\n    if(!this._fH[id]) this._fH[id] = e => {\n      const v = e.target.value;\n      this.setState(st => ({[obj]: Object.assign({}, st[obj], {[k]: v})}));\n    };\n    return this._fH[id];\n  }\n\n  /* Applique le prix de liquidation à une carte et la pousse en vente. */\n  venteFlash(id){\n    this.setState(s => ({pipe: s.pipe.map(p => {\n      if(p.id !== id) return p;\n      const e = this.cardEco(p);\n      return Object.assign({}, p, {prv: e.flash, col: Math.max(2, p.col), flash: true});\n    })}));\n  }\n  setLieu(id, lieu){\n    this.setState(s => ({pipe: s.pipe.map(p => p.id === id ? Object.assign({}, p, {lieu}) : p)}));\n  }\n\n  /* ══════════ Saisonnalité ══════════\n     Deux effets distincts : la dépréciation mensuelle du modèle, qui est\n     mécanique, et l'approche de la keynote de septembre, qui est une\n     tendance observée et non une donnée de marché. */\n  seasonInfo(m){\n    if(!m) return {label:'—', color:'var(--fp-ink-3)', note:'Choisis un modèle pour voir la tendance.'};\n    const prv = this.prvToday(m);\n    const chute30 = Math.round(prv * m.dep / 100);\n    const now = new Date();\n    let kn = new Date(now.getFullYear(), 8, 12);\n    if(now > kn) kn = new Date(now.getFullYear() + 1, 8, 12);\n    const jours = Math.round((kn - now) / 86400000);\n    const pct = m.dep.toFixed(1).replace('.', ',');\n\n    if(jours <= 45){\n      return {label:'Keynote dans ' + jours + ' j · −' + chute30 + ' $ / 30 j',\n        color:'var(--fp-bad)',\n        note:'La keynote iPhone tombe dans ' + jours + ' jours. À l\\'annonce des nouveaux modèles, l\\'occasion décroche d\\'un cran en plus de la baisse mécanique de ' + pct + ' %/mois. Écoule ton stock avant, n\\'achète que ce qui tourne en moins de deux semaines.'};\n    }\n    if(jours <= 100){\n      return {label:'Keynote dans ' + Math.round(jours/30) + ' mois · −' + chute30 + ' $ / 30 j',\n        color:'var(--fp-warn)',\n        note:'Baisse mécanique de ' + pct + ' %/mois, soit environ ' + chute30 + ' $ sur les 30 prochains jours. La keynote approche : garde une rotation courte.'};\n    }\n    return {label:'−' + chute30 + ' $ projetés / 30 j',\n      color:'var(--fp-ink-3)',\n      note:'Baisse mécanique de ' + pct + ' %/mois sur ce modèle, soit environ ' + chute30 + ' $ sur 30 jours. Fenêtre calme avant la keynote de septembre.'};\n  }\n\n  /* Contenu du reçu d'achat. */\n  recuLignes(){\n    const s = this.state, m = this.curModel(), r = this.pamResult();\n    const dev = this.deviceOf(m);\n    return [\n      {k:'Vendeur',            v: s.reg.nom || '—'},\n      {k:'Contact',            v: s.reg.tel || '—'},\n      {k:'Pièce d’identité',   v: (s.reg.idType || '—') + (s.reg.idNum ? ' nº ' + s.reg.idNum : '')},\n      {k:'Appareil',           v: (m ? m.n : '—') + ' · ' + s.storage + ' Go' + (dev ? ' · ' + dev.conn : '')},\n      {k:'IMEI',               v: s.reg.imei || '—'},\n      {k:'Prix payé',          v: (s.reg.prix ? s.reg.prix + ' $' : this.fmt(r.pam)) + ' — comptant'},\n      {k:'Lieu',               v: s.reg.lieu || '—'}\n    ];\n  }\n\n  /* ══════════ Scanner d'annonce ══════════\n     Analyse lexicale du texte du vendeur. Chaque signal porte son poids sur\n     l'indice d'opportunité, l'argument de négociation qu'il autorise, et le\n     cas échéant la réparation à cocher au Repair Lab.\n     pts : effet sur l'indice (positif = meilleure affaire pour l'acheteur). */\n  AD_KEYS = [\n    {id:'pieces', re:/pour (?:les )?pi[eè]ces|pour la pi[eè]ce|d[ée]faut majeur/i, k:'bad', nogo:true, pts:-45,\n     t:'« pour pièces »', arg:\"L'annonce indique « pour pièces » : je pars du principe que rien n'est garanti, mon prix en tient compte.\", impact:0},\n    {id:'bloque', re:/bloqu[ée]|verrouill[ée]|activation lock|icloud (?:actif|verrouill|non d[ée])|compte apple (?:actif|non d[ée])|toujours (?:li[ée]|associ[ée]) [àa] (?:un |une |l['’ ])?(?:compte|icloud)/i, k:'bad', nogo:true, pts:-50, cede:'deconnecte',\n     t:'Appareil bloqué / iCloud', arg:\"Tant qu'iCloud n'est pas déconnecté devant moi, l'appareil est invendable : je ne peux pas l'acheter.\", impact:0},\n    {id:'mort', re:/ne s['’ ]?allume (?:plus|pas)|ne d[ée]marre pas|[ée]cran noir|hs\\b/i, k:'bad', nogo:true, pts:-40,\n     t:'Ne s\\'allume plus', arg:\"Un appareil qui ne démarre pas peut être une carte mère : je ne peux pas miser dessus au prix demandé.\", impact:0},\n    {id:'eau', re:/tomb[ée] dans l['’ ]?eau|d[ée]g[aâ]t d['’ ]?eau|oxyd|humidit/i, k:'bad', nogo:true, pts:-45,\n     t:'Trace d\\'eau', arg:\"L'annonce mentionne un contact avec l'eau : la corrosion continue même si l'appareil marche aujourd'hui. Je passe.\", impact:0},\n    {id:'ecran', re:/[ée]cran (?:cass|fissur|bris|f[êe]l)|vitre (?:cass|fissur|bris)|[ée]cran [àa] changer/i, k:'bad', pts:-12,\n     t:'Écran cassé', repair:'R·06', dc:'ecr', arg:'Écran à remplacer : la pièce et la pose sont à ma charge.', impact:90},\n    {id:'dos', re:/(?:vitre|face|dos) arri[èe]re (?:cass|fissur|bris|f[êe]l)/i, k:'bad', pts:-8,\n     t:'Vitre arrière fissurée', repair:'R·02', dc:'vit', arg:'Vitre arrière fissurée : sur cette génération, c\\'est un transfert de châssis complet.', impact:60},\n    {id:'batt', re:/batterie (?:[àa] changer|faible|fatigu|us[ée]e|hs)|change[rz] la batterie|autonomie (?:faible|courte)/i, k:'bad', pts:-6,\n     t:'Batterie fatiguée', repair:'R·01', dc:'bat', arg:'Batterie à remplacer : cellule, pose et perte d\\'étanchéité à ma charge.', impact:25},\n    {id:'faceid', re:/face ?id (?:ne (?:fonctionne|marche) pas|hs|mort|d[ée]sactiv)/i, k:'bad', pts:-15,\n     t:'Face ID non fonctionnel', repair:'R·10', arg:'Face ID mort : c\\'est irréparable sans la puce d\\'origine, la revente en souffre directement.', impact:60},\n    {id:'cam', re:/cam[ée]ra (?:floue|cass|vibre|ne (?:fonctionne|marche) pas)|vitre (?:de )?cam[ée]ra/i, k:'bad', pts:-6,\n     t:'Caméra défaillante', repair:'R·04', dc:'cam', arg:'Bloc caméra à reprendre : lentille ou module, c\\'est une pièce et du temps.', impact:45},\n    {id:'telquel', re:/tel quel|vendu comme (?:vu|tel)|aucun (?:retour|remboursement)|sans garantie/i, k:'warn', pts:-8,\n     t:'Vendu tel quel', arg:'Vente sans aucun recours : c\\'est moi qui porte tout le risque après le paiement.', impact:0},\n    {id:'nofacture', re:/(?:sans|pas de|aucune) (?:facture|preuve d['’ ]?achat|re[çc]u)/i, k:'warn', pts:-6,\n     t:'Sans facture', arg:'Aucune preuve d\\'achat : je ne peux pas vérifier la provenance, ça pèse sur mon prix.', impact:0},\n    {id:'nobox', re:/(?:sans|pas de|aucune) (?:bo[îi]te|emballage|chargeur|c[âa]ble)/i, k:'warn', pts:-4,\n     t:'Sans boîte ni accessoires', arg:'Ni boîte ni câble : je dois refournir les accessoires avant de revendre.', impact:15},\n    {id:'urgent', re:/urgent|rapidement|d[ée]m[ée]nage|besoin d['’ ]?argent|doit partir|au plus vite/i, k:'ok', pts:12,\n     t:'Vendeur pressé', arg:'Vous cherchez à conclure vite : je paie comptant aujourd\\'hui, sans conditions, à mon prix.', impact:0},\n    {id:'nego', re:/n[ée]gociable|[àa] d[ée]battre|faire (?:une )?offre|meilleure offre/i, k:'ok', pts:10,\n     t:'Prix négociable', arg:'Vous annoncez le prix négociable : voici mon offre ferme, comptant, aujourd\\'hui.', impact:0},\n    {id:'ferme', re:/prix ferme|non n[ée]gociable|pas de n[ée]go/i, k:'warn', pts:-5,\n     t:'Prix annoncé ferme', arg:'Je comprends que le prix soit ferme — le mien l\\'est aussi, et il est comptant.', impact:0},\n    {id:'facture', re:/facture|preuve d['’ ]?achat|garantie apple|applecare/i, k:'ok', pts:10, cede:'nofacture',\n     t:'Facture / garantie', arg:'', impact:0},\n    {id:'boite', re:/(?:bo[îi]te|emballage) d['’ ]?origine|complet en bo[îi]te/i, k:'ok', pts:6, cede:'nobox',\n     t:'Boîte d\\'origine', arg:'', impact:0},\n    {id:'neuf', re:/[ée]tat (?:neuf|impeccable|nickel)|comme neuf|aucune rayure|jamais r[ée]par/i, k:'ok', pts:8,\n     t:'État annoncé impeccable', arg:'', impact:0},\n    {id:'deconnecte', re:/icloud d[ée]sactiv|d[ée]j[àa] d[ée]connect|localiser d[ée]sactiv/i, k:'ok', pts:8,\n     t:'iCloud déjà déconnecté', arg:'', impact:0}\n  ];\n\n  /* Analyse du texte collé + ancienneté de l'annonce. */\n  adScan(){\n    const s = this.state;\n    const txt = (s.adText || '');\n    const jours = Math.max(0, this.num(s.adDays));\n    if(!txt.trim()) return {vide:true, hits:[], score:0, nogo:false, args:[], jours};\n\n    /* Un signal positif cède devant sa négation : « sans facture » l'emporte\n       sur « facture ». Évite les lookbehind, absents des Safari anciens. */\n    const bruts = this.AD_KEYS.filter(k => k.re.test(txt));\n    const ids = bruts.map(h => h.id);\n    const hits = bruts.filter(h => !(h.cede && ids.indexOf(h.cede) !== -1));\n    let score = 55;\n    hits.forEach(h => { score += h.pts; });\n\n    /* Une annonce qui traîne affaiblit le vendeur : c'est un levier, pas un défaut. */\n    const pressure = jours >= 21 ? 15 : jours >= 14 ? 10 : jours >= 7 ? 5 : 0;\n    score += pressure;\n    /* Batterie jamais évoquée : inconnue à provisionner. */\n    const battMuet = !/batterie|autonomie|sant[ée]/i.test(txt);\n    if(battMuet) score -= 8;\n\n    score = Math.max(0, Math.min(100, Math.round(score)));\n    const nogo = hits.some(h => h.nogo);\n\n    const args = [];\n    if(pressure) args.push({t:'Annonce en ligne depuis ' + jours + ' jours',\n      d:'Pression vendeur +' + pressure + ' points — rappelle-lui simplement que tu es là aujourd\\'hui, comptant.',\n      v:'−' + pressure + ' % de résistance'});\n    if(battMuet) args.push({t:'Batterie non mentionnée',\n      d:'Aucune indication de santé : provisionne un remplacement tant que tu n\\'as pas vu l\\'écran Réglages → Batterie.',\n      v:'−25 $ à provisionner'});\n    hits.filter(h => h.arg).forEach(h => args.push({t:h.t, d:h.arg, v: h.impact ? '−' + h.impact + ' $' : 'levier'}));\n\n    return {vide:false, hits, score, nogo, args, jours, pressure, battMuet};\n  }\n\n  /* Coche au Repair Lab les réparations que l'annonce annonce elle-même. */\n  adApplyRepairs(){\n    const r = this.adScan();\n    if(r.vide) return;\n    const codes = Object.keys(this.state.picks);\n    const dc = Object.assign({}, this.state.dc);\n    let n = 0;\n    r.hits.forEach(h => {\n      if(h.repair && codes.indexOf(h.repair) === -1){ codes.push(h.repair); n++; }\n      if(h.dc) dc[h.dc] = true;\n    });\n    this.setState({dc});\n    this.applyPreset(codes);\n    this.setState({adApplied: n});\n    clearTimeout(this._adT);\n    this._adT = setTimeout(() => this.setState({adApplied:null}), 2600);\n  }\n\n  /* Envoie les arguments détectés vers le conseiller de discussion. */\n  adToChat(){\n    const r = this.adScan();\n    if(r.vide) return;\n    this.setState({chatPhase:'contre'});\n    const lignes = r.args.slice(0,3).map(a => '• ' + a.t + ' — ' + a.v);\n    this.copyChat('ad', 'Points relevés dans votre annonce :\\n' + lignes.join('\\n')\n      + '\\n\\nC\\'est ce qui m\\'amène à ' + Math.round(this.pamResult().pam) + ' $ maximum, comptant, aujourd\\'hui.');\n  }\n\n  /* ══════════ Visuels produit & fiches techniques ══════════\n     Rendus vectoriels plutôt que photographies distantes : nets à toute\n     taille, zéro octet réseau, et l'application reste utilisable hors ligne.\n     Les coloris reprennent les teintes d'origine de chaque génération.\n     Géom  rester lisible sur fond noir. */\n  isLightHex(hex){\n    const n = parseInt(hex.slice(1), 16);\n    return (((n >> 16 & 255) * 299 + (n >> 8 & 255) * 587 + (n & 255) * 114) / 1000) > 140;\n  }\n\n  /* ══════════ Conseiller de discussion Marketplace ══════════\n     Quatre phases de conversation, du premier message à la relance. */\n  CHAT_PHASES = [\n    {id:'contact', num:'01', label:'Premier contact'},\n    {id:'contre',  num:'02', label:'Contre-offre'},\n    {id:'rdv',     num:'03', label:'Fixer RDV'},\n    {id:'relance', num:'04', label:'Relance ghosting'}\n  ];\n\n  /* Défauts constatés, formulés pour un message au vendeur. */\n  chatDefects(){\n    const s = this.state, m = this.curModel(), out = [];\n    const battNum = parseInt(this.batteryEstimate(m).pct, 10);\n    if(s.dc.bat || (battNum && battNum < 85)) out.push('batterie à ' + this.batteryEstimate(m).pct);\n    this.DECOTES.filter(d => d.id !== 'bat' && s.dc[d.id]).forEach(d => out.push(d.l.toLowerCase()));\n    return out;\n  }\n\n  chatMessages(){\n    const m = this.curModel(), r = this.pamResult();\n    const nom = m ? m.n : 'appareil';\n    const offre = Math.round(r.pam * 0.8) + ' $';\n    const pam = Math.round(r.pam) + ' $';\n    const def = this.chatDefects();\n    const defTxt = def.length ? def.slice(0,3).join(', ') : 'la remise en état et la garantie que j’offre ensuite';\n\n    const P = {\n      contact: [\n        {k:'c1', t:'Offre ferme et courtoise',\n         x:'Bonjour, votre ' + nom + ' m’intéresse. Est-il toujours disponible ? Si oui, je peux venir le récupérer aujourd’hui à ' + offre + ' comptant.'},\n        {k:'c2', t:'Avec validation de l’état',\n         x:'Bonjour ! Votre ' + nom + ' est-il encore disponible ? Deux questions avant de me déplacer : quelle est la santé de la batterie dans Réglages, et l’appareil est-il bien déconnecté d’iCloud ? Si tout est propre, je suis à ' + offre + ' comptant aujourd’hui.'},\n        {k:'c3', t:'Créneau déjà proposé',\n         x:'Bonjour, je suis intéressé par votre ' + nom + '. Je peux passer aujourd’hui ou demain avec ' + offre + ' comptant. Dites-moi ce qui vous arrange, je m’adapte à votre horaire.'}\n      ],\n      contre: [\n        {k:'k1', t:'Cadrage sur le plafond',\n         x:'Je comprends votre prix, mais compte tenu des frais de reconditionnement (' + defTxt + '), mon plafond absolu est de ' + pam + '. Si vous changez d’avis aujourd’hui, mon offre reste valable.'},\n        {k:'k2', t:'Chiffré, point par point',\n         x:'Votre prix se défend pour un appareil impeccable. Sur celui-ci il y a ' + defTxt + ', et c’est moi qui absorbe la remise en état. C’est ce qui m’amène à ' + pam + ' maximum. Je paie comptant, tout de suite, et je me déplace.'},\n        {k:'k3', t:'Départ propre, porte ouverte',\n         x:'Alors on ne va pas se faire perdre de temps : au-dessus de ' + pam + ', l’opération n’a plus de sens pour moi. Aucun souci si vous trouvez mieux — gardez mon numéro, mon offre tient si l’acheteur ne se présente pas.'}\n      ],\n      rdv: [\n        {k:'r1', t:'Lieu public standard',\n         x:'Parfait ! On peut se rejoindre dans un endroit public sécurisé (ex : Tim Hortons / station-service). Quel créneau vous convient le mieux cet après-midi ?'},\n        {k:'r2', t:'Poste de police — montant élevé',\n         x:'Très bien. Pour que ce soit sécurisant des deux côtés, je propose le stationnement du poste de police de quartier — c’est éclairé et sous caméra. J’apporte le montant exact en comptant. Quelle heure vous convient ?'},\n        {k:'r3', t:'Confirmation avec rappel des contrôles',\n         x:'C’est noté. Avant de conclure sur place, on fera ensemble : *#06# pour l’IMEI, Réglages → Batterie, et la déconnexion iCloud avec votre mot de passe. Trois minutes, et je vous remets l’argent. On se dit quelle heure ?'}\n      ],\n      relance: [\n        {k:'g1', t:'Relance à 6 h — même journée',\n         x:'Bonjour ! Je finalise mes achats pour la journée. Mon offre à ' + offre + ' tient toujours jusqu’à 18 h si vous souhaitez conclure rapidement.'},\n        {k:'g2', t:'Relance à 24 h — dernier rappel',\n         x:'Bonjour, je reviens vers vous une dernière fois pour le ' + nom + '. Mon offre de ' + offre + ' comptant reste valable aujourd’hui ; après quoi je réalloue le budget sur un autre appareil. Aucun souci si ce n’est plus d’actualité, dites-le-moi simplement.'},\n        {k:'g3', t:'Réveil d’une annonce ancienne',\n         x:'Bonjour, votre ' + nom + ' est-il toujours à vendre ? Si l’annonce traîne depuis un moment, je vous propose ' + offre + ' comptant, sans négociation et sans vous faire attendre. Je peux passer aujourd’hui.'}\n      ]\n    };\n    return P[this.state.chatPhase] || P.contact;\n  }\n\n  download(name, mime, text){\n    try{\n      const blob = new Blob([text], {type: mime});\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url; a.download = name;\n      document.body.appendChild(a); a.click(); a.remove();\n      setTimeout(() => URL.revokeObjectURL(url), 4000);\n    }catch(e){}\n  }\n\n  exportCsv(){\n    const head = 'type;modele;canal;achat;pieces;prv;marge_projetee;jours;statut';\n    const lines = this.state.pipe.map(p => {\n      const marge = Math.round(p.prv * 0.95 - p.achat - p.pieces - 26);\n      return ['stock', p.model, p.chan || 'Marketplace', p.achat, p.pieces, p.prv, marge, p.days, this.PIPE_COLS[p.col]].join(';');\n    }).concat(this.state.history.map(h => ['calcul', h.model, '', h.pam, h.pieces, h.prv, h.profit, '', 'PAM mémorisé'].join(';')));\n    this.download('flip-phone-mtl-' + new Date().toISOString().slice(0,10) + '.csv', 'text/csv;charset=utf-8', [head].concat(lines).join('\\n'));\n  }\n\n  exportJson(){\n    const s = this.state;\n    this.download('flip-phone-mtl-' + new Date().toISOString().slice(0,10) + '.json', 'application/json',\n      JSON.stringify({exporte: new Date().toISOString(), pipeline: s.pipe, historique: s.history, reglages: {kit:s.kit, deplac:s.deplac, garantie:s.garantie, casse:s.casse, margeAbs:s.margeAbs, roiMin:s.roiMin, taux:s.taux}, prvAjustes: s.prvOverride, stockPieces: s.stock, notes: s.notes}, null, 2));\n  }\n\n  setChan(id, chan){ this.setState(s => ({pipe: s.pipe.map(p => p.id === id ? Object.assign({}, p, {chan}) : p)})); }\n\n  num(v){ const x = parseFloat(v); return isFinite(x) ? x : 0; }\n  fmt(n){ return (n<0?'−':'') + Math.abs(Math.round(n)).toLocaleString('fr-CA') + ' $'; }\n  set(key){ return e => this.setState({[key]: e.target.value}); }\n  setIn(group,key){ return e => this.setState(s => ({[group]: Object.assign({}, s[group], {[key]: e.target.value})})); }\n\n  pamSolve(P){\n    const test = prix => {\n      const invest = prix + P.pieces + P.frais + P.temps;\n      const profit = P.prvNet - invest - P.reserve - P.casse;\n      const exig = Math.max(P.margeAbs, invest * P.roiMin / 100) + P.prime;\n      return {invest, profit, exig, ok: profit >= exig};\n    };\n    const zero = test(0);\n    if(!zero.ok) return Object.assign({pam:0, iter:0, impossible:true}, zero);\n    let lo = 0, hi = P.prvNet, it = 0;\n    while(hi - lo > 0.5 && it < 64){ const mid = (lo+hi)/2; if(test(mid).ok) lo = mid; else hi = mid; it++; }\n    return Object.assign({pam:lo, iter:it, impossible:false}, test(lo));\n  }\n\n  terrainScore(){\n    const src = this.state.terrainSub === 'pre' ? this.PREV : this.CHECKS;\n    const store = this.state.terrainSub === 'pre' ? this.state.pv : this.state.ck;\n    let ko = 0, untested = 0, blockKo = 0, filled = 0;\n    src.forEach(c => {\n      const st = store[c.id];\n      if(st) filled++;\n      if(c.type === 'B'){ if(st === 'ko') blockKo++; }\n      else if(st === 'ko') ko += c.w;\n      else if(!st) untested += c.w;\n    });\n    const risk = filled === 0 ? 0 : Math.min(100, Math.round(ko + untested * 0.5));\n    return {risk, blockKo, filled, total: src.length, src, store};\n  }\n\n  curModel(){ return this.MODELS.find(m => m.id === this.state.modelId) || null; }\n  prvOf(m){ const o = this.state.prvOverride[m.id]; return o === undefined ? m.prv : this.num(o); }\n\n  pamResult(){\n    const s = this.state;\n    /* Pricing dynamique : tant que le champ PRV porte encore la valeur calibrée\n       du modèle, la dépréciation du jour s'applique d'elle-même. Dès que tu\n       saisis un chiffre à toi, c'est le tien qui gagne. */\n    let prv = this.num(s.prv);\n    const mDep = this.curModel();\n    if(mDep && s.depOn && Math.round(prv) === this.prvOf(mDep)) prv = this.depPrv(mDep);\n    const prvNet = prv * (1 - this.num(s.negoBuy)/100);\n    const pieces = this.num(s.pieces);\n    const temps = s.mode === 'travail' ? 0 : this.num(s.temps)/60*this.num(s.taux);\n    const frais = this.num(s.kit) + this.num(s.deplac);\n    const reserve = prv * this.num(s.garantie)/100;\n    const casse = prv * this.num(s.casse)/100;\n    const t = this.terrainScore();\n    const prime = t.risk/100 * this.num(s.primeMax);\n    const r = this.pamSolve({prvNet, pieces, frais, temps, reserve, casse, margeAbs:this.num(s.margeAbs), roiMin:this.num(s.roiMin), prime});\n    const costs = pieces + frais + temps + reserve + casse;\n    return Object.assign({}, r, {prv, prvNet, pieces, temps, frais, reserve, casse, prime, risk:t.risk, blockKo:t.blockKo, costs, ratio: prvNet>0 ? costs/prvNet*100 : 0, piecesRatio: prv>0 ? pieces/prv*100 : 0});\n  }\n\n  modelLine(m){\n    const s = this.state;\n    const prv = s.depOn ? this.depPrv(m) : this.prvOf(m);\n    const base = {prvNet: prv*(1-this.num(s.negoBuy)/100), pieces:m.rec, frais:this.num(s.kit)+this.num(s.deplac),\n      temps: 25/60*this.num(s.taux), reserve: prv*this.num(s.garantie)/100, casse: prv*this.num(s.casse)/100, prime:0};\n    const strict = this.pamSolve(Object.assign({}, base, {margeAbs:70, roiMin:30}));\n    const mine = this.pamSolve(Object.assign({}, base, {margeAbs:this.num(s.margeAbs), roiMin:this.num(s.roiMin)}));\n    const roi = mine.invest > 0 ? mine.profit/mine.invest*100 : 0;\n    return {prv, strict, mine, roi, perDay: mine.profit/Math.max(1,m.rot)};\n  }\n\n  advance(id){ this.setState(s => ({pipe: s.pipe.map(p => p.id === id ? Object.assign({}, p, {col: Math.min(3, p.col+1)}) : p)})); }\n\n  /* Sortie complète du stock : le capital immobilisé et les KPI suivent. */\n  retirerDuStock(id){ this.setState(s => ({pipe: s.pipe.filter(p => p.id !== id)})); }\n\n  /* Remet l'appareil au tout début du parcours sans le supprimer. */\n  resetCarte(id){\n    this.setState(s => ({pipe: s.pipe.map(p => p.id === id\n      ? Object.assign({}, p, {col:0, days:0, t0: Date.now(), flash:false}) : p)}));\n  }\n\n  setBuyerCarte(id, buyerId){\n    this.setState(s => ({pipe: s.pipe.map(p => p.id === id ? Object.assign({}, p, {buyer:buyerId}) : p)}));\n  }\n\n  /* Valeur épinglée à la main sur une ligne du catalogue, sinon la valeur\n     calculée. Un champ vidé rend la main au calcul. */\n  ov1(map, id, calc){\n    const v = this.state[map][id];\n    if(v === undefined || v === '') return {v: calc, edit:false};\n    const n = this.num(v);\n    return {v: n, edit: Math.round(n) !== Math.round(calc)};\n  }\n\n  setOv(map, id, val){\n    this.setState(s => {\n      const next = Object.assign({}, s[map]);\n      if(val === '' || val === null) delete next[id]; else next[id] = val;\n      return {[map]: next};\n    });\n  }\n\n  resetOverrides(){\n    this.setState({prvOverride:{}, pamOverride:{}, marcheOverride:{}, strictOverride:{}, roiOverride:{}});\n  }\n\n  /* Répartition d'un cycle entre réinvestissement et les deux associés. */\n  splitProfit(){\n    const s = this.state;\n    const profit = this.num(s.ro.profit);\n    const partReinv = Math.min(100, Math.max(0, this.num(s.split.reinvest)));\n    const pctA = Math.min(100, Math.max(0, this.num(s.split.a)));\n    const reinv = profit * partReinv / 100;\n    const distribuable = profit - reinv;\n    const partA = distribuable * pctA / 100;\n    const partB = distribuable - partA;\n    return {profit, reinv, distribuable, partA, partB, pctA, pctB: 100 - pctA, partReinv,\n      nomA: s.split.nomA || 'Associé A', nomB: s.split.nomB || 'Associé B',\n      /* Sur dix cycles, l'écart entre tout réinvestir et tout distribuer\n         devient l'argument le plus concret d'une association. */\n      an: {reinv: reinv * 10, a: partA * 10, b: partB * 10}};\n  }\n\n  copyDeal(){\n    const r = this.pamResult();\n    const m = this.curModel();\n    const txt = 'FLIP PHONE — FICHE DEAL\\nModèle : ' + (m?m.n:'—') + '\\nPRV : ' + this.state.prv + ' $\\nPièces : ' + this.state.pieces + ' $\\nRisque : ' + r.risk + '/100\\nPAM : ' + this.fmt(r.pam) + '\\nOuverture : ' + this.fmt(r.pam*0.8) + '\\nProfit net : ' + this.fmt(r.profit);\n    if(navigator.clipboard) navigator.clipboard.writeText(txt);\n    this.setState({copied:true});\n    clearTimeout(this._ct);\n    this._ct = setTimeout(() => this.setState({copied:false}), 1600);\n  }\n\n  sendToPipeline(){\n    const r = this.pamResult();\n    const m = this.curModel();\n    if(!m || r.pam <= 0) return;\n    this.setState(s => ({view:'pipeline', pipe: s.pipe.concat([{id: Date.now(), model: m.n, achat: Math.round(r.pam), pieces: this.num(s.pieces), prv: this.num(s.prv), col:0, days:0, t0: Date.now(), lieu:'Chez moi'}])}));\n  }\n\n  resetDeal(){ this.setState({modelId:'12', prv:'300', pieces:'22', temps:'25', picks:{'R·01':true}, ck:{}, pv:{}, dc:{}, view:'pam', pamSub:'maxbid'}); }\n\n  toggleRepair(code){\n    this.setState(s => {\n      const picks = Object.assign({}, s.picks);\n      if(picks[code]) delete picks[code]; else picks[code] = true;\n      const gen = (this.MODELS.find(m => m.id === s.modelId) || {gen:'g11'}).gen;\n      const g = this.GRADES.find(x => x.id === s.grade) || this.GRADES[2];\n      let cost = 0, min = 0, risk = 0;\n      this.REPAIRS.filter(r => picks[r.code]).forEach(r => {\n        cost += r.piece ? this.PIECES.find(p => p.id === r.piece).p[gen] * g.kp : 0;\n        min += r.temps * g.kt;\n        risk = Math.max(risk, (this.REPAIR_RISK[r.code] || {casse:1}).casse);\n      });\n      return {picks, pieces: String(Math.round(cost)), temps: String(Math.round(min)), casse: String(risk || 1)};\n    });\n  }\n\n  pickModel(id){\n    const m = this.MODELS.find(x => x.id === id);\n    if(!m) return;\n    this.setState(s => {\n      let cost = 0, min = 0, risk = 0;\n      this.REPAIRS.filter(r => s.picks[r.code]).forEach(r => {\n        cost += r.piece ? this.PIECES.find(p => p.id === r.piece).p[m.gen] : 0;\n        min += r.temps; risk = Math.max(risk, r.casse || 0);\n      });\n      return {modelId:id, prv: String(this.prvToday(m)), pieces: String(Math.round(cost)), temps: String(min), casse: String(risk || 1)};\n    });\n  }\n\n  tri(group,id){\n    return () => this.setState(s => {\n      const st = Object.assign({}, s[group]);\n      st[id] = st[id] === 'ok' ? 'ko' : st[id] === 'ko' ? undefined : 'ok';\n      if(!st[id]) delete st[id];\n      return {[group]: st};\n    });\n  }\n\n  renderVals(){\n    const s = this.state;\n    const theme = s.theme || this.props.theme || 'oled';\n    const dark = theme !== 'light';\n    const accent = this.props.accent || (dark ? '#ff563c' : '#dd2b0f');\n    const ACC = 'var(--fp-accent)', INK = 'var(--fp-ink)', INK2 = 'var(--fp-ink-2)', INK3 = 'var(--fp-ink-3)';\n    const ON = 'var(--fp-on-accent)', PANEL = 'var(--fp-panel)', PANEL2 = 'var(--fp-panel-2)', PANEL3 = 'var(--fp-panel-3)', LINE = 'var(--fp-line)', LINES = 'var(--fp-line-strong)';\n    const on = {bg: ACC, fg: ON}, off = {bg:'transparent', fg: INK2};\n\n    const r = this.pamResult();\n    const t = this.terrainScore();\n    const modeSpec = {prudent:{taux:'20',gar:'6',casse:'4'}, standard:{taux:'20',gar:'4',casse:null}, travail:{taux:'20',gar:'4',casse:null}};\n\n    // KPIs\n    const open = s.pipe.filter(p => p.col < 3);\n    const engaged = open.reduce((a,p) => a + p.achat + p.pieces, 0);\n    const capital = this.num(s.ro.capital);\n    const dispo = capital - engaged;\n    const margins = s.pipe.map(p => p.prv*0.95 - p.achat - p.pieces - 26);\n    const margeMoy = margins.length ? margins.reduce((a,b)=>a+b,0)/margins.length : 0;\n    const rotMoy = open.length ? open.reduce((a,p)=>a+p.days,0)/open.length : this.num(s.ro.delai);\n    // sparklines de l'en-tête\n    const cs = this.cashSeries(dispo);\n    const sparkFree = this.spark(cs.free, 200, 56);\n    const sparkHeld = this.spark(cs.held, 200, 56);\n    const margeSeries = s.history.length > 1 ? s.history.slice().reverse().map(h => h.profit) : [margeMoy*0.7, margeMoy*0.9, margeMoy, margeMoy*1.08];\n    const sparkMarge = this.spark(margeSeries, 150, 44);\n\n    const kpis = [\n      {lab:'Capital disponible', val:this.fmt(dispo), sub: this.fmt(engaged) + ' immobilisés sur ' + this.fmt(capital), color: dispo < 200 ? ACC : INK, bar: Math.max(0,Math.min(100, dispo/Math.max(1,capital)*100)) + '%', barColor: this.gauge3(100 - dispo/Math.max(1,capital)*100, 65, 85)},\n      {lab:'Marge nette moyenne', val:this.fmt(margeMoy), sub:'projetée sur ' + s.pipe.length + ' appareils', color: margeMoy < 90 ? ACC : INK, bar: Math.min(100, margeMoy/200*100) + '%', barColor: margeMoy < 90 ? 'var(--fp-bad)' : margeMoy < 120 ? 'var(--fp-warn)' : 'var(--fp-ok)', spark: sparkMarge.line, sparkArea: sparkMarge.area, hasSpark:true},\n      {lab:'Unités en stock', val:String(open.length), sub:'dont ' + open.filter(p=>p.days>14).length + ' au-delà de 14 jours', color: INK, bar: Math.min(100, open.length/4*100) + '%', barColor: open.filter(p=>p.days>14).length ? 'var(--fp-warn)' : 'var(--fp-ok)'},\n      {lab:'Rotation moyenne', val: Math.round(rotMoy) + ' j', sub: rotMoy > 14 ? 'au-delà du seuil de coupe' : 'cible 7 à 10 jours', color: rotMoy > 14 ? ACC : INK, bar: Math.min(100, rotMoy/21*100) + '%', barColor: this.gauge3(rotMoy, 11, 15)}\n    ];\n\n    const navItems = this.VIEWS.map((v,i) => ({\n      num: String(i).padStart(2,'0'), label: v.label,\n      bg: s.view === v.id ? PANEL3 : 'transparent',\n      fg: s.view === v.id ? INK : INK2,\n      numFg: s.view === v.id ? INK2 : INK3,\n      rule: s.view === v.id ? ACC : 'transparent',\n      onClick: () => this.setState({view: v.id})\n    }));\n\n    const seg = (list, cur, onPick) => list.map(x => ({\n      label: x.label, bg: cur === x.id ? ACC : 'transparent', fg: cur === x.id ? ON : INK2,\n      onClick: () => onPick(x.id)\n    }));\n\n    const m = this.curModel();\n    const gen = m ? m.gen : 'g11';\n\n    // repair picker\n    const repairPicks = this.REPAIRS.filter(x => x.niv <= 2).map(x => {\n      const c = x.piece ? this.PIECES.find(p => p.id === x.piece).p[gen] : 0;\n      const picked = !!s.picks[x.code];\n      return {t:x.t, meta: x.temps + ' min · gain revente ≈ ' + x.gain[gen] + ' $', cost: c ? c + ' $' : '0 $',\n        boxBg: picked ? ACC : 'transparent', boxLine: picked ? ACC : LINES,\n        onClick: () => this.toggleRepair(x.code)};\n    });\n\n    // verdict\n    let verdictHtml, verdictTag, verdictBg = 'transparent', verdictFg = INK2, verdictLine = LINE;\n    if(s.locked){\n      verdictHtml = 'Deal verrouillé manuellement sur le terrain : un élément éliminatoire a été constaté. Déverrouille depuis la vue Terrain si c\\u2019était une fausse alerte.';\n      verdictTag = 'Verrouillé — no-go'; verdictBg = ACC; verdictFg = ON; verdictLine = ACC;\n    } else if(t.blockKo > 0){\n      verdictHtml = 'Un point bloquant est marqué défaillant dans la checklist Terrain. Tu te lèves et tu pars, peu importe le prix affiché ci-dessus.';\n      verdictTag = 'No-go bloquant'; verdictBg = ACC; verdictFg = ON; verdictLine = ACC;\n    } else if(r.prv <= 0){\n      verdictHtml = \"En attente d'un prix de revente. Choisis un modèle ou saisis un PRV.\";\n      verdictTag = 'En attente';\n    } else if(r.impossible || r.pam <= 0){\n      verdictHtml = 'Impossible. Même gratuit, les coûts et ta marge exigée dépassent ce que la revente rapporte. Soit ton PRV est trop bas, soit tu : x.code}))};\n    });\n\n    // models table\n    const zoneLab = {volume:'Volume', marge:'Marge', ceo:'CEO', bas:'Bas volume'};\n    const sortKey = s.mdSort.key, sortDir = s.mdSort.dir;\n    const mdSource = this.MODELS.filter(x => (s.mdFilter === 'all' || x.zone === s.mdFilter) && (s.mdGen === 'all' || x.gen === s.mdGen))\n      .map(x => ({m:x, l:this.modelLine(x)}));    if(sortKey !== 'none'){\n      const get = o => sortKey === 'prv' ? o.l.prv : sortKey === 'strict' ? o.l.strict.pam : sortKey === 'ton' ? o.l.mine.pam\n        : sortKey === 'roi' ? o.l.roi : sortKey === 'perDay' ? o.l.perDay : sortKey === 'rot' ? o.m.rot : 0;\n      mdSource.sort((a,b) => (get(a) - get(b)) * sortDir);\n    }\n    const mdRows = mdSource.map(o => {\n      const x = o.m, l = o.l;\n      const edited = s.prvOverride[x.id] !== undefined && this.num(s.prvOverride[x.id]) !== x.prv;\n      const oMar = this.ov1('marcheOverride', x.id, x.pamMarche);\n      const oStr = this.ov1('strictOverride', x.id, l.strict.pam);\n      const oPam = this.ov1('pamOverride',    x.id, l.mine.pam);\n      const oRoi = this.ov1('roiOverride',    x.id, l.roi);\n      /* Un PAM épinglé à la main recalcule la marge et le gain journalier. */\n      const profitEff = oPam.edit ? (l.mine.invest > 0 ? l.mine.profit + (l.mine.pam - oPam.v) : 0) : l.mine.profit;\n      const perDayEff = profitEff / Math.max(1, x.rot);\n      return {n:x.n, an:x.an, prv:String(l.prv), rec:x.rec + ' $',\n        dev: this.deviceView(x, 0),\n        onSheet: () => this.ov({sheet:x.id, sheetCol:0}),\n        pamMarche: String(Math.round(oMar.v)), marLine: oMar.edit ? ACC : LINE,\n        onMarche: e => this.setOv('marcheOverride', x.id, e.target.value),\n        pamStrict: String(Math.round(oStr.v)), strLine: oStr.edit ? ACC : LINE,\n        onStrict: e => this.setOv('strictOverride', x.id, e.target.value),\n        tonPam: String(Math.round(oPam.v)), pamLine: oPam.edit ? ACC : LINE,\n        onTonPam: e => this.setOv('pamOverride',
