bFraisUnit - r.reserve - r.casse;\n    const bProfit = bq * bProfitUnit;\n    const bRoi = bInvest > 0 ? bProfit/bInvest*100 : 0;\n    const bCapital = this.num(s.ro.capital) - this.num(s.ro.coussin);\n    /* Prix total maximal du lot pour atteindre la marge globale visée. */\n    const bTarget = this.num(s.bulkTarget);\n    const bMaxTotal = Math.max(0, bq * (r.prvNet - r.pieces - bKit - r.reserve - r.casse) - bDeplac - bTarget);\n    const bMaxUnit = bMaxTotal / bq;\n    const bEconomie = bq * r.frais - (bq * bKit + bDeplac);\n\n    // cash-flow selon le délai de vente\n    const cashRows = [7,14,30].map(j => {\n      const cycles = 30/j;\n      const dep = m ? r.prv * m.dep/100 * (j/30) : 0;\n      return {j: j + ' jours', profit: this.fmt(r.profit - dep), mensuel: this.fmt((r.profit - dep) * cycles),\n        immo: this.fmt(r.invest) + ' bloqués ' + j + ' j', dep: '−' + this.fmt(dep) + ' de dépréciation',\n        color: j <= 7 ? 'var(--fp-ok)' : j <= 14 ? 'var(--fp-warn)' : 'var(--fp-bad)'};\n    });\n    const oppDaily = r.profit > 0 ? r.profit / 9 : 0;\n    const oppCost = oppDaily * 10;\n\n    // répartition du capital immobilisé par génération\n    const byGen = {};\n    open.forEach(p => {\n      const mm = this.MODELS.find(x => p.model.indexOf(x.n) === 0) || this.MODELS.find(x => p.model.indexOf(x.n) >= 0);\n      const g = mm ? mm.gen : 'g11';\n      byGen[g] = (byGen[g] || 0) + p.achat + p.pieces;\n    });\n    const genTotal = Object.keys(byGen).reduce((a,k) => a + byGen[k], 0) || 1;\n    const capitalMix = Object.keys(byGen).map((g,i) => ({lab: this.GENLAB[g], val: this.fmt(byGen[g]),\n      pct: Math.round(byGen[g]/genTotal*100) + ' %', width: (byGen[g]/genTotal*100) + '%',\n      color: i % 2 ? 'var(--fp-accent)' : 'var(--fp-ink-2)'}));\n\n    // taux horaire effectif\n    const hrs = this.num(s.temps)/60;\n    const effRate = hrs > 0 ? r.profit/hrs : 0;\n\n    // surévaluation vendeur\n    const askRef = this.num(s.invAsk) || this.num(s.dcDemande);\n    const over = r.prv > 0 && askRef > r.prv * 1.15;\n    const overPct = r.prv > 0 && askRef > 0 ? Math.round((askRef/r.prv - 1) * 100) : 0;\n\n    const guide = s.guide ? this.GUIDES[s.guide] : null;\n\n    const invAsk = this.num(s.invAsk);\n    const invInvest = invAsk + r.pieces + r.frais + r.temps;\n    const invProfit = r.prvNet - invInvest - r.reserve - r.casse;\n    const invRoi = invInvest > 0 ? invProfit / invInvest * 100 : 0;\n    const invGap = r.pam - invAsk;\n\n    const GENHUE = {g11:'#4a8fd6', g12:'#4fbd8a', g13:'#8a7fd6', g14:'#d6a24f', g15:'#d65f4f'};\n    const histRows = s.history.map(h => {\n      const hm = this.MODELS.find(x => x.id === h.modelId);\n      const badge = h.pam <= 0 ? 'NO-GO' : h.roi >= 45 ? 'ROI ÉLEVÉ' : h.profit >= this.num(s.margeAbs) ? 'DEAL VALIDÉ' : 'MARGE FAIBLE';\n      return {\n        model: h.model, pam: this.fmt(h.pam),\n        meta: 'profit ' + this.fmt(h.profit) + ' · ROI ' + h.roi + ' % · risque ' + h.risk + '/100',\n        badge,\n        badgeFg: badge === 'NO-GO' ? ON : badge === 'ROI ÉLEVÉ' ? '#1b1400' : badge === 'DEAL VALIDÉ' ? '#04231a' : INK,\n        badgeBg: badge === 'NO-GO' ? 'var(--fp-bad)' : badge === 'ROI ÉLEVÉ' ? 'var(--fp-warn)' : badge === 'DEAL VALIDÉ' ? 'var(--fp-ok)' : 'transparent',\n        hue: hm ? GENHUE[hm.gen] : INK3,\n        dev: this.deviceView(hm, 0),\n        gen: hm ? this.GENLAB[hm.gen] : '—',\n        onRestore: () => this.setState({modelId:h.modelId, prv:String(h.prv), pieces:String(h.pieces), view:'pam', pamSub:'maxbid'}),\n        onRemove: () => this.setState(st => ({history: st.history.filter(x => x.id !== h.id)}))\n      };\n    });\n\n    const months = this.monthsSince();\n    const depSuggestVal = m ? this.depPrv(m) : 0;\n    const dg = this.depGap(m);\n    /* le QR n'est calculé que lorsque la fiche est ouverte : inutile de le\n       recalculer à chaque frappe dans un champ */\n    const qrF = s.fiche ? this.qrPath(this.ficheText()) : {d:'', n:0};\n    const adR concat(this.GENS.map(g => ({id:g, label:this.GENLAB[g]}))).map(x => ({\n        label:x.label, bg: s.mdGen === x.id ? ACC : 'transparent', fg: s.mdGen === x.id ? ON : INK2,\n        onClick: () => this.setState({mdGen:x.id})})),\n      mdSortCols: [\n        {key:'prv',label:'PRV'},{key:'strict',label:'PAM strict'},{key:'ton',label:'Ton PAM'},\n        {key:'roi',label:'ROI'},{key:'perDay',label:'$/jour'},{key:'rot',label:'Rotation'}\n      ].map(c => ({label: c.label + (sortKey === c.key ? (sortDir < 0 ? ' ↓' : ' ↑') : ''),\n        bg: sortKey === c.key ? ACC : 'transparent', fg: sortKey === c.key ? ON : INK2,\n        onClick: () => this.setState(st => ({mdSort: st.mdSort.key === c.key ? {key:c.key, dir: st.mdSort.dir * -1} : {key:c.key, dir:-1}}))})),\n      rcFields: mkFields([\n        {lab:'PRV du modèle ($)', value:s.rc.prv, onChange:this.setIn('rc','prv')},\n        {lab:'PAM envisagé ($)', sub:'celui d\\'un tableau de marché, par exemple', value:s.rc.pam, onChange:this.setIn('rc','pam')},\n        {lab:'Coût de reconditionnement ($)', value:s.rc.piece, onChange:this.setIn('rc','piece')}\n      ]),\n      rcMinis: [\n        {lab:'Marge brute affichée', val:this.fmt(rcBrut), color: INK},\n        {lab:'Marge nette réelle', val:this.fmt(rcNet), color: rcNet < 90 ? ACC : INK},\n        {lab:'Écart', val:this.fmt(rcBrut - rcNet), color: ACC},\n        {lab:'ROI net', val: rcRoi.toFixed(0) + ' %', color: rcRoi < this.num(s.roiMin) ? ACC : INK}\n      ],\n      rcVerdict: rcNet < 90 ? 'À ce PAM, il reste ' + this.fmt(rcNet) + ' net : sous le plancher de 90 $. La marge brute de ' + this.fmt(rcBrut) + ' est un mirage — l\\'écart de ' + this.fmt(rcBrut - rcNet) + ' part en négo acheteur, réserve, casse, frais et temps.'\n        : 'Il reste ' + this.fmt(rcNet) + ' net pour ' + this.fmt(rcNetInvest) + ' immobilisés, soit ' + rcRoi.toFixed(0) + ' % de ROI. L\\'écart avec la marge brute affichée est de ' + this.fmt(rcBrut - rcNet) + '.',\n\n      pipeCols: this.PIPE_COLS.map((n,i) => ({n, count: s.pipe.filter(p => p.col === i).length,\n        cards: s.pipe.filter(p => p.col === i).map(p => {\n          const e = this.cardEco(p);\n          const alerte = e.alerte && p.col < 3;\n          return {\n            model:p.model, money: this.fmt(p.achat) + ' + ' + this.fmt(p.pieces) + ' → PRV ' + this.fmt(e.prvCanal),\n            days: p.col === 3 ? 'clôturé' : e.days + ' jours en stock',\n            dayColor: alerte ? 'var(--fp-bad)' : e.days >= 10 && p.col < 3 ? 'var(--fp-warn)' : INK3,\n            line: alerte ? 'var(--fp-bad)' : LINE,\n            marge: this.fmt(e.marge),\n            margeC: e.marge <= 0 ? 'var(--fp-bad)' : e.marge < 60 ? 'var(--fp-warn)' : 'var(--fp-ok)',\n            roi: e.roi.toFixed(0) + ' %',\n            roiC: e.roi < this.num(s.roiMin) ? 'var(--fp-warn)' : 'var(--fp-ok)',\n            alerte,\n            alerteTxt: '⚠ ' + e.days + ' j — décote −' + this.ageHaircut(e.days) + ' $ appliquée',\n            flashLabel: '⚡ Vente flash ' + this.fmt(e.flash),\n            onFlash: () => this.venteFlash(p.id),\n            chan: p.chan || 'Marketplace',\n            onChan: e2 => this.setChan(p.id, e2.target.value),\n            lieu: p.lieu || 'Chez moi',\n            onLieu: e2 => this.setLieu(p.id, e2.target.value),\n            action: p.col === 3 ? 'Archiver' : 'Avancer →',\n            onAdvance: () => this.advance(p.id),\n            buyer: p.buyer || '',\n            onBuyer: e2 => this.setBuyerCarte(p.id, e2.target.value),\n            buyerNote: (s.buyers.find(x => x.id === p.buyer) || {note:''}).note,\n            hasBuyer: !!p.buyer,\n            onRetirer: () => this.retirerDuStock(p.id),\n            onReset: () => this.resetCarte(p.id)\n          };\n        })}))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
