.4\" fill=\"#15161a\"><\u002Fcircle>\n                    <\u002Fsc-if>\n                  <\u002Fsvg>\n                  <span style=\"font-weight:600;min-width:0\">{{ m.n }}<span style=\"color:var(--fp-ink-3);font-weight:400;font-size:11px\"> · {{ m.an }}<\u002Fspan><\u002Fspan>\n                  <button sc-camel-on-click=\"{{ m.onSheet }}\" title=\"Aperçu produit\" style=\"margin-left:auto;cursor:pointer;border:1px solid var(--fp-line);border-radius:6px;background:transparent;color:var(--fp-ink-3);padding:2px 7px;font-size:11px;line-height:1.4;flex:0 0 auto\">👁<\u002Fbutton>\n                <\u002Fspan>\n                <span style=\"text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:5px\"><span style=\"color:var(--fp-accent);font-size:9px\">{{ m.prvMark }}<\u002Fspan><input type=\"number\" value=\"{{ m.prv }}\" sc-camel-on-change=\"{{ m.onPrv }}\" style=\"width:70px;border:1px solid {{ m.prvLine }};border-radius:var(--fp-r-sm);background:var(--fp-panel-2);color:var(--fp-ink);padding:5px 6px;font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right\"><\u002Fspan>\n                <span style=\"text-align:right;color:var(--fp-ink-3)\">{{ m.rec }}<\u002Fspan>\n                <span style=\"text-align:right\"><input type=\"number\" value=\"{{ m.pamMarche }}\" sc-camel-on-change=\"{{ m.onMarche }}\" style=\"width:72px;border:1px solid {{ m.marLine }};border-radius:var(--fp-r-sm);background:var(--fp-panel-2);color:var(--fp-ink-3);padding:5px 6px;font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right\"><\u002Fspan>\n                <span style=\"text-align:right\"><input type=\"number\" value=\"{{ m.pamStrict }}\" sc-camel-on-change=\"{{ m.onStrict }}\" style=\"width:72px;border:1px solid {{ m.strLine }};border-radius:var(--fp-r-sm);background:var(--fp-panel-2);color:var(--fp-ink);padding:5px 6px;font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right\"><\u002Fspan>\n                <span style=\"text-align:right\"><input type=\"number\" value=\"{{ m.tonPam }}\" sc-camel-on-change=\"{{ m.onTonPam }}\" style=\"width:72px;border:1px solid {{ m.pamLine }};border-radius:var(--fp-r-sm);background:var(--fp-panel-2);color:{{ m.tonColor }};padding:5px 6px;font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right\"><\u002Fspan>\n                <span style=\"text-align:right\"><input type=\"number\" value=\"{{ m.roi }}\" sc-camel-on-change=\"{{ m.onRoi }}\" style=\"width:72px;border:1px solid {{ m.roiLine }};border-radius:var(--fp-r-sm);background:var(--fp-panel-2);color:{{ m.roiColor }};padding:5px 6px;font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right\"><\u002Fspan>\n                <span style=\"text-align:right;color:{{ m.margeColor }};font-weight:600\">{{ m.marge }}<\u002Fspan>\n                <span style=\"text-align:right;color:var(--fp-ink-3)\">{{ m.rot }}<\u002Fspan>\n                <span style=\"text-align:right;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:{{ m.zoneFg }}\">{{ m.zone }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start\">\n          <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n            <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Marge brute vs marge nette<\u002Fdiv>            <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:8px\">Un PAM calculé « PRV − pièces » donne une marge flatteuse. Voici ce qu'il en reste après négo acheteur, réserve garantie, casse, frais fixes et ton temps.<\u002Fdiv>\n            <sc-for list=\"{{ rcFields }}\" as=\"f5\" hint-placeholder-count=\"3\">\n              <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                <span style=\"display:block\"><b style=\"font-size:12.5px\">{{ f5.lab }}<\u002Fb><small style=\"display:block;color:var(--fp-ink-3);font-size:11px\">{{ f5.sub }}<\u002Fsmall><\u002Fspan>\n                <input type=\"number\" value=\"{{ f5.value }}\" sc-camel-on-change=\"{{ f5.onChange }}\" style=\"width:88px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:14px\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;background:var(--fp-line)\">\n              <sc-for list=\"{{ rcMinis }}\" as=\"rcm\" hint-placeholder-count=\"4\">\n                <div style=\"background:var(--fp-panel);padding:12px\">\n                  <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ rcm.lab }}<\u002Fdiv>\n                  <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;color:{{ rcm.color }}\">{{ rcm.val }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;padding:12px 14px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);font-size:12.5px;color:var(--fp-ink-2)\">{{ rcVerdict }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPipeline }}\" hint-placeholder-val=\"{{ true }}\">\n      <section data-screen-label=\"Pipeline\" style=\"display:grid;gap:16px\">\n        <div style=\"border-bottom:1px solid var(--fp-line);padding-bottom:14px;max-width:680px\">\n          <h2 style=\"font-size:clamp(24px,3vw,32px);margin:0 0 6px\">Pipeline — rotation 7 à 10 jours<\u002Fh2>\n          <p style=\"margin:0;color:var(--fp-ink-2);font-size:13px\">Touche <strong>Avancer<\u002Fstrong> pour faire progresser une carte. Passé 14 jours, l'appareil vire à l'accent : coupe le prix de 20 $ immédiatement. Le capital libéré vaut plus que les 20 $ perdus.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start\">\n          <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n            <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:10px\">Trésorerie à 30 jours<\u002Fdiv>\n            <sc-for list=\"{{ treasuryRows }}\" as=\"tr\" hint-placeholder-count=\"3\">\n              <div style=\"padding:9px 0;border-top:1px solid var(--fp-line)\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px\">\n                  <span style=\"font-size:12px;color:var(--fp-ink-2)\">{{ tr.lab }}<\u002Fspan>\n                  <span style=\"font-size:13px;font-weight:600;font-variant-numeric:tabular-nums\">{{ tr.val }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:8px;background:var(--fp-panel-3)\"><div style=\"height:8px;background:{{ tr.color }};width:{{ tr.w }};transition:width .3s ease\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"margin-top:12px;font-size:12px;color:var(--fp-ink-2)\">{{ runwayNote }}<\u002Fdiv>\n            <div style=\"margin-top:12px;padding-top:10px;border-top:1px solid var(--fp-line);display:grid;gap:7px\">\n              <span style=\"font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3);font-weight:600\">Répartition du capital par génération<\u002Fspan>\n              <sc-if value=\"{{ capitalMixEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size:12px;color:var(--fp-ink-3)\">Aucun capital immobilisé : tout est disponible.<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ capitalMix }}\" as=\"cm\" hint-placeholder-count=\"3\">\n                <div>\n                  <div style=\"display:flex;justify-content:space-between;font-size:11.5px;color:var(--fp-ink-2);margin-bottom:3px\">\n                    <span>{{ cm.lab }} · {{ cm.pct }}<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ cm.val }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:6px;background:var(--fp-panel-3)\"><div style=\"height:6px;background:{{ cm.color }};width:{{ cm.width }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:12px\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onExportCsv }}\" style=\"border-width:1px;border-color:var(--fp-line-strong);border-radius:var(--fp-r-sm);padding:8px 12px;font-size:11.5px;font-weight:600;justify-content:flex-start\">Export CSV<\u002Fbutton>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onExportJson }}\" style=\"border-width:1px;border-color:var(--fp-line);border-radius:var(--fp-r-sm);color:var(--fp-ink-2);padding:8px 12px;font-size:11.5px;font-weight:600;justify-content:flex-start\">Export JSON<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n            <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:10px\">Stock dormant<\u002Fdiv>\n            <sc-if value=\"{{ agingEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:12.5px;color:var(--fp-ink-3)\">Aucun appareil au-delà de 10 jours. C'est exactement l'état souhaité : le capital tourne.<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ agingRows }}\" as=\"ag\" hint-placeholder-count=\"2\">\n              <div style=\"padding:10px 0;border-top:1px solid var(--fp-line);display:grid;gap:4px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n                  <span style=\"font-size:13px;font-weight:600\">{{ ag.model }}<\u002Fspan>\n                  <span style=\"font-size:12px;font-weight:600;color:{{ ag.color }};font-variant-numeric:tabular-nums\">{{ ag.days }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size:12px;color:var(--fp-ink-2)\">{{ ag.advice }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n            <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:10px\">Marge moyenne par canal<\u002Fdiv>\n            <sc-for list=\"{{ channelStats }}\" as=\"cs\" hint-placeholder-count=\"4\">\n              <div style=\"padding:9px 0;border-top:1px solid var(--fp-line)\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px\">\n                  <span style=\"font-size:12.5px\">{{ cs.chan }} <span style=\"color:var(--fp-ink-3);font-size:11px\">· {{ cs.count }} deal(s)<\u002Fspan><\u002Fspan>\n                  <span style=\"font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:{{ cs.color }}\">{{ cs.marge }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:6px;backg 5},\n     quoi:\"Retrait du verre arrière cassé et pose d'un verre neuf. Sur 12 et plus, la découpe laser est fortement recommandée.\",\n     comment:[\"Sans laser : chauffe à 90 °C, fil de coupe en évitant caméra et MagSafe, résidus à la lame et à l'alcool\",\"Avec laser (sous-traitance 25–40 $) : découpe nette, anneau MagSafe intact\",\"Colle B-7000 en cordon fin, presse 4 h sous poids\"],\n     pieges:[\"L'anneau MagSafe et l'antenne NFC sont collés au verre : Apple Pay meurt si tu les arraches\",\"Sur 14 et plus, le verre arrière est structurel\",\"Jamais au-dessus de 100 °C : tu décolles l'écran de l'autre côté\"],\n     regle:\"Une vitre arrière fissurée fait chuter le prix de 80 à 120 $ dans la tête du vendeur alors qu'elle te coûte 20 à 45 $. Le meilleur levier de négociation du métier.\"},\n    {code:'R·03',casse:1,niv:1,t:'Port de charge / charge lente',piece:'port',temps:35,gain:{g11:40,g12:45,g13:50,g14:60,g15:70},\n     quoi:\"Nettoyage profond ou remplacement de la nappe de charge. Neuf fois sur dix, ce n'est que de la peluche compactée.\",\n     comment:[\"Nettoyage d'abord : cure-dent en bois, jamais de métal, puis air sec\",\"Si la charge reste instable, remplace la nappe complète (micro du bas et antenne inclus)\",\"Sur 12 et plus, certaines versions demandent un dessoudage : sous-traitance\"],\n     pieges:[\"Un port oxydé vert signale un dégât d'eau : NO-GO\",\"La nappe contient le micro du bas — teste un mémo vocal après remontage\",\"Ne force jamais un connecteur : les pins se plient\"],\n     regle:\"Nettoyage : 5 minutes, 0 $, +40 $ de valeur perçue. À faire systématiquement sur chaque appareil.\"},\n    {code:'R·04',casse:2,niv:1,t:'Vitre de caméra fêlée',piece:'lens',temps:20,gain:{g11:35,g12:40,g13:45,g14:55,g15:60},\n     quoi:\"Remplacement du verre de protection des objectifs, sans toucher au module caméra.\",\n     comment:[\"Chauffe légèrement, décolle par le bord extérieur à la lame fine\",\"Aspire tous les éclats à la poire : un seul grain sur le capteur ruine les photos\",\"Pose le verre neuf sans poussière, presse 30 minutes\"],\n     pieges:[\"Un éclat tombé dans le module = tache permanente\",\"Ne confonds pas vitre fêlée et capteur endommagé : teste les photos avant\",\"Sur 14 Pro et plus, le verre est plus dur à décoller\"],\n     regle:\"8 $ de pièce, 20 minutes, 45 $ de valeur récupérée. Une vitre fêlée effraie l'acheteur bien plus qu'elle ne coûte.\"},\n    {code:'R·05',casse:1,niv:1,t:'Remise à neuf esthétique complète',piece:null,temps:40,gain:{g11:45,g12:50,g13:60,g14:70,g15:80},\n     quoi:\"Le détaillage du téléphone : ce que 90 % des vendeurs privés ne font pas et qui justifie 50 $ de plus.\",\n     comment:[\"Grilles : brosse à dents sèche puis ruban adhésif pour lever la poussière\",\"Contour d'écran : cure-dent en bois + microfibre à l'alcool 99 %\",\"Châssis : pâte à polir plastique sur les micro-rayures d'aluminium\",\"Verre trempé neuf posé sans bulle\"],\n     pieges:[\"Jamais d'alcool directement sur l'OLED\",\"Ne polis pas un châssis en acier inoxydable (11 Pro, 12 Pro, 13 Pro)\",\"Verre trempé mal posé = crédibilité perdue\"],\n     regle:\"4 $ de consommables, 40 minutes. Le meilleur ratio effort/valeur perçue de tout le système.\"},\n    {code:'R·06',casse:7,niv:2,t:'Écran OLED fissuré',piece:'oled',temps:55,gain:{g11:120,g12:150,g13:170,g14:200,g15:250},\n     quoi:\"Remplacement du bloc écran avec migration de la puce d'origine pour conserver True Tone et Face ID.\",\n     comment:[\"Ruban adhésif large sur l'écran cassé avant retrait (les éclats volent)\",\"Transfère écouteur, capteur de proximité et nappe Face ID\",\"Migre la puce d'écran, sinon « Pièce inconnue » et perte de True Tone\",\"Teste le tactile bord à bord avant de recoller\"],\n     pieges:[\"La nappe Face ID est appariée à la carte mère : déchirée = Face ID mort\",\"Un écran soft OLED se fend pendant la pose : première cause de perte sèche\",\"Les copies tierces perdent le 120 Hz sur les Pro\"],\n     regle:\"Pas avant ton troisième flip réussi et l'achat du programmateur. Avant ça, un écran cassé est un NO-GO, pas une opportunité.\"},\n    {code:'R·07',casse:4,niv:2,t:'Caméra arrière / autofocus qui vibre',piece:'cam',temps:40,gain:{g11:70,g12:80,g13:90,g14:110,g15:130},\n     quoi:\"Remplacement du module caméra arrière quand l'autofocus bourdonne, l'image tremble ou une lentille est floue.\",\n     comment:[\"Symptôme : bourdonnement audible et image qui tremble à l'ouverture de l'app Photo\",\"Cache de carte mère, nappe caméra, module complet\",\"Sur 12 et plus, migration de puce nécessaire\"],\n     pieges:[\"Un module non apparié désactive certains modes photo\",\"Souvent causé par une chute : vérifie aussi la carte mère\",\"Le prix du module dépasse vite le gain sur les modèles récents\"],\n     regle:\"Rentable jusqu'à la génération 13. Au-delà, le module coûte plus que la remise obtenue.\"},\n    {code:'R·08',casse:2,niv:2,t:'Haut-parleur / écouteur muet',piece:'spk',temps:35,gain:{g11:45,g12:50,g13:55,g14:65,g15:75},\n     quoi:\"Remplacement du haut-parleur principal ou de l'écouteur d'appel quand le son est étouffé ou absent.\",\n     comment:[\"Nettoyage de grille d'abord : 60 % des cas se règlent sans pièce\",\"Vérifie le logiciel : redémarrage, test en mode haut-parleur\",\"Remplacement : quelques vis, une nappe, aucune soudure\"],\n     pieges:[\"Un son étouffé des deux côtés évoque un dégât d'eau\",\"L'écouteur est solidaire du capteur de proximité sur certains modèles\"],\n     regle:\"Toujours tenter le nettoyage avant de commander la pièce.\"},\n    {code:'R·09',casse:2,niv:2,t:'Boutons, silence, haptique',piece:'btn',temps:45,gain:{g11:40,g12:45,g13:50,g14:60,g15:65},\n     quoi:\"Remplacement de la nappe des boutons volume et de l'interrupteur silence, ou du Taptic Engine.\",\n     comment:[\"Nappe fine collée le long du châssis : chauffe légèrement, décolle par le haut\",\"Taptic Engine : 4 vis\",\"Teste chaque bouton 10 fois après remontage\"],\n     pieges:[\"La nappe passe sous la carte mère sur certains modèles\",\"Un bouton power HS peut cacher un problème de carte mère\"],\n     regle:\"Seulement si l'acheteur le remarquerait. Un interrupteur mou ne coûte pas 40 $ de prix de vente.\"},\n    {code:'R·10',niv:3,t:'Face ID mort',piece:null,temps:0,gain:{g11:0,g12:0,g13:0,g14:0,g15:0},\n     quoi:\"NO-GO absolu. Le dot projector est apparié cryptographiquement à la carte mère depuis l'iPhone X.\",\n     comment:[\"Aucune réparation sans micro-soudure et transfert de composants appariés\",\"Un atelier facture 150–250 $ avec un taux de réussite partiel\"],\n     pieges:[\"« C'est juste un réglage à faire » est faux\",\"Un appareil sans Face ID perd 25 à 35 % de sa valeur\"],\n     regle:\"Tu pars. Peu importe le prix demandé.\"},\n    {code:'R·11',niv:3,t:\"Dégât d'eau / boot loop / carte mère\",piece:null,temps:0,gain:{g11:0,g12:0,g13:0,g14:0,g15:0},\n     quoi:\"NO-GO absolu. La corrosion progresse pendant des mois : un appareil qui fonctionne aujourd'hui meurt chez ton acheteur.\",\n     comment:[\"Indicateur LCI rouge dans le tiroir SIM = eau confirmée\",\"Corrosion verte au port de charge = eau confirmée\",\"Redémarrages seuls, chauffe au repos, 20 %/h de décharge = carte mère\"],\n     pieges:[\"Tu vends, ça meurt en trois semaines, tu rembourses et ta réputation est morte\",\"Le riz n'a jamais rien réparé\"],\n     regle:\"Tu pars. La règle qui te sauvera le plus d'argent sur une année.\"},\n    {code:'R·12',niv:3,t:'Réseau « Recherche… » / baseband',piece:null,temps:0,gain:{g11:0,g12:0,g13:0,g14:0,g15:0},\n     quoi:\"NO-GO absolu. Panne de la puce baseband : le téléphone ne capte plus le réseau cellulaire.\",\n     comment:[\"Teste avec TA carte SIM active\",\"« Aucun service » ou « Recherche… » permanent, IMEI parfois absent\"],\n     pieges:[\"Le vendeur dira « c'est juste l'opérateur »\",\"Un iPhone sans réseau ne vaut que ses pièces, soit 15 % du prix\"],\n     regle:\"Tu pars. Et tu comprends pourquoi tu apportes toujours une SIM active.\"}\n  ];\n\n  FOURN = [\n    {n:'MobileSentrix Canada',tag:'Référence',delai:'2 à 4 jours (Mississauga)',prix:'Base 100',\n     pour:[\"Stock canadien, pas de douanes\",\"Qualité constante, pièces classées par grade\",\"Compte pro : numéro d'entreprise demandé\"],\n     contre:[\"30 à 60 % plus cher que la Chine\",\"Minimum de commande sur certaines références\"],\n     quand:\"Ton fournisseur par défaut dès qu'un appareil attend. Le délai court vaut la différence de prix quand ton capital dort.\"},\n    {n:'AliExpress / vendeurs directs',tag:'Volume',delai:'15 à 35 jours',prix:'Base 45 à 60',\n     pour:[\"Le prix le plus bas sur batteries et petites nappes\",\"Idéal pour un stock d'avance\"],\n     contre:[\"5 à 15 % de défectuosité, retour impossible\",\"Délai incompatible avec un appareil déjà acheté\",\"Qualité variable d'un lot à l'autre\"],\n     quand:\"Uniquement en anticipation : 3 batteries de tes modèles cibles avant d'en avoir besoin.\"},\n    {n:'Grossistes locaux Montréal',tag:'Urgence',delai:'Le jour même',prix:'Base 130 à 160',\n     pour:[\"Tu repars avec la pièce en main\",\"Tu peux la vérifier sur place\",\"Ils sous-traitent aussi laser et micro-soudure\"],\n     contre:[\"Le prix le plus élevé\",\"Stock limité aux modèles populaires\"],\n     quand:\"Quand un appareil est ouvert sur l'établi. 20 $ de surcoût valent mieux que 4 jours de capital immobilisé.\"},\n    {n:'Appareils donneurs',tag:'Marge cachée',delai:'Immédiat',prix:'Base 20 à 40',\n     pour:[\"Un 11 à 40 $ contient batterie, port, HP, boutons, tiroir SIM, vitre arrière\",\"Pièces d'origine : aucun message « Pièce inconnue »\",\"Meilleure source de marge invisible\"],\n     contre:[\"Stockage et organisation\",\"Immobilise du capital sans date de sortie\"],\n     quand:\"Dès le flip 4. Achète ce que les autres jettent : Face ID mort, carte mère HS, écran fracassé.\"},\n    {n:'Sous-traitance locale',tag:'Partenaire',delai:'1 à 3 jours',prix:\"25 à 60 $ l'acte\",\n     pour:[\"Découpe laser de vitre arrière : 25 à 40 $\",\"Micro-soudure : seul recours sur les cas que tu ne touches pas\",\"Ils te vendent aussi leurs rebuts\"],\n     contre:[\"Marge partagée\",\"Dépendance à leur agenda\"],\n     quand:\"Négocie un tarif fixe dès ton troisième flip. Un partenaire laser rend la vitre arrière du 12+ rentable.\"}\n  ];\n\n  OUTILS = [\n    {q:'Avant le flip 1',o:'Kit tournevis (Y000, P2 Pentalobe, cruciforme) + médiators + ventouse + tapis magnétique',c:'30–45 $',d:\"Toute ouverture d'appareil\",lvl:1},\n    {q:'Avant le flip 1',o:'Source de chaleur : plaque chauffante ou décapeur réglable',c:'25–40 $',d:'Décollage écran et vitre arrière',lvl:1},\n    {q:'Avant le flip 1',o:'Alcool 99 %, bandes adhésives, colle B-7000, microfibres, brosses',c:'25 $',d:'Détaillage et remontage propre',lvl:1},\n    {q:'Flip 1',o:\"Multimètre d'entrée de gamme\",c:'20–30 $',d:'Vérifier une batterie ou un court-circuit',lvl:2},\n    {q:'Flip 2',o:'Loupe éclairée ou microscope USB',c:'30–60 $',d:\"Voir corrosion et pins pliés avant d'acheter\",lvl:2},\n    {q:'Flip 3',o:'Alimentation DC réglable',c:'50–70 $',d:'Démarrer sans batterie, diagnostiquer un court',lvl:2},\n    {q:'Flip 3',o:'Programmateur JC V1SE ou QianLi iCopy Plus',c:'130–190 $',d:'Migration de puce : supprime « Pièce inconnue », débloque le Niveau 2',lvl:2},\n    {q:'Flip 6',o:'Presse de laminage + séparateur LCD',c:'250–600 $',d:'Refaire tes propres écrans — au-delà de 6 écrans/mois',lvl:3},\n    {q:'Plus tard',o:'Station de micro-soudure + air chaud',c:'400 $+',d:\"Hors périmètre : c'est un autre métier\",lvl:3}\n  ];\n\n  CHECKS = [\n    {id:'c01',type:'B',w:0,t:\"iCloud / Localiser désactivé devant toi\",h:\"Réglages → [Nom] → Localiser → Désactiver, avec SON mot de passe, devant toi, avant de sortir l'argent. Puis Réglages → Général → Transférer ou réinitialiser.\"},\n    {id:'c02',type:'B',w:0,t:\"IMEI propre et sans solde opérateur\",h:\"Compose *#06# pour l'IMEI. Vérifie sur devicecheck.ca et un vérificateur GSMA. Un IMEI blacklisté est bloqué sur tous les réseaux canadiens.\"},\n    {id:'c03',type:'B',w:0,t:\"Aucune trace d'eau\",h:\"Tiroir SIM : l'indicateur LCI doit être blanc, jamais rouge. Fond du port de charge : aucun dépôt vert. Écran sans halo ni tache.\"},\n    {id:'c04',type:'B',w:0,t:\"Face ID enregistre un nouveau visage\",h:\"Réglages → Face ID et code → Configurer une autre apparence : le double scan doit se terminer sans erreur. Seul test qui prouve que le dot projector est vivant.\"},\n    {id:'c05',type:'B',w:0,t:\"Aucun redémarrage pendant 10 minutes\",h:\"Vidéo, caméra, navigation. Un appareil qui redémarre seul, chauffe au repos ou perd 10 % en 15 minutes a un problème de carte mère.\"},\n    {id:'c06',type:'M',w:12,t:\"Santé de la batterie ≥ 85 %\",h:\"Réglages → Batterie → État de la batterie. Sous 85 %, compte la pièce d'office dans ton PAM. « Service » = batterie déjà remplacée en tiers.\"},\n    {id:'c07',type:'M',w:10,t:\"Aucun message « Pièce inconnue »\",h:\"Réglages → Général → Informations, section historique des pièces. C'est une remise de 40 à 80 $ à demander, pas un NO-GO.\"},\n    {id:'c08',type:'M',w:11,t:\"Écran sans burn-in, ligne ni tache\",h:\"Image grise unie plein écran à luminosité max, puis blanche, puis noire. Cherche le fantôme du clavier, les lignes vertes, les points morts.\"},\n    {id:'c09',type:'M',w:9,t:\"Tactile réactif bord à bord\",h:\"Notes : trace un S continu qui touche les quatre bords, puis un quadrillage. Toute zone morte signale un écran fatigué ou mal collé.\"},\n    {id:'c10',type:'M',w:9,t:\"Toutes les caméras, tous les zooms, le flash\",h:\"0,5× puis 1× puis 2–3×, caméra avant, vidéo, flash, portrait. Un autofocus qui bourdonne annonce un module à changer.\"},\n    {id:'c11',type:'M',w:8,t:\"Les trois micros\",h:\"Micro du bas : mémo vocal. Micro du haut : vidéo caméra avant. Micro arrière : vidéo caméra arrière. Réécoute chaque enregistrement.\"},\n    {id:'c12',type:'M',w:8,t:\"Appel réel avec TA carte SIM\",h:\"Insère ta SIM, attends l'accroche réseau, appelle et parle 30 secondes. « Recherche… » persistant = panne de baseband, NO-GO déguisé.\"},\n    {id:'c13',type:'m',w:5,t:\"Vitre arrière intacte\",h:\"Ongle sur toute la surface, lumière rasante. Une fissure au dos : 20 à 45 $ pour toi, 80 à 120 $ de remise à demander.\"},\n    {id:'c14',type:'m',w:6,t:\"Châssis droit, coins non écrasés\",h:\"Écran vers le bas sur une surface plate : il ne doit pas basculer. Un châssis vrillé empêche toute pose d'écran étanche.\"},\n    {id:'c15',type:'m',w:4,t:\"Haut-parleurs et écouteur\",h:\"Musique au volume max sans grésillement, puis un appel collé à l'oreille. Un son étouffé des deux côtés évoque un dégât d'eau.\"},\n    {id:'c16',type:'m',w:4,t:\"Capteur de proximité\",h:\"Pendant un appel, approche la main du haut de l'écran : il doit s'éteindre puis se rallumer. Un capteur mort = raccrochages avec la joue.\"},\n    {id:'c17',type:'m',w:5,t:\"Charge filaire et sans fil\",h:\"La charge démarre et tient quand tu bouges le câble. Teste ensuite MagSafe ou Qi, aimant compris sur 12 et plus.\"},\n    {id:'c18',type:'m',w:3,t:\"Wi-Fi, Bluetooth, NFC\",h:\"Partage de connexion, appairage d'un écouteur, Wallet pour le NFC. L'antenne NFC est collée à la vitre arrière : elle meurt après une réparation ratée.\"},\n    {id:'c19',type:'m',w:3,t:\"Boutons, silence, haptique\",h:\"Volume haut et bas dix fois, bouton latéral, interrupteur silence dans les deux sens : la vibration doit être franche et sèche.\"},\n    {id:'c20',type:'m',w:3,t:\"Provenance cohérente\",h:\"« Tu l'as acheté où, et pourquoi tu le vends ? » Une histoire fluide avec boîte ou facture vaut mieux qu'un rabais.\"}\n  ];\n\n  PREV = [\n    {id:'v01',type:'B',w:0,t:\"IMEI communiqué par écrit\",h:\"« Tu peux m'envoyer l'IMEI ? » — Un refus est le signal le plus révélateur du métier : un vendeur honnête n'a aucune raison de le cacher.\"},\n    {id:'v02',type:'B',w:0,t:\"Capture de Réglages → Informations\",h:\"Modèle, capacité et IMEI doivent correspondre à l'annonce, historique des pièces visible. Capture rognée juste avant l'historique = signal rouge.\"},\n    {id:'v03',type:'B',w:0,t:\"Photo horodatée de l'appareil allumé\",h:\"Photo à côté d'un papier daté du jour. Ça prouve qu'il a l'appareil en main et qu'il démarre. Photos de l'annonce réutilisées = photos peut-être volées.\"},\n    {id:'v04',type:'B',w:0,t:\"Mot de passe iCloud confirmé\",h:\"« Tu as bien le mot de passe iCloud ? On fera la déconnexion ensemble avant le paiement. » Tu ne reviendras jamais chercher un mot de passe.\"},\n    {id:'v05',type:'B',w:0,t:\"Prix pré-accepté, un chiffre ferme\",h:\"« Si tout correspond, je peux offrir [PAM] $ comptant aujourd'hui. » « On verra sur place » = il compte sur ton trajet pour te faire monter.\"},\n    {id:'v06',type:'M',w:16,t:\"Capture de Réglages → Batterie\",h:\"Pourcentage lisible. Au-dessus de 85 %, aucune pièce à prévoir. « Service » ou refus d'envoyer : compte la batterie d'office.\"},\n    {id:'v07',type:'M',w:15,t:\"Aucune pièce non authentique\",h:\"Un écran, une batterie ou une caméra signalés = remise de 40 à 80 $ à négocier avant de te déplacer.\"},\n    {id:'v08',type:'M',w:14,t:\"Photos des quatre côtés + écran allumé\",h:\"Photos nettes sous bonne lumière. Ce qu'on ne montre pas est ce qu'on cache.\"},\n    {id:'v09',type:'M',w:13,t:\"Aucun solde de financement\",h:\"Un appareil encore en financement peut être bloqué à distance des semaines après ton achat.\"},\n    {id:'v10',type:'M',w:12,t:\"Profil vendeur cohérent\",h:\"Compte de plus d'un an, photo réelle, quelques avis. Trois ou quatre iPhone en vente en même temps : revendeur, ou pire.\"},\n    {id:'v11',type:'m',w:8,t:\"Lieu public accepté et créneau fixé\",h:\"Stationnement de poste de police ou entrée de centre commercial, éclairé, avec une prise pour tester la charge. Non négociable.\"},\n    {id:'v12',type:'m',w:6,t:\"Histoire de vente cohérente\",h:\"Une histoire banale est bon signe. Une histoire qui change entre deux messages ne l'est pas.\"},\n    {id:'v13',type:'m',w:6,t:\"Boîte, facture ou accessoires\",h:\"Preuve de provenance : 20 à 30 $ de plus à ta revente.\"},\n    {id:'v14',type:'m',w:5,t:\"Réactivité et ton des échanges\",h:\"Réponses en moins d'une heure, ton normal. Silence puis trois messages pressants : signal faible qui pèse.\"}\n  ];\n\n  DECOTES = [\n    {id:'bat',v:20,l:\"Batterie sous 85 %\"},\n    {id:'ecr',v:30,l:\"Écran rayé ou marqué\"},\n    {id:'cab',v:15,l:\"Ni câble ni boîte\"},\n    {id:'vit',v:25,l:\"Vitre arrière fêlée\"},\n    {id:'pie',v:40,l:\"Message « pièce inconnue »\"},\n    {id:'cha',v:20,l:\"Châssis bosselé ou tordu\"},\n    {id:'por',v:15,l:\"Charge instable\"},\n    {id:'cam',v:25,l:\"Caméra ou vitre d'objectif\"}\n  ];\n\n  NOGOS = [\n    {t:\"iCloud / Localiser actif\",d:\"au moment du paiement — l'appareil est invendable et probablement volé.\"},\n    {t:\"IMEI blacklisté\",d:\"(CWTA / GSMA) ou statut « financement impayé » chez l'opérateur.\"},\n    {t:\"Trace d'eau\",d:\": indicateur LCI rouge, corrosion verte au port de charge, écran taché.\"},\n    {t:\"Face ID mort\",d:\"sur iPhone 11 et plus — le dot projector est apparié à la carte mère.\"},\n    {t:\"Pièces > 40 % du PRV\",d:\"ou marge nette < 90 $ — tu travailles pour rien.\"},\n    {t:\"Rotation estimée > 21 jours\",d:\"— un appareil qui dort te coûte tous les flips que tu n'as pas faits.\"}\n  ];\n\n  VIEWS = [\n    {id:'accueil',label:'Accueil'},\n    {id:'pam',label:'PAM'},{id:'terrain',label:'Terrain'},{id:'repair',label:'Repair Lab'},{id:'modeles',label:'Modèles'},\n    {id:'lowball',label:'Price Low Ball'},\n    {id:'pipeline',label:'Pipeline'},{id:'sourcing',label:'Sourcing'},{id:'prompts',label:'Prompts'},\n    {id:'reinvest',label:'Réinvestissement'},{id:'scale',label:'Scale'},{id:'gouvernance',label:'Rôles & Gouvernance'},{id:'academie',label:'Académie'}\n  ];\n\n  STUBS  this.state.sheet || this.state.recuOpen) this.setState({palette:false, histOpen:false, sheet:null, recuOpen:false}); else this.resetDeal(); return; }\n      if(k === 'enter'){\n        if(this.state.palette){ const first = this.paletteItems()[0]; if(first) this.runPalette(first); return; }\n        const tag = (document.activeElement || {}).tagName;\n        if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;\n        this.memorize();\n      }\n    };\n    document.addEventListener('keydown', this._key);\n    this.syncBoot();\n    this._tick = setInterval(() => { if(this.state.timerRun) this.setState(s => ({timer: s.timer + 1})); }, 1000);\n    if(navigator.getBattery){\n      navigator.getBattery().then(b => {\n        const upd = () => this.setState({eco: b.level < 0.15 && !b.charging});\n        upd(); b.addEventListener('levelchange', upd); b.addEventListener('chargingchange', upd);\n      }).catch(() => {});\n    }\n  }\n\n  componentWillUnmount(){ if(this._key) document.removeEventListener('keydown', this._key);\n    if(this._bc) try{ this._bc.close(); }catch(e){}\n    if(this._onStorage) window.removeEventListener('storage', this._onStorage);\n    if(this._onNet){ window.removeEventListener('online', this._onNet); window.removeEventListener('offline', this._onNet); }\n    clearInterval(this._ping); clearTimeout(this._save); clearTimeout(this._cch); clearInterval(this._tick); if(this._rec) this._rec.stop(); }\n\n  componentDidUpdate(){\n    clearTimeout(this._save);\n    this._save = setTimeout(() => {\n      const s = this.state;\n      const keep = {theme:s.theme, kpiOpen:s.kpiOpen, modelId:s.modelId, prv:s.prv, negoBuy:s.negoBuy, pieces:s.pieces,\n        temps:s.temps, taux:s.taux, kit:s.kit, deplac:s.deplac, garantie:s.garantie, casse:s.casse,\n        margeAbs:s.margeAbs, roiMin:s.roiMin, primeMax:s.primeMax, mode:s.mode, picks:s.picks,\n        ck:s.ck, pv:s.pv, dc:s.dc, dcDemande:s.dcDemande, prvOverride:s.prvOverride, ro:s.ro, pl:s. tState({view:item.id, palette:false, paletteQ:''});\n    else { this.pickModel(item.id); this.setState({view:'pam', pamSub:'maxbid', palette:false, paletteQ:''}); }\n  }\n\n  memorize(){\n    const r = this.pamResult();\n    const m = this.curModel();\n    if(!m || r.pam <= 0) return;\n    const entry = {id: Date.now(), model:m.n, modelId:m.id, pam: Math.round(r.pam), profit: Math.round(r.profit),\n      risk: r.risk, prv: this.state.prv, pieces: this.state.pieces,\n      roi: (r.invest > 0 ? Math.round(r.profit / r.invest * 100) : 0)};\n    this.setState(s => ({history: [entry].concat(s.history.filter(h => h.id !== entry.id)).slice(0,5), histOpen:true}));\n  }\n\n  applyPreset(codes){\n    const gen = (this.curModel() || {gen:'g11'}).gen;\n    const picks = {};\n    codes.forEach(c => { picks[c] = true; });\n    let cost = 0, min = 0, risk = 0;\n    this.REPAIRS.filter(x => picks[x.code]).forEach(x => {\n      cost += x.piece ? this.PIECES.find(p => p.id === x.piece).p[gen] : 0;\n      min += x.temps; risk = Math.max(risk, x.casse || 0);\n    });\n    this.setState({picks, pieces:String(Math.round(cost)), temps:String(min), casse:String(risk || 1)});\n  }\n\n  vendorMessage(){\n    const r = this.pamResult();\n    const m = this.curModel();\n    const open = Math.round(r.pam * 0.8);\n    const dcCount = this.DECOTES.filter(d => this.state.dc[d.id]).length;\n    const dcTotal = this.DECOTES.filter(d => this.state.dc[d.id]).reduce((a,d) => a + d.v, 0);\n    let txt = 'Bonjour, merci pour les infos sur le ' + (m ? m.n : 'appareil') + '. ';\n    if(dcCount) txt += \"J'ai relevé \" + dcCount + ' point' + (dcCount>1?'s':'') + ' à reprendre (' + dcTotal + ' $ de pièces et de remise en état). ';\n    txt += 'Je vous en offre ' + open + ' $ comptant aujourd\\u2019hui, argent en main, rendez-vous dans un lieu public. Si tout correspond, on conclut sur place.';\n    if(navigator.clipboard) navigator.clipboard.writeText(txt);\n    this.setState({copied:true});\n    clearTimeou n\n  batteryEstimate(m){\n    if(!m) return {pct:'—', note:'choisis un modèle'};\n    const age = Math.max(0.5, 2026 - m.an);\n    const pct = Math.max(72, Math.round(100 - age * 4.5));\n    return {pct: pct + ' %', note: 'estimation d’après l’âge du modèle (' + m.an + ', ' + age.toFixed(0) + ' ans) — à confirmer dans Réglages → Batterie'};\n  }\n\n  STORAGES = [{cap:'64', d:-25},{cap:'128', d:0},{cap:'256', d:25},{cap:'512', d:50}];\n  GUIDES = {\n    c03:{t:\"Repérer une trace d'eau\", b:[\"Sors le tiroir SIM et éclaire la cavité : l'indicateur LCI est une pastille blanche. Rose ou rouge = eau confirmée.\",\"Fond du port de charge : un dépôt vert-de-gris ou blanchâtre sur les pins signe la corrosion.\",\"Écran : un halo laiteux ou une tache qui ne bouge pas quand l'image change vient de l'humidité sous la dalle.\",\"Un appareil séché fonctionne parfois des semaines : la corrosion, elle, continue chez ton acheteur.\"]},\n    c07:{t:'Écran OEM ou copie', b:[\"Réglages → Général → Informations : l'historique des pièces signale un écran non authentique.\",\"Une copie soft OLED perd le 120 Hz sur les modèles Pro : fais défiler une longue liste, le mouvement saccade.\",\"True Tone absent des réglages d'affichage = puce non migrée.\",\"Les noirs d'une copie tirent légèrement vers le gris à luminosité minimale, côte à côte avec un original c'est net.\"]},\n    c08:{t:'Burn-in et lignes vertes', b:[\"Affiche une image grise unie plein écran, luminosité au maximum : le fantôme du clavier ou de la barre de statut apparaît.\",\"Puis blanc pur, puis noir pur, pour les points morts et les lignes verticales.\",\"Une ligne verte fixe est irréversible : c'est un remplacement d'écran complet.\"]},\n    c04:{t:'Tester Face ID pour de vrai', b:[\"Ne te contente pas du déverrouillage : Réglages → Face ID et code → Configurer une autre apparence.\",\"Le double scan doit se terminer sans message d'erreur.\",\"Un échec ici = dot projector ou nappe morts : micro-soudure, donc NO-GO.\"]}\n \n    let best=null, bestP=Infinity;\n    for(let mk=0;mk<8;mk++){\n      const g=m.map(r=>r.slice());\n      for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(!reserved[r][c] && maskFn(mk,r,c)) g[r][c]^=1;\n      applyFormat(g,mk); applyVersion(g);\n      const p=penalty(g);\n      if(p<bestP){ bestP=p; best=g; }\n    }\n    return best;\n  }\n\n  /* Chemin SVG compact : un rectangle par module sombre, dans un seul <path>. */\n  qrPath(text){\n    const m = this.qrMatrix(text);\n    if(!m) return {d:'', n:0};\n    let d='';\n    for(let r=0;r<m.length;r++) for(let c=0;c<m.length;c++)\n      if(m[r][c]) d += 'M' + c + ' ' + r + 'h1v1h-1z';\n    return {d, n:m.length};\n  }\n\n  /* Résumé d'inspection encodé dans le QR de la fiche de revente. */\n  ficheText(){\n    const s = this.state, m = this.curModel(), r = this.pamResult();\n    const t = this.terrainScore();\n    const interventions = Object.keys(s.picks).length;\n    const L = [];\n    L.push('FLIP PHONE MTL — FICHE DE REVENTE');\n    L.push('Modele: ' + (m ? m.n : '—') + ' · ' + s.storage + ' Go');\n    L.push('Prix demande: ' + Math.round(r.prv) + ' $');\n    L.push('Batterie: ' + (s.picks['R·01'] ? 'cellule neuve, sante 100 %' : 'sante verifiee >= 85 %'));\n    L.push('Interventions: ' + (interventions ? interventions + ' realisee(s)' : 'aucune, appareil d origine'));\n    L.push('Inspection: ' + t.filled + '/' + t.total + ' points testes');\n    L.push('IMEI: verifie · iCloud: deconnecte devant l acheteur');\n    L.push('Garantie: 30 jours, remboursement integral');\n    L.push('Verifie le ' + new Date().toLocaleDateString('fr-CA'));\n    return L.join('\\n');\n  }\n\n  /* scan caméra : n'existe que si le navigateur expose BarcodeDetector */\n  async scanImei(){\n    if(!('BarcodeDetector' in window) || !navigator.mediaDevices){\n      this.setState({imeiMsg:\"Ce navigateur ne sait pas décoder de code-barres. Tape les 15 chiffres, ou dépose une capture de l'écran du vendeur.\"});\n      return;\n    }\n    try{\n      const det = new window.BarcodeDetector({formats:['code_128','qr_code','data_matrix','ean_13']});\n      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});\n      const v = document.createElement('video');\n      v.srcObject = stream; v.playsInline = true; await v.play();\n      this.setState({imeiMsg:'Caméra ouverte — cadre le code-barres sous la batterie ou sur la boîte.'});\n      const deadline = Date.now() + 12000;\n      const tick = async () => {\n        if(Date.now() > deadline){ stream.getTracks().forEach(t => t.stop()); this.setState({imeiMsg:'Aucun code lu. Tape les chiffres à la main.'}); return; }\n        const found = await det.detect(v).catch(() => []);\n        const hit = (found || []).map(f => (f.rawValue || '').replace(/[^0-9]/g,'')).find(x => x.length === 15);\n        if(hit){ stream.getTracks().forEach(t => t.stop()); this.setState({imei:hit, imeiMsg:'Code lu : ' + hit}); return; }\n        requestAnimationFrame(tick);\n      };\n      tick();\n    }catch(e){ this.setState({imeiMsg:\"Accès caméra refusé. Tape les 15 chiffres à la main.\"}); }\n  }\n\n  onShot(e){\n    const f = e.target.files && e.target.files[0];\n    if(!f) return;\n    const url = URL.createObjectURL(f);\n    this.setState({shot:url, imeiMsg:'Capture conservée comme preuve de ce que le vendeur a montré.'});\n  }\n\n  /* la calibration des PRV date de cette référence : la dépréciation mensuelle s'applique ensuite toute seule */\n  CAL_DATE = '2026-01-01';\n\n  monthsSince(){ return Math.max(0, (Date.now() - new Date(this.CAL_DATE).getTime()) / 2629800000); }\n\n  /* Échéance des 6 mois suivant la calibration, en toutes lettres. */\n  calibNextLabel(){\n    const d = new Date(this.CAL_DATE);\n    d.setMonth(d.getMonth() + 6);\n    return d.toLocaleDateString('fr-CA', {year:'numeric', month:'long'});\n  }\n  depPrv(m){\n    const base = this.prvOf(m);\n    const months = this.monthsSince();\n    return Math.max(Math.round(base * 0.55), Math.round(base * (1 - m.dep / 100 * months)));\n  }\n\n  /* Prix de revente du jour : la dépréciation mensuelle propre au modèle\n     s'applique d'office dès qu'un PRV est proposé, sans intervention manuelle. */\n  prvToday(m){ return this.state.depOn ? this.depPrv(m) : this.prvOf(m); }\n\n  /* Écart entre le PRV calibré et la valeur du jour, pour l'alerte de marché. */\n  depGap(m){\n    if(!m) return {loss:0, pct:0, base:0, today:0, months:0, floored:false};\n    const base = this.prvOf(m), today = this.depPrv(m);\n    return {base, today, loss: base - today, pct: base > 0 ? (base - today) / base * 100 : 0,\n      months: this.monthsSince(), floored: today <= Math.round(base * 0.55)};\n  }\n\n  luhn(s){\n    let sum = 0;\n    for(let i = 0; i < s.length; i++){\n      let d = parseInt(s[s.length - 1 - i], 10);\n      if(i % 2 === 1){ d *= 2; if(d > 9) d -= 9; }\n      sum += d;\n    }\n    return sum % 10 === 0;\n  }\n\n  imeiCheck(){\n    const raw = (this.state.imei || '').replace(/[^0-9]/g, '');\n    if(!raw) return {state:'empty', txt:\"Colle un IMEI à 15 chiffres (*#06# sur l'appareil) pour le contrôler avant de te déplacer.\", rows:[]};\n    if(raw.length !== 15) return {state:'bad', txt: raw.length + ' chiffres sur 15. Un IMEI complet en compte exactement 15 — une capture rognée ou un chiffre inventé se voit ici.', rows:[]};\n    const ok = this.luhn(raw);\n    const tac = raw.slice(0,8);\n    const rows = [\n      {k:'Clé de Luhn', v: ok ? 'valide' : 'invalide — numéro inventé', bad: !ok},\n      {k:'TAC (8 premiers)', v: tac + ' — identifie le modèle déclaré', bad:false},\n      {k:'Série', v: raw.slice(8,14), bad:false},\n      {k:'Remplacement Apple', v: 'le numéro de série commence par F sur un appareil de remplacement — vérifie-le dans Réglages → Informations', bad:false}\n    ];\n    return {state: ok ? 'ok' : 'bad', rows,\n      txt: ok ? 'Structure valide. Il reste deux contrôles que seul un registre peut faire : vol/perte (device
