-camel-on-change=\"{{ h.prv }}\" style=\"width:88px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n                <\u002Flabel>\n                <div title=\"{{ seasonNote }}\" style=\"display:flex;align-items:center;gap:7px;margin:-2px 0 8px;padding:6px 9px;border-left:2px solid {{ seasonColor }};background:var(--fp-panel-2);border-radius:0 var(--fp-r-sm) var(--fp-r-sm) 0\">\n                  <span style=\"font-size:11px\">📉<\u002Fspan>\n                  <span style=\"font-size:10.5px;font-weight:700;color:{{ seasonColor }};white-space:nowrap\">{{ seasonLabel }}<\u002Fspan>\n                  <span style=\"font-size:10.5px;color:var(--fp-ink-3);line-height:1.4;min-width:0\">{{ seasonNote }}<\u002Fspan>\n                <\u002Fdiv>\n                <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                  <span style=\"display:block\"><b style=\"font-size:12.5px\">Concession de négo acheteur (%)<\u002Fb><small style=\"display:block;color:var(--fp-ink-3);font-size:11px\">Presque personne ne paye l'affiché — 5 % par défaut<\u002Fsmall><\u002Fspan>\n                  <input type=\"number\" value=\"{{ f.negoBuy }}\" sc-camel-on-change=\"{{ h.negoBuy }}\" style=\"width:88px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n                <\u002Flabel>\n              <\u002Fdiv>\n\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">02 · ce que tu vas réparer<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:9px\">Les coûts s'ajustent à la génération choisie ({{ genLabel }}).<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px\">\n                  <sc-for list=\"{{ repairPresets }}\" as=\"rp\" hint-placeholder-count=\"4\">\n                    <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ rp.onClick }}\" style=\"border-width:1px;border-color:var(--fp-line);border-radius:var(--fp-r-sm);color:var(--fp-ink-2);padding:6px 10px;font-size:11px;font-weight:600;justify-content:flex-start\">{{ rp.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <sc-for list=\"{{ repairPicks }}\" as=\"r\" hint-placeholder-count=\"9\">\n                  <label sc-camel-on-click=\"{{ r.onClick }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                    <span style=\"width:16px;height:16px;flex:0 0 auto;border:2px solid {{ r.boxLine }};background:{{ r.boxBg }}\"><\u002Fspan>\n                    <span style=\"flex:1\"><b style=\"font-size:12.5px\">{{ r.t }}<\u002Fb><small style=\"display:block;color:var(--fp-ink-3);font-size:11px\">{{ r.meta }}<\u002Fsmall><\u002Fspan>\n                    <span style=\"font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--fp-ink-2)\">{{ r.cost }}<\u002Fspan>\n                  <\u002Flabel>\n                <\u002Fsc-for>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--fp-line)\">\n                  <div><div style=\"font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">Pièces<\u002Fdiv><div style=\"font-family:var(--font-heading);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums\">{{ piecesTot }}<\u002Fdiv><\u002Fdiv>\n                  <div><div style=\"font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">Ton temps<\u002Fdiv><div style=\"font-family:var(--font-heading);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums\">{{ tempsTot }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">03 · mode de calcul<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0\">\n                  <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"cursor:pointer;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:{{ m.bg }};color:{{ m.fg }};padding:9px 6px;font-size:11.5px;font-weight:600;text-align:left\">{{ m.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--fp-ink-2)\">{{ modeNote }}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">04 · réglettes de marge<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:10px\">Les pourcentages se règlent au doigt : le PAM se recalcule à chaque cran.<\u002Fdiv>\n                <sc-for list=\"{{ pctSliders }}\" as=\"sl\" hint-placeholder-count=\"5\">\n                  <div style=\"padding:10px 0;border-top:1px solid var(--fp-line)\">\n                    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px\">\n                      <span style=\"font-size:12.5px;font-weight:600\">{{ sl.lab }}<\u002Fspan>\n                      <span style=\"font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--fp-accent)\">{{ sl.val }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <input type=\"range\" min=\"{{ sl.min }}\" max=\"{{ sl.max }}\" step=\"{{ sl.step }}\" value=\"{{ sl.value }}\" sc-camel-on-change=\"{{ sl.onChange }}\" style=\"width:100%\">\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:10px\">05 · frais &amp; planchers<\u002Fdiv>\n                <sc-for list=\"{{ floorFields }}\" as=\"f2\" hint-placeholder-count=\"7\">\n                  <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                    <span style=\"display:block\"><b style=\"font-size:12.5px\">{{ f2.lab }}<\u002Fb><small style=\"display:block;color:var(--fp-ink-3);font-size:11px\">{{ f2.sub }}<\u002Fsmall><\u002Fspan>\n                    <input type=\"number\" value=\"{{ f2.value }}\" sc-camel-on-change=\"{{ f2.onChange }}\" style=\"width:88px;border:2px solid {{ f2.line }};background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n                  <\u002Flabel>\n                <\u002Fsc-for>\n                <div style=\"margin-top:12px;padding:10px 12px;border-left:2px solid var(--fp-accent);background:var(--fp-panel-2);font-size:12px;color:var(--fp-ink-2)\">Score de risque terrain : <strong style=\"color:var(--fp-ink)\">{{ riskLabel }}<\u002Fstrong> — prime de {{ primeLabel }} ajoutée à la marge exigée. Il vient de la checklist Terrain.<\u002Fdiv>\n                <div style=\"margin-top:12px;padding-top:12px;border-top:1px solid var(--fp-line);display:grid;gap:8px\">\n                  <div style=\"font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3);font-weight:600\">Déplacement calculé à la distance<\u002Fdiv>\n                  <div style=\"display:flex;gap:8px\">\n                    <label style=\"flex:1;display:grid;gap:3px\"><span style=\"font-size:11px;color:var(--fp-ink-3)\">Distance (km)<\u002Fspan>\n                      <input type=\"number\" value=\"{{ kmValue }}\" sc-camel-on-change=\"{{ onKm }}\" style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums\"><\u002Flabel>\n                    <label style=\"flex:1;display:grid;gap:3px\"><span style=\"font-size:11px;color:var(--fp-ink-3)\">Coût au km ($)<\u002Fspan>\n                      <input type=\"number\" value=\"{{ kmRate }}\" sc-camel-on-change=\"{{ onKmRate }}\" style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums\"><\u002Flabel>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12px;color:var(--fp-ink-2)\">{{ kmNote }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;gap:16px;position:sticky;top:210px\">\n              <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel)\">\n                <div style=\"padding:18px 18px 14px;border-bottom:1px solid var(--fp-line)\">\n                  <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3)\">Prix d'achat maximal<\u002Fdiv>\n                  <div class=\"fp-alert\" style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(46px,7vw,68px);line-height:1;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:{{ pamColor }};margin:6px 0 4px\">{{ pamValue }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:var(--fp-ink-2)\">{{ pamSub }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))\">\n                  <sc-for list=\"{{ pamMinis }}\" as=\"mi\" hint-placeholder-count=\"6\">\n                    <div style=\"padding:12px 14px;border-right:1px solid var(--fp-line);border-bottom:1px solid var(--fp-line)\">\n                      <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ mi.lab }}<\u002Fdiv>\n                      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;color:{{ mi.color }}\">{{ mi.val }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"padding:14px 18px 16px\">\n                  <div style=\"display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3);margin-bottom:6px\">\n                    <span>Poids des coûts sur le PRV<\u002Fspan><span style=\"color:var(--fp-ink);font-variant-numeric:tabular-nums\">{{ ratioVal }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:8px;background:var(--fp-panel-3)\"><div style=\"height:8px;background:{{ ratioColor }};width:{{ ratioWidth }}\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"margin-top:14px;padding:12px 14px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);font-size:12.5px;color:var(--fp-ink-2);line-height:1.6\">{{ verdictHtml }}<\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:12px\">\n                    <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onVendorCopy }}\" style=\"border-width:1px;border-radius:var(--fp-r-sm);padding:9px 13px;font-size:12px;font-weight:600;justify-content:flex-start\">Copier le message vendeur<\u002Fbutton>\n                    <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onMemorize }}\" style=\"border-width:1px;border-color:var(--fp-line-strong);border-radius:var(--fp-r-sm);padding:9px 13px;font-size:12px;font-weight:600;justify-content:flex-start\">Mémoriser ce calcul<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:12px;padding:11px 13px;border:1px solid {{ effColor }};border-radius:var(--fp-r);font-size:12.5px;color:var(--fp-ink-2)\"><strong style=\"color:{{ effColor }}\">Taux horaire effectif {{ effRate }}<\u002Fstrong> — {{ effAlert }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Marge inversée<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:9px\">Le vendeur annonce un prix : vois immédiatement ce qu'il reste.<\u002Fdiv>\n                <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                  <b style=\"font-size:12.5px\">Prix proposé par le vendeur<\u002Fb>\n                  <input type=\"number\" value=\"{{ invValue }}\" sc-camel-on-change=\"{{ onInv }}\" style=\"width:96px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:9px;font-size:14px;font-variant-numeric:tabular-nums;text-align:right\">\n                <\u002Flabel>\n                <div class=\"tag\" style=\"margin-top:8px;font-size:11px;font-weight:600;padding:5px 10px;border:1px solid {{ overLine }};border-radius:999px;background:{{ overBg }};color:{{ overFg }};letter-spacing:.06em;text-transform:uppercase\">{{ overLabel }}<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:2px;background:var(--fp-line);margin-top:10px\">\n                  <sc-for list=\"{{ invMinis }}\" as=\"iv\" hint-placeholder-count=\"3\">\n                    <div style=\"background:var(--fp-panel);padding:11px 12px\">\n                      <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ iv.lab }}<\u002Fdiv>\n                      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;color:{{ iv.color }}\">{{ iv.val }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:12px;font-size:12.5px;color:var(--fp-ink-2)\">{{ invVerdict }}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"border:1px solid var(--fp-accent);border-radius:var(--fp-r);background:color-mix(in srgb, var(--fp-accent) 12%, transparent);backdrop-filter:blur(6px);padding:16px\">\n                <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fp-accent);font-weight:600;margin-bottom:10px\">NO-GO automatiques<\u002Fdiv>\n                <sc-for list=\"{{ nogos }}\" as=\"g\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;gap:10px;padding:8px 0;border-top:1px solid color-mix(in srgb, var(--fp-accent) 40%, transparent);font-size:12.5px;color:var(--fp-ink-2)\">\n                    <span style=\"color:var(--fp-accent);font-weight:800\">—<\u002Fspan><span><strong style=\"color:var(--fp-ink)\">{{ g.t }}<\u002Fstrong> {{ g.d }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isNego }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-items:start\">\n            <div style=\"display:grid;gap:16px\">\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Trois scripts, un seul chiffre<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:var(--fp-ink-2)\">Générés depuis ton PAM courant et les défauts cochés en Terrain. Le chiffre ne change pas d'un script à l'autre — seul le ton change.<\u002Fdiv>\n                <sc-for list=\"{{ negoRows }}\" as=\"ng\" hint-placeholder-count=\"3\">\n                  <div style=\"padding:12px 0;border-top:1px solid var(--fp-line);display:grid;gap:8px;margin-top:10px\">\n                    <div style=\"display:flex;align-items:center;gap:10px\">\n                      <span class=\"tag\" style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:3px 8px;border:1px solid var(--fp-line-strong);border-radius:var(--fp-r)\">{{ ng.tone }}<\u002Fspan>\n                      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ ng.onCopy }}\" style=\"margin-left:auto;border-width:1px;border-color:var(--fp-line);border-radius:var(--fp-r-sm);padding:5px 10px;font-size:11px;font-weight:600;justify-content:flex-start\">Copier<\u002Fbutton>\n                    <\u002Fdiv>\n                    <p style=\"margin:0;font-size:12.5px;color:var(--fp-ink-2);line-height:1.65\">{{ ng.txt }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Contrôle IMEI<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:9px\">Structure et clé de contrôle vérifiées ici. Le vol et le financement se vérifient sur les registres, jamais dans une appli.<\u002Fdiv>\n                <input type=\"text\" value=\"{{ imeiValue }}\" sc-camel-on-change=\"{{ onImei }}\" placeholder=\"15 chiffres — *#06#\" style=\"width:100%;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:11px;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.08em\">\n                <div style=\"font-size:12.5px;color:{{ imeiColor }};margin-top:10px\">{{ imeiTxt }}<\u002Fdiv>\n                <sc-for list=\"{{ imeiRows }}\" as=\"ir\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--fp-line);font-size:12px\">\n                    <span style=\"color:var(--fp-ink-3);min-width:130px\">{{ ir.k }}<\u002Fspan><span style=\"color:var(--fp-ink-2)\">{{ ir.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:12px\">\n                  <sc-for list=\"{{ imeiLinks }}\" as=\"il\" hint-placeholder-count=\"3\">\n                    <a href=\"{{ il.url }}\" target=\"_blank\" rel=\"noopener\" style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);padding:7px 11px;font-size:11.5px;font-weight:600;color:var(--fp-ink-2)\">{{ il.label }}<\u002Fa>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:16px\">\n              <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Annonce de revente<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:9px\">Composée depuis le modèle, le stockage, les réparations faites et ton PRV.<\u002Fdiv>\n                <textarea value=\"{{ listingValue }}\" sc-camel-read-only=\"{{ true }}\" rows=\"14\" style=\"width:100%;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:12px;font-size:12.5px;line-height:1.6;resize:vertical\"><\u002Ftextarea>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:10px\">\n                  <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onListingCopy }}\" style=\"border-width:1px;border-radius:var(--fp-r-sm);padding:9px 13px;font-size:12px;font-weight:600;justify-content:flex-start\">Copier l'annonce<\u002Fbutton>\n                  <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onPrintFiche }}\" style=\"border-width:1px;border-color:var(--fp-line-strong);border-radius:var(--fp-r-sm);padding:9px 13px;font-size:12px;font-weight:600;justify-content:flex-start\">Fiche imprimable<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"fp-hud\">\n                <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px\">\n                  <span class=\"fp-hud-t\">03 · Rapport d'analyse d'annonce<\u002Fspan>\n                  <span class=\"fp-verdict\" style=\"margin-left:auto;color:{{ adVerdictFg }};border-color:{{ adVerdictLine }};background:{{ adVerdictBg }}\">{{ adVerdict }}<\u002Fspan>\n                <\u002Fdiv>\n                <textarea value=\"{{ adText }}\" sc-camel-on-change=\"{{ onAdText }}\" rows=\"5\" placeholder=\"Colle ici le texte de l'annonce du vendeur…\" class=\"fp-hud-in\"><\u002Ftextarea>\n                <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:9px\">\n                  <label style=\"display:flex;align-items:center;gap:7px;font-size:11px;color:var(--fp-ink-3)\">\n                    En ligne depuis\n                    <input type=\"number\" value=\"{{ adDays }}\" sc-camel-on-change=\"{{ onAdDays }}\" style=\"width:58px;background:#080c12;border:1px solid #1e2b3a;border-radius:6px;color:var(--fp-ink);padding:5px 7px;font-size:12px;font-variant-numeric:tabular-nums;text-align:right\">\n                    jours\n                  <\u002Flabel>\n                  <button class=\"fp-hud-go\" sc-camel-on-click=\"{{ adRun }}\">⚡ Lancer l'analyse HUD<\u002Fbutton>\n                  <span style=\"font-size:10.5px;color:#7dd3fc;letter-spacing:.06em\">{{ adCount }} signaux<\u002Fspan>\n                <\u002Fdiv>\n\n                <div style=\"margin-top:12px;display:flex;align-items:center;gap:10px\">\n                  <span style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3);white-space:nowrap\">Indice d'opportunité<\u002Fspan>\n                  <span class=\"fp-gauge\" style=\"flex:1\"><i style=\"width:{{ adScoreW }};background:{{ adScoreColor }};box-shadow:0 0 10px {{ adScoreColor }}\"><\u002Fi><\u002Fspan>\n                  <span style=\"font-family:var(--font-heading);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;color:{{ adScoreColor }};min-width:34px;text-align:right\">{{ adScore }}<\u002Fspan>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ adEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"margin-top:11px;font-size:11.5px;color:var(--fp-ink-3);line-height:1.5\">Colle l'annonce : le scanner relève les mots-clés à risque, calcule l'indice, coche les réparations annoncées et prépare tes axes d'attaque.<\u002Fdiv>\n                <\u002Fsc-if>\n\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:11px\">\n                  <sc-for list=\"{{ adKeys }}\" as=\"ak\" hint-placeholder-count=\"5\">\n                    <span class=\"fp-key {{ ak.cls }}\">{{ ak.ico }} {{ ak.t }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <div style=\"margin-top:12px;display:grid;gap:6px\">\n                  <sc-for list=\"{{ adArgs }}\" as=\"aa\" hint-placeholder-count=\"3\">\n                    <div style=\"border:1px solid #1e2b3a;border-radius:6px;background:#080c12;padding:9px 11px;display:flex;gap:10px;align-items:flex-start\">\n                      <span style=\"flex:1;min-width:0\">\n                        <b style=\"display:block;font-size:11.5px;color:#bfdbfe;font-weight:650\">{{ aa.t }}<\u002Fb>\n                        <span style=\"font-size:11.5px;color:var(--fp-ink-2);line-height:1.45\">{{ aa.d }}<\u002Fspan>\n                      <\u002Fspan>\n                      <span style=\"flex:0 0 auto;font-size:11px;font-weight:750;color:#fcd34d;white-space:nowrap\">{{ aa.v }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:11px\">\n                  <button class=\"fp-hud-go\" sc-camel-on-click=\"{{ adSendChat }}\" style=\"border-color:#10b981;background:rgba(16,185,129,.14);color:#6ee7b7;box-shadow:0 0 12px rgba(16,185,129,.25)\">➜ Injecter dans le conseiller<\u002Fbutton>\n                  <span style=\"font-size:10.5px;color:#6ee7b7\">{{ adAppliedNote }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">04 · Registre d'achat &amp; contrat d'acquisition<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:10px\">Relève l'identité du vendeur et l'IMEI avant de payer : c'est ta seule protection si l'appareil est réclamé plus tard.<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px\">\n                  <sc-for list=\"{{ regFields }}\" as=\"rf\" hint-placeholder-count=\"7\">\n                    <label style=\"display:grid;gap:3px\">\n                      <span style=\"font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fp-ink-3);font-weight:650\">{{ rf.lab }}<\u002Fspan>\n                      <input type=\"text\" value=\"{{ rf.value }}\" sc-camel-on-change=\"{{ rf.onChange }}\" placeholder=\"{{ rf.ph }}\" style=\"width:100%;border:1px solid var(--fp-line);border-radius:var(--fp-r-sm);background:var(--fp-panel-2);color:var(--fp-ink);padding:7px 9px;font-size:12.5px\">\n                    <\u002Flabel>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:11px\">\n                  <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ printRecu }}\" style=\"border-width:1px;border-radius:var(--fp-r-sm);padding:9px 13px;font-size:12px;font-weight:600;justify-content:flex-start\">📄 Générer le reçu d'achat<\u002Fbutton>\n                  <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ openRecu }}\" style=\"border-width:1px;border-color:var(--fp-line);border-radius:var(--fp-r-sm);color:var(--fp-ink-2);padding:9px 13px;font-size:12px;font-weight:600;justify-content:flex-start\">Aperçu<\u002Fbutton>\n                  <span style=\"font-size:11px;color:var(--fp-warn)\">{{ regWarn }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"margin-top:10px;font-size:10.5px;color:var(--fp-ink-3);line-height:1.5\">Ne conserve que le numéro de la pièce, jamais sa photo : l'application enregistre tout en clair dans ce navigateur. Ce reçu couvre les mentions usuelles d'une vente entre particuliers — fais-le valider si tu revends de façon régulière, le statut de commerçant d'occasion impose des obligations propres.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Conseiller de discussion &amp; relances<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:9px\">{{ chatNote }}<\u002Fdiv>\n                <div class=\"fp-nav\" style=\"margin-bottom:10px\">\n                  <sc-for list=\"{{ chatPhases }}\" as=\"cp\" hint-placeholder-count=\"4\">\n                    <button class=\"fp-pill\" sc-camel-on-click=\"{{ cp.onClick }}\" style=\"box-shadow:inset 0 0 0 999px {{ cp.bg }};color:{{ cp.fg }};padding:6px 12px;font-size:11.5px\">\n                      <span class=\"fp-pill-num\" style=\"color:{{ cp.numFg }}\">{{ cp.num }}<\u002Fspan>\n                      {{ cp.label }}\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:grid;gap:8px\">\n                  <sc-for list=\"{{ chatRows }}\" as=\"cm\" hint-placeholder-count=\"3\">\n                    <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r-sm);background:var(--fp-panel-2);padding:10px 12px;display:grid;gap:7px\">\n                      <div style=\"display:flex;align-items:center;gap:10px\">\n                        <span style=\"font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--fp-ink-3);font-weight:650\">{{ cm.titre }}<\u002Fspan>\n                        <button sc-camel-on-click=\"{{ cm.onCopy }}\" style=\"margin-left:auto;cursor:pointer;border:1px solid {{ cm.copyLine }};border-radius:6px;background:{{ cm.copyBg }};color:{{ cm.copyFg }};padding:4px 10px;font-size:11px;font-weight:650;white-space:nowrap;transition:background .15s ease,color .15s ease\">{{ cm.copyLabel }}<\u002Fbutton>\n                      <\u002Fdiv>\n                      <p style=\"margin:0;font-size:12.5px;color:var(--fp-ink-2);line-height:1.55\">{{ cm.texte }}<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:10px;padding:9px 11px;border-left:2px solid var(--fp-blue);background:var(--fp-panel-2);font-size:11.5px;color:var(--fp-ink-2);line-height:1.5\">{{ chatHint }}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:10px\">Vérifier le PRV en un clic<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <sc-for list=\"{{ marketRows }}\" as=\"mk\" hint-placeholder-count=\"3\">\n                    <a href=\"{{ mk.url }}\" target=\"_blank\" rel=\"noopener\" style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);padding:9px 13px;font-size:12px;font-weight:600;color:var(--fp-ink)\">{{ mk.label }}<\u002Fa>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--fp-ink-3);margin-top:10px\">Recherches pré-filtrées sur le modèle et le stockage choisis. Sur eBay, seules les ventes conclues comptent.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isLot }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;align-items:start\">\n            <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n              <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Achat groupé<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:8px\">Un lot ne se négocie qu'en un seul chiffre pour le tout. La remise paye ton risque de concentration, pas l'inverse.<\u002Fdiv>\n              <sc-for list=\"{{ bulkFields }}\" as=\"bf\" hint-placeholder-count=\"3\">\n                <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                  <span style=\"display:block\"><b style=\"font-size:12.5px\">{{ bf.lab }}<\u002Fb><small style=\"display:block;color:var(--fp-ink-3);font-size:11px\">{{ bf.sub }}<\u002Fsmall><\u002Fspan>\n                  <input type=\"number\" value=\"{{ bf.value }}\" sc-camel-on-change=\"{{ bf.onChange }}\" style=\"width:88px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n                <\u002Flabel>\n              <\u002Fsc-for>\n              <div style=\"margin-top:12px;padding:10px 12px;border-left:2px solid var(--fp-blue);background:var(--fp-panel-2);font-size:12px;color:var(--fp-ink-2);line-height:1.5\">{{ bulkSplit }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:14px\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px;background:var(--fp-line)\">\n                <sc-for list=\"{{ bulkMinis }}\" as=\"bm\" hint-placeholder-count=\"6\">\n                  <div style=\"background:var(--fp-panel);padding:12px\">\n                    <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ bm.lab }}<\u002Fdiv>\n                    <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums\">{{ bm.val }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:14px;padding:12px 14px;border:1px solid color-mix(in srgb, var(--fp-ok) 45%, transparent);border-radius:var(--fp-r);background:color-mix(in srgb, var(--fp-ok) 9%, transparent);font-size:12.5px;color:var(--fp-ink-2);line-height:1.55\">{{ bulkTargetNote }}<\u002Fdiv>\n              <div style=\"margin-top:10px;padding:12px 14px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);font-size:12.5px;color:var(--fp-ink-2)\">{{ bulkVerdict }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isTournee }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;align-items:start\">\n            <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n              <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Tournée multi-rendez-vous<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:8px\">Trois achats dans la même journée partagent un seul trajet : c'est là que le déplacement s'amortit.<\u002Fdiv>\n              <sc-for list=\"{{ tourFields }}\" as=\"tf\" hint-placeholder-count=\"3\">\n                <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                  <span style=\"display:block\"><b style=\"font-size:12.5px\">{{ tf.lab }}<\u002Fb><small style=\"display:block;color:var(--fp-ink-3);font-size:11px\">{{ tf.sub }}<\u002Fsmall><\u002Fspan>\n                  <input type=\"number\" value=\"{{ tf.value }}\" sc-camel-on-change=\"{{ tf.onChange }}\" style=\"width:88px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:14px\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px;background:var(--fp-line)\">\n                <sc-for list=\"{{ tourMinis }}\" as=\"tm\" hint-placeholder-count=\"4\">\n                  <div style=\"background:var(--fp-panel);padding:12px\">\n                    <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ tm.lab }}<\u002Fdiv>\n                    <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums\">{{ tm.val }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:14px;padding:12px 14px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);font-size:12.5px;color:var(--fp-ink-2)\">{{ tourVerdict }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isRotation }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;align-items:start\">\n            <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n              <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Vélocité du capital<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:8px\">Avec moins de 1 000 $, la contrainte n'est pas la marge par appareil — c'est le nombre de fois que ton argent tourne dans le mois. 100 $ en 7 jours écrase 200 $ en 25 jours.<\u002Fdiv>\n              <sc-for list=\"{{ roFields }}\" as=\"f3\" hint-placeholder-count=\"5\">\n                <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                  <span style=\"display:block\"><b style=\"font-size:12.5px\">{{ f3.lab }}<\u002Fb><small style=\"display:block;color:var(--fp-ink-3);font-size:11px\">{{ f3.sub }}<\u002Fsmall><\u002Fspan>\n                  <input type=\"number\" value=\"{{ f3.value }}\" sc-camel-on-change=\"{{ f3.onChange }}\" style=\"width:88px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:16px\">\n              <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:14px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3)\">Profit mensuel théorique<\u002Fdiv>\n                <div style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,6vw,58px);line-height:1;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:var(--fp-accent);margin:6px 0 10px\">{{ roOut }}<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:2px;background:var(--fp-line)\">\n                  <sc-for list=\"{{ roMinis }}\" as=\"rm\" hint-placeholder-count=\"4\">\n                    <div style=\"background:var(--fp-panel);padding:11px 12px\">\n                      <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ rm.lab }}<\u002Fdiv>\n                      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums\">{{ rm.val }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:14px;font-size:12.5px;color:var(--fp-ink-2)\">{{ roVerdict }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:10px\">Ce que coûte un jour de retard<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 80px 110px 100px;gap:0;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fp-ink-3);border-bottom:1px solid var(--fp-line-strong);padding-bottom:7px\">\n                  <span>Délai de vente<\u002Fspan><span style=\"text-align:right\">Flips/mois<\u002Fspan><span style=\"text-align:right\">Profit/mois<\u002Fspan><span style=\"text-align:right\">Écart<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ roTable }}\" as=\"rt\" hint-placeholder-count=\"6\">\n                  <div style=\"display:grid;grid-template-columns:1fr 80px 110px 100px;gap:0;padding:9px 0;border-bottom:1px solid var(--fp-line);font-size:12.5px;font-variant-numeric:tabular-nums;background:{{ rt.bg }}\">\n                    <span style=\"font-weight:600\">{{ rt.j }}<\u002Fspan><span style=\"text-align:right;color:var(--fp-ink-2)\">{{ rt.flips }}<\u002Fspan><span style=\"text-align:right\">{{ rt.profit }}<\u002Fspan><span style=\"text-align:right;color:{{ rt.ecartColor }}\">{{ rt.ecart }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isPnl }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;align-items:start\">\n            <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n              <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Le vrai profit, une fois vendu<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:8px\">Rempli après la vente. C'est ce chiffre qui recalibre tes PRV, pas ton intuition.<\u002Fdiv>\n              <sc-for list=\"{{ plFields }}\" as=\"f4\" hint-placeholder-count=\"10\">\n                <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                  <span style=\"display:block\"><b style=\"font-size:12.5px\">{{ f4.lab }}<\u002Fb><small style=\"display:block;color:var(--fp-ink-3);font-size:11px\">{{ f4.sub }}<\u002Fsmall><\u002Fspan>\n                  <input type=\"number\" value=\"{{ f4.value }}\" sc-camel-on-change=\"{{ f4.onChange }}\" style=\"width:88px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:14px;position:sticky;top:210px\">\n              <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3)\">Profit net encaissé<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,6vw,58px);line-height:1;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:{{ plColor }};margin:6px 0 4px\">{{ plOut }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--fp-ink-2);margin-bottom:12px\">{{ plPct }}<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px;background:var(--fp-line)\">\n                <sc-for list=\"{{ plMinis }}\" as=\"pm\" hint-placeholder-count=\"4\">\n                  <div style=\"background:var(--fp-panel);padding:11px 12px\">\n                    <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ pm.lab }}<\u002Fdiv>\n                    <div style=\"font-family:var(--font-heading);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums\">{{ pm.val }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:14px;padding:12px 14px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);font-size:12.5px;color:var(--fp-ink-2)\">{{ plVerdict }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel)\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:11px 13px 9px\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fp-ink-2)\">5 derniers PAM<\u002Fspan>\n            <button sc-camel-on-click=\"{{ onMemorize }}\" style=\"margin-left:auto;cursor:pointer;border:0;background:transparent;color:var(--fp-ink-3);padding:0 4px;font-size:15px;font-weight:700;line-height:1\">⋯<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ histEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:0 13px 14px;font-size:12px;color:var(--fp-ink-3)\">Rien de mémorisé. Touche ⋯ ou la touche ↵ pour garder un PAM sous la main et le comparer au suivant.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div class=\"fp-strip\">\n            <sc-for list=\"{{ histRows }}\" as=\"hc\" hint-placeholder-count=\"5\">\n              <div class=\"fp-tile\">\n                <button class=\"fp-tile-x\" sc-camel-on-click=\"{{ hc.onRemove }}\" title=\"Retirer\">×<\u002Fbutton>\n                <button class=\"fp-tile-hit\" sc-camel-on-click=\"{{ hc.onRestore }}\" title=\"Recharger ce calcul\"><\u002Fbutton>\n                <svg sc-camel-view-box=\"0 0 40 78\" style=\"width:33px;height:64px;display:block;flex:0 0 auto\">\n                  <rect x=\"1.6\" y=\"1.6\" width=\"36.8\" height=\"74.8\" rx=\"7\" fill=\"{{ hc.dev.teinte }}\" stroke=\"rgba(0,0,0,.45)\" stroke-width=\".8\"><\u002Frect>\n                  <rect x=\"3.4\" y=\"3.4\" width=\"33.2\" height=\"71.2\" rx=\"5.4\" fill=\"none\" stroke=\"rgba(255,255,255,.16)\" stroke-width=\".7\"><\u002Frect>\n\n                  <rect x=\"4.6\" y=\"4.6\" width=\"13\" height=\"13\" rx=\"3.6\" fill=\"rgba(0,0,0,.22)\" stroke=\"rgba(255,255,255,.14)\" stroke-width=\".6\"><\u002Frect>\n                  <circle cx=\"8.5\" cy=\"8.5\" r=\"2.2\" fill=\"#15161a\"><\u002Fcircle>\n                  <sc-if value=\"{{ hc.dev.isDuo }}\" hint-placeholder-val=\"{{ true }}\">\n                    <circle cx=\"13.7\" cy=\"13.7\" r=\"2.2\" fill=\"#15161a\"><\u002Fcircle>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ hc.dev.isDuoV }}\" hint-placeholder-val=\"{{ false }}\">\n                    <circle cx=\"8.5\" cy=\"13.7\" r=\"2.2\" fill=\"#15161a\"><\u002Fcircle>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ hc.dev.isTrio }}\" hint-placeholder-val=\"{{ false }}\">\n                    <circle cx=\"13.7\" cy=\"8.5\" r=\"2.2\" fill=\"#15161a\"><\u002Fcircle>\n                    <circle cx=\"8.5\" cy=\"13.7\" r=\"2.2\" fill=\"#15161a\"><\u002Fcircle>\n                  <\u002Fsc-if>\n                <\u002Fsvg>\n                <span style=\"font-size:10.5px;font-weight:600;line-height:1.2;text-align:center\">{{ hc.model }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading);font-weight:750;font-size:15px;line-height:1;font-variant-numeric:tabular-nums\">{{ hc.pam }}<\u002Fspan>\n                <span class=\"fp-chip\" style=\"background:{{ hc.badgeBg }};color:{{ hc.badgeFg }}\">{{ hc.badge }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isTerrain }}\" hint-placeholder-val=\"{{ true }}\">\n      <section data-screen-label=\"Terrain\" style=\"display:grid;gap:16px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;border-bottom:1px solid var(--fp-line);padding-bottom:14px\">\n          <div style=\"max-width:640px\">\n            <h2 style=\"font-size:clamp(24px,3vw,32px);margin:0 0 6px\">Inspection sur place — 12 minutes<\u002Fh2>\n            <p style=\"margin:0;color:var(--fp-ink-2);font-size:13px\">Les <strong>bloquants<\u002Fstrong> se testent en premier : s'il y en a un, tu te lèves et tu pars, peu importe le prix. Les autres points alimentent le score de risque qui remonte dans le PAM. Les points non testés comptent pour la moitié de leur poids.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"fp-seg\" style=\"display:flex;margin-left:auto\">\n            <sc-for list=\"{{ terrainSubs }}\" as=\"ts\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ ts.onClick }}\" style=\"cursor:pointer;border:1px solid var(--fp-line);border-radius:var(--fp-r);border-right-width:0;padding:9px 14px;font-size:12px;font-weight:600;background:{{ ts.bg }};color:{{ ts.fg }}\">{{ ts.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n            <span style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);border-left-width:0\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px;background:var(--fp-line);border:1px solid var(--fp-line-strong);border-radius:var(--fp-r)\">\n          <div style=\"background:var(--fp-panel);padding:13px\">\n            <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3)\">Score de risque<\u002Fdiv>\n            <div class=\"fp-alert\" style=\"font-family:var(--font-heading);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:{{ ckColor }}\">{{ ckScore }}<\u002Fdiv>\n            <div style=\"height:8px;background:var(--fp-panel-3);margin:8px 0 6px\"><div style=\"height:8px;background:{{ riskBarColor }};width:{{ riskBarWidth }};transition:width .3s ease\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--fp-ink-2);margin-top:6px\">{{ ckTitle }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--fp-panel);padding:13px\">\n            <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3)\">Avancement<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums\">{{ ckProgress }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--fp-ink-2);margin-top:6px\">points renseignés sur la liste active<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--fp-panel);padding:13px;display:flex;flex-direction:column;gap:8px;justify-content:center\">\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ ckToPam }}\" style=\"border-width:1px;border-radius:var(--fp-r-sm);padding:10px 14px;font-size:12px;font-weight:600;justify-content:flex-start;min-height:48px\">→ Envoyer le score au PAM<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ toggleLock }}\" style=\"cursor:pointer;border:1px solid var(--fp-accent);border-radius:var(--fp-r);background:{{ lockBg }};color:{{ lockFg }};padding:10px 14px;font-size:12px;font-weight:700;text-align:left;letter-spacing:.06em;text-transform:uppercase;min-height:48px\">{{ lockLabel }}<\u002Fbutton>\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ ckReset }}\" style=\"border-width:1px;border-color:var(--fp-line-strong);border-radius:var(--fp-r-sm);padding:10px 14px;font-size:12px;font-weight:600;justify-content:flex-start;min-height:48px\">Vider la liste<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px;background:var(--fp-line);border:1px solid var(--fp-line);border-radius:var(--fp-r);margin-bottom:4px\">\n          <div style=\"background:var(--fp-panel);padding:14px;display:flex;align-items:center;gap:12px\">\n            <span style=\"font-family:var(--font-heading);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;color:{{ timerColor }}\">{{ timerLabel }}<\u002Fspan>\n            <span style=\"font-size:11.5px;color:var(--fp-ink-2);flex:1\">{{ timerNote }}<\u002Fspan>\n            <span style=\"display:flex;gap:6px\">\n              <button sc-camel-on-click=\"{{ onTimer }}\" style=\"cursor:pointer;border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:transparent;color:var(--fp-ink);padding:8px 11px;font-size:11.5px;font-weight:600\">{{ timerBtn }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onTimerReset }}\" style=\"cursor:pointer;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:transparent;color:var(--fp-ink-3);padding:8px 11px;font-size:11.5px;font-weight:600\">0:00<\u002Fbutton>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background:var(--fp-panel);padding:14px;display:grid;gap:8px\">\n            <div style=\"display:flex;gap:6px\">\n              <button sc-camel-on-click=\"{{ onVoiceCheck }}\" style=\"cursor:pointer;flex:1;border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:{{ voiceBg }};color:{{ voiceFg }};padding:9px 11px;font-size:11.5px;font-weight:600;text-align:left;min-height:44px\">{{ voiceLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onVoiceNotes }}\" style=\"cursor:pointer;flex:1;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:transparent;color:var(--fp-ink-2);padding:9px 11px;font-size:11.5px;font-weight:600;text-align:left;min-height:44px\">{{ dictLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;color:var(--fp-ink-3)\">{{ voiceMsg }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--fp-panel);padding:14px;display:grid;gap:6px\">\n            <span style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3);font-weight:600\">Notes de terrain<\u002Fspan>\n            <textarea value=\"{{ notesValue }}\" sc-camel-on-change=\"{{ onNotes }}\" rows=\"3\" placeholder=\"Vices cachés, ce que le vendeur a dit, ce qu'il a esquivé…\" style=\"width:100%;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:9px;font-size:12.5px;resize:vertical\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;align-items:start\">\n          <div class=\"fp-hud\">\n            <span class=\"fp-hud-t\">Mire écran &amp; grille tactile<\u002Fspan>\n            <div style=\"margin-top:8px;font-size:11.5px;color:var(--fp-ink-2);line-height:1.5\">Cinq aplats plein écran pour les pixels morts, le burn-in et la poussière sous la dalle, plus une grille de 16 zones à balayer du doigt pour débusquer une zone tactile morte.<\u002Fdiv>\n            <button class=\"fp-hud-go\" sc-camel-on-click=\"{{ openMire }}\" style=\"margin-top:10px\">📱 Test écran &amp; tactile HUD<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div class=\"fp-hud\">\n            <span class=\"fp-hud-t\">Audio &amp; haptique<\u002Fspan>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:9px\">\n              <button class=\"fp-hud-go\" sc-camel-on-click=\"{{ playSweep }}\">🔊 Balayage 200 Hz → 14 kHz<\u002Fbutton>\n              <button class=\"fp-hud-go\" sc-camel-on-click=\"{{ playHaptic }}\" style=\"border-color:#10b981;background:rgba(16,185,129,.14);color:#6ee7b7\">📳 Séquence haptique<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"margin-top:9px;font-size:11.5px;color:var(--fp-ink-2);line-height:1.5\">{{ audioNote }}<\u002Fdiv>\n            <div style=\"margin-top:6px;font-size:11px;color:var(--fp-ink-3);line-height:1.5\">{{ hapticNote }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n            <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:6px\">Appareil déjà ouvert ? — indices d'étanchéité<\u002Fdiv>\n            <div style=\"font-size:11px;color:var(--fp-ink-3);line-height:1.5;margin-bottom:9px\">Aucun navigateur n'expose le baromètre de l'iPhone : le test de pression ne peut pas se faire depuis cette application. Ces cinq indices visuels donnent la même réponse en trente secondes.<\u002Fdiv>\n            <div style=\"display:grid;gap:6px\">\n              <sc-for list=\"{{ sealRows }}\" as=\"sr2\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;gap:9px;align-items:flex-start;border:1px solid var(--fp-line);border-radius:var(--fp-r-sm);background:var(--fp-panel-2);padding:8px 10px\">\n                  <span style=\"flex:0 0 auto;color:var(--fp-warn);font-size:11px;line-height:1.5\">◆<\u002Fspan>\n                  <span style=\"font-size:11.5px;color:var(--fp-ink-2);line-height:1.5\">{{ sr2 }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n            <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:9px\">Bilan d'inspection<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--fp-line);border:1px solid var(--fp-line);border-radius:var(--fp-r-sm);overflow:hidden;margin-bottom:10px\">\n              <div style=\"background:var(--fp-panel-2);padding:8px 9px\"><div style=\"font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--fp-ink-3)\">Testés<\u002Fdiv><div style=\"font-size:15px;font-weight:800;font-variant-numeric:tabular-nums\">{{ bilan.testes }}<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:var(--fp-panel-2);padding:8px 9px\"><div style=\"font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--fp-ink-3)\">Bloquants<\u002Fdiv><div style=\"font-size:15px;font-weight:800;color:var(--fp-bad);font-variant-numeric:tabular-nums\">{{ bilan.bloquants }}<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:var(--fp-panel-2);padding:8px 9px\"><div style=\"font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--fp-ink-3)\">Majeurs<\u002Fdiv><div style=\"font-size:15px;font-weight:800;color:var(--fp-warn);font-variant-numeric:tabular-nums\">{{ bilan.majeurs }}<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:var(--fp-panel-2);padding:8px 9px\"><div style=\"font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--fp-ink-3)\">Décote<\u002Fdiv><div style=\"font-size:15px;font-weight:800;color:var(--fp-ok);font-variant-numeric:tabular-nums\">{{ bilan.montant }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:5px\">\n              <sc-for list=\"{{ bilan.rows }}\" as=\"br\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:9px;font-size:11.5px\">\n                  <span style=\"color:{{ br.c }};font-weight:750;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;flex:0 0 62px\">{{ br.type }}<\u002Fspan>\n                  <span style=\"color:var(--fp-ink-2)\">{{ br.t }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:9px;font-size:11.5px;color:var(--fp-ink-2);line-height:1.5\">{{ bilan.phrase }}<\u002Fdiv>\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ transferBilan }}\" style=\"margin-top:10px;border-width:1px;border-radius:var(--fp-r-sm);padding:9px 13px;font-size:12px;font-weight:600;justify-content:flex-start\">→ Transférer les anomalies au PAM<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isTerrainList }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px\">\n            <sc-for list=\"{{ ckRows }}\" as=\"c\" hint-placeholder-count=\"20\">\n              <div style=\"border:1px solid {{ c.line }};border-radius:var(--fp-r);background:var(--fp-panel);padding:13px 15px;display:grid;gap:8px;transition:border-color .18s ease\" style-hover=\"border-color:var(--fp-line-strong)\">\n                <div style=\"display:flex;gap:10px;align-items:flex-start\">\n                  <span style=\"font-size:11px;font-variant-numeric:tabular-nums;color:var(--fp-ink-3);padding-top:2px\">{{ c.num }}<\u002Fspan>\n                  <span style=\"flex:1;font-weight:600;font-size:13.5px\">{{ c.t }}<\u002Fspan>\n                  <span class=\"tag\" style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:3px 7px;border:2px solid {{ c.tagLine }};color:{{ c.tagFg }};background:{{ c.tagBg }};white-space:nowrap\">{{ c.tag }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--fp-ink-2);line-height:1.6\">{{ c.hint }}<\u002Fdiv>\n                <div style=\"display:flex;gap:8px\">\n                  <button sc-camel-on-click=\"{{ c.onOk }}\" style=\"cursor:pointer;flex:1;min-height:52px;border:1px solid {{ c.okLine }};border-radius:var(--fp-r-sm);background:{{ c.okBg }};color:{{ c.okFg }};padding:9px 12px;font-size:13px;font-weight:600;text-align:left\">Conforme<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ c.onKo }}\" style=\"cursor:pointer;flex:1;min-height:52px;border:1px solid {{ c.koLine }};border-radius:var(--fp-r-sm);background:{{ c.koBg }};color:{{ c.koFg }};padding:9px 12px;font-size:13px;font-weight:600;text-align:left\">{{ c.koLabel }}<\u002Fbutton>\n                  <sc-if value=\"{{ c.hasGuide }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button sc-camel-on-click=\"{{ c.onGuide }}\" style=\"cursor:pointer;min-height:52px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:transparent;color:var(--fp-accent);padding:9px 12px;font-size:13px;font-weight:700\">?<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isDecote }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;align-items:start\">\n            <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n              <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Décote terrain<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:10px\">Touche chaque défaut constaté qui n'était pas annoncé. Tu ne négocies jamais un pourcentage : tu énumères, tu additionnes, tu proposes un chiffre. {{ dcAutoNote }}<\u002Fdiv>\n              <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line);margin-bottom:10px\">\n                <b style=\"font-size:12.5px\">Prix demandé par le vendeur<\u002Fb>\n                <input type=\"number\" value=\"{{ f.dcDemande }}\" sc-camel-on-change=\"{{ h.dcDemande }}\" style=\"width:88px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n              <\u002Flabel>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px\">\n                <sc-for list=\"{{ dcRows }}\" as=\"d\" hint-placeholder-count=\"8\">\n                  <button sc-camel-on-click=\"{{ d.onClick }}\" style=\"cursor:pointer;border:2px solid {{ d.line }};background:{{ d.bg }};color:{{ d.fg }};padding:10px;text-align:left;display:grid;gap:2px\">\n                    <span style=\"font-family:var(--font-heading);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums\">{{ d.v }}<\u002Fspan>\n                    <span style=\"font-size:11.5px\">{{ d.l }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:14px\">\n              <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3)\">Plafond après décote<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,6vw,58px);line-height:1;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:var(--fp-accent);margin:6px 0 10px\">{{ dcPlafond }}<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px;background:var(--fp-line)\">\n                <sc-for list=\"{{ dcMinis }}\" as=\"dm\" hint-placeholder-count=\"3\">\n                  <div style=\"background:var(--fp-panel);padding:11px 12px\">\n                    <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ dm.lab }}<\u002Fdiv>\n                    <div style=\"font-family:var(--font-heading);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums\">{{ dm.val }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:14px;padding:12px 14px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);font-size:12.5px;color:var(--fp-ink-2)\">{{ dcVerdict }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isRepair }}\" hint-placeholder-val=\"{{ true }}\">\n      <section data-screen-label=\"Repair Lab\" style=\"display:grid;gap:16px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;border-bottom:1px solid var(--fp-line);padding-bottom:14px\">\n          <div style=\"max-width:640px\">\n            <h2 style=\"font-size:clamp(24px,3vw,32px);margin:0 0 6px\">Repair Lab<\u002Fh2>\n            <p style=\"margin:0;color:var(--fp-ink-2);font-size:13px\">Chaque réparation est classée p n-items:center\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center\">\n            <span style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3);font-weight:600\">Génération<\u002Fspan>\n            <sc-for list=\"{{ mdGenChips }}\" as=\"gc\" hint-placeholder-count=\"6\">\n              <button sc-camel-on-click=\"{{ gc.onClick }}\" style=\"cursor:pointer;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:{{ gc.bg }};color:{{ gc.fg }};padding:6px 11px;font-size:11.5px;font-weight:600;text-align:left\">{{ gc.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center\">\n            <span style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3);font-weight:600\">Trier par<\u002Fspan>\n            <sc-for list=\"{{ mdSortCols }}\" as=\"sc2\" hint-placeholder-count=\"6\">\n              <button sc-camel-on-click=\"{{ sc2.onClick }}\" style=\"cursor:pointer;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:{{ sc2.bg }};color:{{ sc2.fg }};padding:6px 11px;font-size:11.5px;font-weight:600;text-align:left;font-variant-numeric:tabular-nums\">{{ sc2.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);overflow-x:auto\">\n          <div style=\"min-width:1040px\">\n            <div style=\"display:grid;grid-template-columns:1.5fr 92px 80px 92px 92px 92px 78px 78px 62px 100px;border-bottom:1px solid var(--fp-line-strong);padding:11px 16px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fp-ink-3)\">\n              <span>Modèle<\u002Fspan><span style=\"text-align:right\">PRV<\u002Fspan><span style=\"text-align:right\">Recond.<\u002Fspan><span style=\"text-align:right\">P
