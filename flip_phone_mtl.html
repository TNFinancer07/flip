  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"bb190103-1066-4cec-9a93-a64ca16cd563\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"002d1abb-ebc5-4cca-bc3e-1ca56aa06a73\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n  <script src=\"41620632-34fc-4439-9ed6-26d209f77e84\"><\u002Fscript>\n  <style>\n    /* ── Palette OLED Dark Mode — fond #0a0a0a, cartes #101010/#161616,\n          filets 1px #2a2a2a, rayons 12px / 8px, accents vert-bleu-rouge ── */\n    :root, [data-fp-theme=\"dark\"]{\n      --fp-r:12px; --fp-r-sm:8px;\n      --fp-bg:#0a0a0a; --fp-panel:#101010; --fp-panel-2:#161616; --fp-panel-3:#1f1f1f;\n      --fp-line:#2a2a2a; --fp-line-strong:#3a3a3a;\n      --fp-ink:#f4f4f5; --fp-ink-2:#a1a1aa; --fp-ink-3:#6b7280;\n      --fp-accent:#10b981; --fp-accent-soft:#052e22; --fp-accent-line:#10b981; --fp-on-accent:#04150e;\n      --fp-ok:#10b981; --fp-warn:#f59e0b; --fp-bad:#ef4444; --fp-blue:#3b82f6;\n      --color-bg:#0a0a0a; --color-surface:#101010; --color-text:#f4f4f5; --color-accent:#10b981;\n      --color-divider:#2a2a2a;\n    }\n    [data-fp-theme=\"oled\"]{\n      --fp-r:12px; --fp-r-sm:8px;\n      --fp-bg:#0a0a0a; --fp-panel:#101010; --fp-panel-2:#161616; --fp-panel-3:#1f1f1f;\n      --fp-line:#2a2a2a; --fp-line-strong:#3a3a3a;\n      --fp-ink:#f4f4f5; --fp-ink-2:#a1a1aa; --fp-ink-3:#6b7280;\n      --fp-accent:#10b981; --fp-accent-soft:#052e22; --fp-accent-line:#10b981; --fp-on-accent:#04150e;\n      --fp-ok:#10b981; --fp-warn:#f59e0b; --fp-bad:#ef4444; --fp-blue:#3b82f6;\n      --color-bg:#0a0a0a; --color-surface:#101010; --color-text:#f4f4f5; --color-accent:#10b981;\n      --color-divider:#2a2a2a;\n    }\n    [data-fp-theme=\"light\"]{\n      --fp-r:12px; --fp-r-sm:8px;\n      --fp-blue:#2563eb;\n      --fp-bg:#eae9e9; --fp-panel:#f8f7f7; --fp-panel-2:#f3f2f2; --fp-panel-3:#e4e2e2;\n      --fp-line:#c9c5c5; --fp-line-strong:#201e1d;\n      --fp-ink:#201e1d; --fp-ink-2:#605d5d; --fp-ink-3:#7d7979;\n      --fp-accent:#dd2b0f; --fp-accent-soft:#ffe0d9; --fp-accent-line:#ff9783; --fp-on-accent:#fff2ef;\n      --fp-ok:#1f7a52; --fp-warn:#a86a10; --fp-bad:var(--fp-accent);\n      --color-bg:#f3f2f2; --color-surface:#eae9e9; --color-text:#201e1d; --color-accent:#dd2b0f;\n      --color-divider:color-mix(in srgb, #201e1d 40%, transparent);\n    }\n    body{margin:0;background:var(--fp-bg);color:var(--fp-ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}\n    [data-fp-app] .btn,[data-fp-app] .tag{border-radius:var(--fp-r-sm)}\n    [data-fp-app] input,[data-fp-app] select,[data-fp-app] textarea{border-radius:var(--fp-r-sm)}\n    a{color:var(--fp-accent);text-decoration:none}\n    a:hover{color:var(--fp-ink)}\n    input,select,textarea,button{font-family:var(--font-body)}\n    input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--fp-accent);outline-offset:2px}\n    ::selection{background:var(--fp-accent);color:var(--fp-on-accent)}\n    ::-webkit-scrollbar{height:6px;width:6px}\n    ::-webkit-scrollbar-thumb{background:var(--fp-line-strong)}\n    ::-webkit-scrollbar-track{background:transparent}\n    @keyframes fpBadge{from{transform:translateY(-3px);opacity:0}to{transform:none;opacity:1}}\n    [data-fp-eco=\"1\"] *{transition:none!important;animation:none!important}\n    @media print{\n      body{background:#fff}\n      [data-fp-app] > *:not([data-fp-fiche]){display:none!important}\n      [data-fp-fiche]{position:static!important;inset:auto!important;background:#fff!important;color:#000!important;border:0!important;padding:0!important}\n      [data-fp-fiche] [data-fp-noprint]{display:none!important}\n    }\n    @keyframes fpFade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}\n    input[type=\"range\"]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;cursor:pointer}\n    input[type=\"range\"]::-webkit-slider-runnable-track{height:4px;background:var(--fp-panel-3)}\n    input[type=\"range\"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;background:var(--fp-accent)}\n    input[type=\"range\"]::-moz-range-track{height:4px;background:var(--fp-panel-3)}\n    input[type=\"range\"]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:0;background:var(--fp-accent)}\n\n    /* ══════════ REDESIGN — SaaS dashboard ultra-compact, haute densité ══════════ */\n\n    /* ── Header KPI : strictement 5 cartes sur 1 seule ligne, ~75 px ── */\n    .fp-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:10px 14px 12px;align-items:stretch}\n    .fp-kpi{\n      border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);\n      padding:9px 12px;min-height:75px;max-height:78px;overflow:hidden;\n      display:flex;flex-direction:column;justify-content:center;gap:1px;\n      transition:border-color .18s ease;\n    }\n    .fp-kpi:hover{border-color:var(--fp-line-strong)}\n    .fp-kpi-lab{\n      font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fp-ink-3);\n      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;\n    }\n    .fp-kpi-val{\n      font-family:var(--font-heading);font-weight:700;font-size:25px;line-height:1.05;\n      letter-spacing:-0.03em;font-variant-numeric:tabular-nums;white-space:nowrap;\n    }\n    .fp-kpi-sub{\n      font-size:10px;color:var(--fp-ink-3);line-height:1.25;\n      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\n    }\n    .fp-kpi-row{display:flex;align-items:center;gap:9px;min-width:0}\n    .fp-kpi-spark{flex:1;min-width:34px;height:26px;display:block}\n    /* carte trésorerie : le graphe occupe toute la carte */\n    .fp-kpi-chart{padding:8px 11px 6px;gap:2px}\n    .fp-kpi-chart .fp-kpi-lab{font-size:10px;letter-spacing:0;text-transform:none;color:var(--fp-ink-2);font-weight:500}\n    .fp-kpi-chart svg{width:100%;height:44px;display:block;margin-top:1px}\n\n    /* ── Bandeau titre PAM ── */\n    .fp-hero{\n      border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);\n      padding:13px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;\n    }\n    .fp-hero-t{\n      font-family:var(--font-heading);font-weight:750;font-size:clamp(26px,2.9vw,34px);\n      letter-spacing:-0.035em;margin:0;line-height:1;\n    }\n    .fp-hero-badge{\n      font-size:10.5px;font-weight:750;letter-spacing:.09em;padding:3px 8px;border-radius:6px;\n      color:var(--fp-ok);border:1px solid color-mix(in srgb, var(--fp-ok) 38%, transparent);\n      background:color-mix(in srgb, var(--fp-ok) 14%, transparent);\n    }\n    .fp-hero-sub{margin:0;color:var(--fp-ink-3);font-size:13px;flex:1 1 100%;line-height:1.35}\n\n    /* ── Navigation en pilules ── */\n    .fp-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;background:transparent;border:0}\n    .fp-pill{\n      flex:0 0 auto;cursor:pointer;display:flex;align-items:center;gap:7px;\n      border:1px solid var(--fp-line);border-radius:var(--fp-r-sm);background:var(--fp-panel);\n      padding:7px 14px;font-size:12.5px;font-weight:500;color:var(--fp-ink-2);white-space:nowrap;\n      transition:background .14s ease,color .14s ease,border-color .14s ease;\n    }\n    .fp-pill:hover{background:var(--fp-panel-2);color:var(--fp-ink)}\n    .fp-pill[data-on=\"1\"]{background:#232326;color:#fff;border-color:var(--fp-line-strong);font-weight:600}\n    .fp-pill-num{font-size:11px;font-variant-numeric:tabular-nums}\n\n    /* ── Grille centrale strictement 2 colonnes ── */\n    .fp-duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start}\n\n    /* ── Puces rondes des arguments chiffrés ── */\n    .fp-bul{\n      width:21px;height:21px;flex:0 0 21px;display:grid;place-items:center;border-radius:999px;\n      font-size:10.5px;font-weight:800;line-height:1;\n      color:var(--fp-bul,var(--fp-ink-2));\n      background:color-mix(in srgb, var(--fp-bul,var(--fp-ink-3)) 16%, transparent);\n      border:1px solid color-mix(in srgb, var(--fp-bul,var(--fp-ink-3)) 42%, transparent);\n    }\n\n    /* ── Carrousel « 5 derniers PAM » ── */\n    .fp-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;padding:0 13px 13px}\n    .fp-tile{\n      position:relative;border:1px solid var(--fp-line);border-radius:10px;background:var(--fp-panel-2);\n      padding:9px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;\n      transition:border-color .18s ease,background .18s ease;\n    }\n    .fp-tile:hover{border-color:var(--fp-line-strong);background:#1a1a1a}\n    .fp-tile-x{\n      position:absolute;top:4px;right:4px;cursor:pointer;border:0;background:transparent;\n      color:var(--fp-ink-3);width:18px;height:18px;font-size:12px;line-height:1;border-radius:5px;\n    }\n    .fp-tile-x:hover{color:var(--fp-bad);background:color-mix(in srgb, var(--fp-bad) 14%, transparent)}\n    /* zone cliquable « recharger » : sœur du ×, jamais son parent — pas de double action */\n    .fp-tile-x{z-index:2}\n    .fp-tile-hit{position:absolute;inset:0;z-index:1;cursor:pointer;border:0;background:transparent;border-radius:10px;padding:0}\n    .fp-tile > *:not(.fp-tile-hit):not(.fp-tile-x){position:relative;z-index:0;pointer-events:none}\n    .fp-chip{\n      font-size:8.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;\n      padding:3px 8px;border-radius:999px;white-space:nowrap;\n    }\n\n    /* ── Contexte d'alerte ──────────────────────────────────────────────\n       La logique réutilise var(--fp-accent) à la fois comme accent de marque\n       et comme couleur d'alerte. L'accent étant désormais vert, un état\n       bloquant s'afficherait en vert. On redéfinit la variable localement sur\n       les seuls éléments d'alerte : var(--fp-accent) y résout en rouge, sans\n       toucher à la logique ni au reste de l'interface. */\n    .fp-alert{--fp-accent:var(--fp-bad);--fp-accent-line:var(--fp-bad);--fp-on-accent:#1a0505}\n\n    /* ── Bannière NO-GO flottante, bas-gauche ── */\n    .fp-nogo-wrap{position:sticky;bottom:12px;z-index:50;width:min(330px,calc(100vw - 24px));margin-left:12px;display:grid}\n    .fp-nogo{\n      background:color-mix(in srgb, var(--fp-bad) 16%, #0d0808);\n      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);\n      border:1px solid color-mix(in srgb, var(--fp-bad) 48%, transparent);\n      border-radius:var(--fp-r);margin:0 0 9px;padding:10px 11px;display:grid;gap:8px;\n      box-shadow:0 18px 44px rgba(0,0,0,.6);animation:fpFade .2s ease;\n    }\n\n    /* ══════════ Direction artistique — animations & relief ══════════ */\n    .fp-kpi, .fp-pill, .fp-tile, .fp-dock-b, .fp-role, .fp-act{transition:all .25s ease}\n    .fp-kpi:hover{border-color:#3a3a3a;box-shadow:0 0 18px rgba(16,185,129,.10);transform:translateY(-1px)}\n    .fp-kpi{position:relative;overflow:hidden}\n    .fp-kpi::after{\n      content:\"\";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s ease;\n      background:radial-gradient(120% 80% at 50% 0%,rgba(16,185,129,.10),transparent 70%);\n    }\n    .fp-kpi:hover::after{opacity:1}\n    .fp-kpi-gauge{height:4px;border-radius:999px;background:#1c1c1c;overflow:hidden;margin-top:3px}\n    .fp-kpi-gauge > i{display:block;height:100%;border-radius:999px;transition:width .45s ease}\n    .fp-trend{font-size:9.5px;font-weight:750;letter-spacing:.03em;white-space:nowrap}\n    /* pastille d'alerte : pulsation coupée en mode éco */\n    .fp-blink{animation:fpBlink 1.5s ease-in-out infinite}\n    @keyframes fpBlink{0%,100%{opacity:1}50%{opacity:.35}}\n    /* cadran de rotation */\n    .fp-dial{transform:rotate(-90deg);transform-origin:50% 50%}\n    .fp-dial circle{transition:stroke-dashoffset .5s ease}\n\n    /* ── Dock d'actions rapides ── */\n    .fp-dock{\n      display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:8px 10px;\n      border:1px solid var(--fp-line);border-radius:14px;\n      background:linear-gradient(180deg,#131313,#0d0d0d);\n      box-shadow:0 6px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.03);\n    }\n    .fp-dock-b{\n      display:inline-flex;align-items:center;gap:7px;cursor:pointer;\n      border:1px solid var(--fp-line);border-radius:10px;background:var(--fp-panel-2);\n      color:var(--fp-ink-2);padding:7px 11px;font-size:11.5px;font-weight:600;white-space:nowrap;\n    }\n    .fp-dock-b:hover{\n      transform:translateY(-1px) scale(1.03);color:#fff;border-color:var(--fp-ok);\n      box-shadow:0 0 14px rgba(16,185,129,.32);\n    }\n    .fp-dock-b.blue:hover{border-color:var(--fp-blue);box-shadow:0 0 14px rgba(59,130,246,.32)}\n    .fp-dock-b.red:hover{border-color:var(--fp-bad);box-shadow:0 0 14px rgba(239,68,68,.30)}\n    .fp-dock-b .ic{font-size:13px;line-height:1}\n    .fp-kbd{\n      font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;\n      background:#1e1e1e;border:1px solid #333;border-radius:4px;padding:3px 4px;color:var(--fp-ink-3);\n    }\n    .fp-dock-b:hover .fp-kbd{color:var(--fp-ink-2);border-color:#454545}\n\n    /* ── Accueil / command center ── */\n    .fp-hero-x{\n      position:relative;overflow:hidden;border:1px solid var(--fp-line);border-radius:var(--fp-r);\n      background:linear-gradient(135deg,#101010 0%,#0c0f0e 45%,#0b0d12 100%);\n      padding:20px 22px;\n    }\n    .fp-hero-x::before{\n      content:\"\";position:absolute;inset:0;pointer-events:none;opacity:.55;\n      background-image:linear-gradient(rgba(16,185,129,.05) 1px,transparent 1px),\n                       linear-gradient(90deg,rgba(59,130,246,.05) 1px,transparent 1px);\n      background-size:26px 26px;\n    }\n    .fp-hero-x > *{position:relative}\n    .fp-hero-big{\n      font-family:var(--font-heading);font-weight:800;letter-spacing:-.045em;line-height:.95;\n      font-size:clamp(34px,5.2vw,62px);\n      background:linear-gradient(92deg,#f4f4f5 0%,#6ee7b7 55%,#7dd3fc 100%);\n      -webkit-background-clip:text;background-clip:text;color:transparent;\n    }\n    .fp-live{\n      display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(16,185,129,.45);\n      background:rgba(16,185,129,.10);border-radius:999px;padding:4px 11px;\n      font-size:10px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:#6ee7b7;\n    }\n    .fp-live .dot{width:6px;height:6px;border-radius:999px;background:#10b981;box-shadow:0 0 8px #10b981}\n    .fp-act{\n      border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);\n      padding:13px 15px;display:grid;gap:7px;align-content:start;cursor:pointer;text-align:left;\n    }\n    .fp-act:hover{transform:translateY(-2px);border-color:#3a3a3a;box-shadow:0 8px 26px rgba(0,0,0,.5)}\n\n    /* ── Cartes de rôle ── */\n    .fp-role{\n      position:relative;border:1px solid var(--fp-line);border-radius:14px;padding:15px;\n      background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.012));\n      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);\n      display:grid;gap:10px;align-content:start;\n    }\n    .fp-role:hover{transform:translateY(-2px);border-color:#3d3d3d;box-shadow:0 10px 30px rgba(0,0,0,.5)}\n    .fp-ava{\n      width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 42px;\n      font-family:var(--font-heading);font-weight:800;font-size:15px;color:#04150e;\n    }\n    .fp-perm{display:grid;place-items:center;height:22px;border-radius:6px;font-size:11px;font-weight:800}\n\n    /* ── HUD scanner d'annonce ──────────────────────────────────────────\n       Traitement « poste de commande » : fond plus froid, coins biseautés,\n       lueur néon tirée des accents existants pour rester dans la palette. */\n    .fp-hud{\n      position:relative;background:#0d1117;border:1px solid #1e2b3a;\n      padding:13px 15px;\n      clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);\n      box-shadow:0 0 14px rgba(59,130,246,.10), inset 0 0 26px rgba(59,130,246,.05);\n    }\n    .fp-hud::before{\n      content:\"\";position:absolute;inset:0;pointer-events:none;opacity:.5;\n      background-image:linear-gradient(rgba(59,130,246,.055) 1px,transparent 1px),\n                       linear-gradient(90deg,rgba(59,130,246,.055) 1px,transparent 1px);\n      background-size:22px 22px;\n    }\n    .fp-hud > *{position:relative}\n    .fp-hud-t{\n      font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;\n      color:#7dd3fc;text-shadow:0 0 9px rgba(56,189,248,.5);\n    }\n    .fp-hud-in{\n      width:100%;background:#080c12;border:1px solid #1e2b3a;border-radius:6px;\n      color:var(--fp-ink);padding:10px;font-size:12.5px;line-height:1.5;resize:vertical;outline:none;\n      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;\n    }\n    .fp-hud-in:focus{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.18)}\n    .fp-hud-go{\n      cursor:pointer;border:1px solid #3b82f6;background:rgba(59,130,246,.14);color:#bfdbfe;\n      padding:8px 14px;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;\n      clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);\n      box-shadow:0 0 12px rgba(59,130,246,.28);transition:.15s;\n    }\n    .fp-hud-go:hover{background:rgba(59,130,246,.26);color:#fff;box-shadow:0 0 18px rgba(59,130,246,.45)}\n    /* jauge néon */\n    .fp-gauge{height:9px;background:#080c12;border:1px solid #1e2b3a;border-radius:999px;overflow:hidden}\n    .fp-gauge > i{display:block;height:100%;border-radius:999px;transition:width .45s ease}\n    .fp-key{\n      display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;\n      font-size:10.5px;font-weight:650;letter-spacing:.02em;border:1px solid;\n    }\n    .fp-key.ok  {color:#6ee7b7;border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.10);box-shadow:0 0 9px rgba(16,185,129,.20)}\n    .fp-key.bad {color:#fca5a5;border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.10);box-shadow:0 0 9px rgba(239,68,68,.20)}\n    .fp-key.warn{color:#fcd34d;border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.10);box-shadow:0 0 9px rgba(245,158,11,.20)}\n\n    /* ── Price Low Ball ── */\n    .fp-mono{font-family:ui-monospace,SFMono-Regular,\"JetBrains Mono\",Menlo,Consolas,monospace}\n    .fp-lb-row{transition:background .15s ease}\n    .fp-lb-row:nth-child(even){background:var(--fp-panel-2)}\n    .fp-lb-row:hover{background:#1c2235}\n    .fp-lb-tranche{font-size:10px;color:var(--fp-ink-3);letter-spacing:.02em;white-space:nowrap;\n      border:1px solid var(--fp-line);border-radius:999px;padding:1px 7px;background:var(--fp-panel-3)}\n    .fp-lb-thumb{transition:transform .2s ease;cursor:pointer}\n    .fp-lb-thumb:hover{transform:scale(1.18)}\n    @keyframes fpToastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}\n    .fp-toast{\n      position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;\n      background:#101418;border:1px solid rgba(16,185,129,.5);color:#e8eaf0;\n      padding:11px 18px;border-radius:999px;font-size:12.5px;font-weight:650;\n      box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 16px rgba(16,185,129,.2);\n      animation:fpToastIn .22s ease;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;\n    }\n    @media print{\n      [data-fp-app] > *:not(main){display:none!important}\n      main > *:not([data-screen-label=\"Price Low Ball\"]){display:none!important}\n      [data-fp-noprint]{display:none!important}\n      body,[data-fp-app]{background:#fff!important;color:#111!important}\n      .fp-lb-row{background:#fff!important;color:#111!important;border-bottom:1px solid #ccc}\n      .fp-print-only{display:inline!important}\n    }\n\n    .fp-verdict{\n      display:inline-flex;align-items:center;gap:7px;padding:6px 13px;font-size:11.5px;font-weight:800;\n      letter-spacing:.1em;text-transform:uppercase;border:1px solid;\n      clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);\n    }\n\n    /* ── Adaptatif : la densité prime, on ne casse qu'au vrai besoin ── */\n    @media (max-width:1180px){\n      .fp-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}\n      .fp-kpi{max-height:none}\n    }\n    @media (max-width:960px){\n      .fp-duo{grid-template-columns:minmax(0,1fr)}\n      .fp-strip{grid-template-columns:repeat(3,minmax(0,1fr))}\n    }\n    /* ══════════ Couche mobile ══════════\n       Le terrain se fait à une main, debout, avec des gants l'hiver. Cibles\n       tactiles à 44 px, champs à 16 px pour que Safari ne zoome pas au focus,\n       et respect des zones sûres de l'encoche et de la barre d'accueil. */\n    /* Les grilles du bureau imposent des colonnes de 320 à 340 px : sur un\n       écran de 375 px elles débordent forcément. Sur mobile tout passe en une\n       colonne. Les conteneurs à défilement horizontal volontaire — catalogue,\n       matrice des permissions — gardent leur largeur : ils sont déjà dans un\n       parent qui défile. */\n    @media (max-width:820px){\n      main section [style*=\"repeat(auto-fit\"],\n      main section [style*=\"repeat(auto-fill\"]{grid-template-columns:minmax(0,1fr) !important}\n      main section [style*=\"grid-template-columns:repeat(3\"],\n      main section [style*=\"grid-template-columns: repeat(3\"],\n      main section [style*=\"grid-template-columns:1fr 1fr\"],\n      main section [style*=\"grid-template-columns: 1fr 1fr\"]{grid-template-columns:minmax(0,1fr) !important}\n      /* Le moteur de rendu ré-écrit les styles inline avec des espaces\n         (« display: flex ») : les deux écritures doivent être couvertes,\n         sinon la règle ne s'applique jamais. */\n      main section [style*=\"display:flex\"],\n      main section [style*=\"display: flex\"]{flex-wrap:wrap;min-width:0}\n      main section [style*=\"min-width:1040px\"],\n      main section [style*=\"min-width: 1040px\"],\n      main section [style*=\"min-width:520px\"],\n      main section [style*=\"min-width: 520px\"]{flex-wrap:nowrap}\n      /* la fiche produit passe en pile */\n      [style*=\"grid-template-columns:230px\"],\n      [style*=\"grid-template-columns: 230px\"]{grid-template-columns:minmax(0,1fr) !important}\n      /* dernier filet : rien dans une vue ne dépasse la largeur de l'écran */\n      main section img, main section svg{max-width:100%}\n      /* Les champs côte à côte portent un min-width pensé pour le bureau : sur\n         mobile ils doivent pouvoir rétrécir ou se replier. */\n      main section label[style*=\"min-width:110px\"],\n      main section label[style*=\"min-width: 110px\"],\n      main section label[style*=\"minmax(92px\"]{min-width:0 !important}\n      /* Le tiroir d'historique est hors écran en position fixe : il compte\n         dans la largeur défilable de la page et provoquait 11 px de décalage.\n         « clip » le neutralise sans créer de conteneur de défilement, donc\n         sans casser l'en-tête collant. */\n      [data-fp-app]{overflow-x:clip}\n    }\n    /* Les contrôles segmentés ne peuvent pas se replier sans casser leurs\n       bordures jointives : sur mobile ils défilent au doigt. */\n    @media (max-width:820px){\n      .fp-seg{margin-left:0 !important;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1 1 100%}\n      .fp-seg > button{flex:0 0 auto;white-space:nowrap}\n      /* un titre long ne doit jamais pousser la page */\n      main section h2, main section p{overflow-wrap:anywhere}\n      main section > div{min-width:0}\n    }\n    @media (max-width:820px){\n      /* zones sûres iOS */\n      .topbar{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}\n      .app{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));\n           padding-bottom:calc(90px + env(safe-area-inset-bottom))}\n\n      /* toute cible tactile atteint 44 px */\n      button, .fp-dock-b, .fp-pill, .btn, .pick, .fp-hud-go{min-height:44px}\n      .fp-dock-b, .fp-pill, .btn, .pick{padding-top:11px;padding-bottom:11px}\n      input, select, textarea{min-height:44px;font-size:16px !important}\n      input[type=\"number\"], input[type=\"text\"]{padding:11px 10px}\n      /* les petites icônes carrées gardent leur forme mais gagnent une surface */\n      .fp-tile-x, .card-act{min-width:36px;min-height:36px}\n\n      /* respiration : la densité desktop devient illisible au pouce */\n      .fp-kpis{gap:8px;padding:8px 0 10px}\n      .fp-kpi{padding:10px 12px}\n      .fp-dock{gap:8px;padding:10px}\n      .fp-nav{gap:8px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}\n      .fp-pill{scroll-snap-align:start}\n\n      /* tableaux larges : défilement horizontal contenu, jamais la page */\n      .fp-scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}\n\n      /* modales plein écran */\n      .fp-role{padding:13px}\n      .fp-hero-big{font-size:clamp(30px,9vw,42px)}\n    }\n    @media (max-width:640px){\n      .fp-strip{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}\n      .fp-duo{gap:10px}\n      /* le catalogue passe en cartes empilées plutôt qu'en tableau à dix colonnes */\n      .fp-hero-x{padding:15px 14px}\n    }\n    @media (max-width:640px){\n      .fp-kpis{grid-template-columns:repeat(2,minmax(0,1fr));padding:8px 10px 10px}\n      .fp-strip{grid-template-columns:repeat(2,minmax(0,1fr))}\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-fp-app=\"1\" data-fp-eco=\"{{ ecoAttr }}\" data-fp-theme=\"{{ theme }}\" style=\"position:relative;min-height:100vh;background:var(--fp-bg);color:var(--fp-ink);font-family:var(--font-body);font-size:14px;line-height:1.55;--fp-accent:{{ accent }}\">\n\n  <header style=\"position:sticky;top:0;z-index:20;background:var(--fp-bg);border-bottom:1px solid var(--fp-line-strong)\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:9px 14px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;margin-right:auto\">\n        <span style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;letter-spacing:-0.02em;text-transform:uppercase\">Flip&nbsp;Phone<\u002Fspan>\n        <span style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;letter-spacing:-0.02em;color:var(--fp-accent)\">MTL<\u002Fspan>\n        <span style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3);border-left:1px solid var(--fp-line);padding-left:8px\">Phase 1 · Niveau 1<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ openPalette }}\" style=\"border-width:1px;border-color:var(--fp-line);border-radius:var(--fp-r-sm);padding:7px 12px;font-size:11.5px;font-weight:600;color:var(--fp-ink-2);justify-content:flex-start;gap:8px\">Rechercher <span style=\"border:1px solid var(--fp-line-strong);padding:0 5px;font-size:10px\">⌘K<\u002Fspan><\u002Fbutton>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ toggleKpi }}\" style=\"border-width:1px;border-color:var(--fp-line);border-radius:var(--fp-r-sm);padding:7px 12px;font-size:11.5px;font-weight:600;color:var(--fp-ink-2);justify-content:flex-start\">{{ kpiToggleLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ toggleEco }}\" style=\"cursor:pointer;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:transparent;color:var(--fp-ink-2);padding:7px 12px;font-size:11.5px;font-weight:600;text-align:left\">{{ ecoLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:4px;border:1px solid var(--fp-line);border-radius:var(--fp-r);padding:3px\">\n        <sc-for list=\"{{ themeButtons }}\" as=\"tb\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ tb.onClick }}\" style=\"border:0;cursor:pointer;padding:6px 11px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;background:{{ tb.bg }};color:{{ tb.fg }}\">{{ tb.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:7px;padding-left:10px;border-left:1px solid var(--fp-line);flex:0 0 auto\">\n        <span style=\"width:22px;height:22px;display:grid;place-items:center;background:var(--fp-accent);color:var(--fp-on-accent);font-weight:800;font-size:10px\">Y<\u002Fspan>\n        <div style=\"line-height:1.2\">\n          <div style=\"font-size:11px;font-weight:600\">Youssef · COO<\u002Fdiv>\n          <div style=\"font-size:9.5px;color:var(--fp-ink-3)\">opérateur terrain<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ kpiOpen }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"fp-kpis\">\n        <sc-for list=\"{{ kpiLead }}\" as=\"k1\" hint-placeholder-count=\"1\">\n          <div class=\"fp-kpi\">\n            <div class=\"fp-kpi-row\">\n              <span class=\"fp-kpi-lab\" style=\"flex:1\">{{ k1.lab }}<\u002Fspan>\n              <span class=\"fp-trend\" style=\"color:{{ kpiCapColor }}\">{{ kpiCapSante }}<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"fp-kpi-val\" style=\"color:{{ k1.color }}\">{{ k1.val }}<\u002Fdiv>\n            <span class=\"fp-kpi-gauge\"><i style=\"width:{{ kpiCapGauge }};background:{{ kpiCapColor }};box-shadow:0 0 8px {{ kpiCapColor }}\"><\u002Fi><\u002Fspan>\n            <div class=\"fp-kpi-sub\">{{ k1.sub }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <div class=\"fp-kpi fp-kpi-chart\">\n          <div class=\"fp-kpi-row\">\n            <span class=\"fp-kpi-lab\" style=\"flex:1\">Trésorerie &amp; Runway (30 j)<\u002Fspan>\n            <span class=\"fp-trend\" style=\"color:var(--fp-ok)\">↑{{ kpiTrHigh }}<\u002Fspan>\n            <span class=\"fp-trend\" style=\"color:var(--fp-blue)\">↓{{ kpiTrLow }}<\u002Fspan>\n          <\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 200 56\" sc-camel-preserve-aspect-ratio=\"none\">\n            <defs>\n              <linearGradient id=\"fpGradHeld\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n                <stop offset=\"0%\" stop-color=\"#3b82f6\" stop-opacity=\".65\"><\u002Fstop>\n                <stop offset=\"100%\" stop-color=\"#3b82f6\" stop-opacity=\".04\"><\u002Fstop>\n              <\u002FlinearGradient>\n              <linearGradient id=\"fpGradFree\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n                <stop offset=\"0%\" stop-color=\"#10b981\" stop-opacity=\".65\"><\u002Fstop>\n                <stop offset=\"100%\" stop-color=\"#10b981\" stop-opacity=\".04\"><\u002Fstop>\n              <\u002FlinearGradient>\n            <\u002Fdefs>\n            <path d=\"{{ sparkHeldArea }}\" fill=\"url(#fpGradHeld)\"><\u002Fpath>\n            <path d=\"{{ sparkHeldLine }}\" fill=\"none\" stroke=\"var(--fp-blue)\" stroke-width=\"1.5\"><\u002Fpath>\n            <path d=\"{{ sparkFreeArea }}\" fill=\"url(#fpGradFree)\"><\u002Fpath>\n            <path d=\"{{ sparkFreeLine }}\" fill=\"none\" stroke=\"var(--fp-ok)\" stroke-width=\"1.5\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n\n        <div class=\"fp-kpi\">\n          <div class=\"fp-kpi-row\">\n            <span class=\"fp-kpi-lab\" style=\"flex:1\">Marge nette moyenne<\u002Fspan>\n            <span class=\"fp-trend\" style=\"color:{{ kpiMargeTrend.c }}\">{{ kpiMargeTrend.t }}<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"fp-kpi-row\">\n            <span class=\"fp-kpi-val\" style=\"color:var(--fp-ok)\">{{ kpiMargeVal }}<\u002Fspan>\n            <svg class=\"fp-kpi-spark\" sc-camel-view-box=\"0 0 150 44\" sc-camel-preserve-aspect-ratio=\"none\">\n              <path d=\"{{ kpiMargeArea }}\" fill=\"color-mix(in srgb, var(--fp-ok) 30%, transparent)\"><\u002Fpath>\n              <path d=\"{{ kpiMargeLine }}\" fill=\"none\" stroke=\"var(--fp-ok)\" stroke-width=\"1.8\"><\u002Fpath>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <span class=\"fp-kpi-gauge\"><i style=\"width:{{ kpiMargeTrend.w }};background:{{ kpiMargeTrend.c }}\"><\u002Fi><\u002Fspan>\n          <div class=\"fp-kpi-sub\">{{ kpiMargeSub }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"fp-kpi\">\n          <div class=\"fp-kpi-row\">\n            <span class=\"fp-kpi-lab\" style=\"flex:1\">Unités en stock<\u002Fspan>\n            <sc-if value=\"{{ kpiAlerteOn }}\" hint-placeholder-val=\"{{ true }}\">\n              <span class=\"fp-trend fp-blink\" style=\"color:var(--fp-bad);border:1px solid rgba(239,68,68,.5);background:rgba(239,68,68,.12);border-radius:999px;padding:2px 7px\">{{ kpiAlerteTxt }}<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div
