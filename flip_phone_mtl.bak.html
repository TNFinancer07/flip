\u002Fspan><span style=\"text-align:right\">Recond.<\u002Fspan><span style=\"text-align:right\">PAM marché<\u002Fspan><span style=\"text-align:right\">PAM strict<\u002Fspan><span style=\"text-align:right\">Ton PAM<\u002Fspan><span style=\"text-align:right\">ROI<\u002Fspan><span style=\"text-align:right\">$/jour<\u002Fspan><span style=\"text-align:right\">Rot.<\u002Fspan><span style=\"text-align:right\">Zone<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ mdRows }}\" as=\"m\" hint-placeholder-count=\"12\">\n              <div style=\"display:grid;grid-template-columns:1.5fr 92px 80px 92px 92px 92px 78px 78px 62px 100px;padding:9px 16px;border-bottom:1px solid var(--fp-line);font-size:13px;font-variant-numeric:tabular-nums;align-items:center;background:{{ m.bg }}\">\n                <span style=\"font-weight:600\">{{ m.n }}<span style=\"color:var(--fp-ink-3);font-weight:400;font-size:11px\"> · {{ m.an }}<\u002Fspan><\u002Fspan>\n                <span style=\"text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:5px\"><span style=\"color:var(--fp-accent);font-size:9px\">{{ m.prvMark }}<\u002Fspan><input type=\"number\" value=\"{{ m.prv }}\" sc-camel-on-change=\"{{ m.onPrv }}\" style=\"width:70px;border:1px solid {{ m.prvLine }};border-radius:var(--fp-r-sm);background:var(--fp-panel-2);color:var(--fp-ink);padding:5px 6px;font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right\"><\u002Fspan>\n                <span style=\"text-align:right;color:var(--fp-ink-3)\">{{ m.rec }}<\u002Fspan>\n                <span style=\"text-align:right;color:var(--fp-ink-3)\">{{ m.pamMarche }}<\u002Fspan>\n                <span style=\"text-align:right\">{{ m.pamStrict }}<\u002Fspan>\n                <span style=\"text-align:right;font-weight:600;color:{{ m.tonColor }}\">{{ m.tonPam }}<\u002Fspan>\n                <span style=\"text-align:right;color:{{ m.roiColor }}\">{{ m.roi }}<\u002Fspan>\n                <span style=\"text-align:right\">{{ m.perDay }}<\u002Fspan>\n                <span style=\"text-align:right;color:var(--fp-ink-3)\">{{ m.rot }}<\u002Fspan>\n                <span style=\"text-align:right;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:{{ m.zoneFg }}\">{{ m.zone }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start\">\n          <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n            <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Marge brute vs marge nette<\u002Fdiv>            <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:8px\">Un PAM calculé « PRV − pièces » donne une marge flatteuse. Voici ce qu'il en reste après négo acheteur, réserve garantie, casse, frais fixes et ton temps.<\u002Fdiv>\n            <sc-for list=\"{{ rcFields }}\" as=\"f5\" hint-placeholder-count=\"3\">\n              <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                <span style=\"display:block\"><b style=\"font-size:12.5px\">{{ f5.lab }}<\u002Fb><small style=\"display:block;color:var(--fp-ink-3);font-size:11px\">{{ f5.sub }}<\u002Fsmall><\u002Fspan>\n                <input type=\"number\" value=\"{{ f5.value }}\" sc-camel-on-change=\"{{ f5.onChange }}\" style=\"width:88px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:14px\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;background:var(--fp-line)\">\n              <sc-for list=\"{{ rcMinis }}\" as=\"rcm\" hint-placeholder-count=\"4\">\n                <div style=\"background:var(--fp-panel);padding:12px\">\n                  <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ rcm.lab }}<\u002Fdiv>\n                  <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;color:{{ rcm.color }}\">{{ rcm.val }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;padding:12px 14px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);font-size:12.5px;color:var(--fp-ink-2)\">{{ rcVerdict }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPipeline }}\" hint-placeholder-val=\"{{ true }}\">\n      <section data-screen-label=\"Pipeline\" style=\"display:grid;gap:16px\">\n        <div style=\"border-bottom:1px solid var(--fp-line);padding-bottom:14px;max-width:680px\">\n          <h2 style=\"font-size:clamp(24px,3vw,32px);margin:0 0 6px\">Pipeline — rotation 7 à 10 jours<\u002Fh2>\n          <p style=\"margin:0;color:var(--fp-ink-2);font-size:13px\">Touche <strong>Avancer<\u002Fstrong> pour faire progresser une carte. Passé 14 jours, l'appareil vire à l'accent : coupe le prix de 20 $ immédiatement. Le capital libéré vaut plus que les 20 $ perdus.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start\">\n          <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n            <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:10px\">Trésorerie à 30 jours<\u002Fdiv>\n            <sc-for list=\"{{ treasuryRows }}\" as=\"tr\" hint-placeholder-count=\"3\">\n              <div style=\"padding:9px 0;border-top:1px solid var(--fp-line)\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px\">\n                  <span style=\"font-size:12px;color:var(--fp-ink-2)\">{{ tr.lab }}<\u002Fspan>\n                  <span style=\"font-size:13px;font-weight:600;font-variant-numeric:tabular-nums\">{{ tr.val }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:8px;background:var(--fp-panel-3)\"><div style=\"height:8px;background:{{ tr.color }};width:{{ tr.w }};transition:width .3s ease\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"margin-top:12px;font-size:12px;color:var(--fp-ink-2)\">{{ runwayNote }}<\u002Fdiv>\n            <div style=\"margin-top:12px;padding-top:10px;border-top:1px solid var(--fp-line);display:grid;gap:7px\">\n              <span style=\"font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3);font-weight:600\">Répartition du capital par génération<\u002Fspan>\n              <sc-if value=\"{{ capitalMixEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size:12px;color:var(--fp-ink-3)\">Aucun capital immobilisé : tout est disponible.<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ capitalMix }}\" as=\"cm\" hint-placeholder-count=\"3\">\n                <div>\n                  <div style=\"display:flex;justify-content:space-between;font-size:11.5px;color:var(--fp-ink-2);margin-bottom:3px\">\n                    <span>{{ cm.lab }} · {{ cm.pct }}<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ cm.val }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:6px;background:var(--fp-panel-3)\"><div style=\"height:6px;background:{{ cm.color }};width:{{ cm.width }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:12px\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onExportCsv }}\" style=\"border-width:1px;border-color:var(--fp-line-strong);border-radius:var(--fp-r-sm);padding:8px 12px;font-size:11.5px;font-weight:600;justify-content:flex-start\">Export CSV<\u002Fbutton>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onExportJson }}\" style=\"border-width:1px;border-color:var(--fp-line);border-radius:var(--fp-r-sm);color:var(--fp-ink-2);padding:8px 12px;font-size:11.5px;font-weight:600;justify-content:flex-start\">Export JSON<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n            <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:10px\">Stock dormant<\u002Fdiv>\n            <sc-if value=\"{{ agingEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:12.5px;color:var(--fp-ink-3)\">Aucun appareil au-delà de 10 jours. C'est exactement l'état souhaité : le capital tourne.<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ agingRows }}\" as=\"ag\" hint-placeholder-count=\"2\">\n              <div style=\"padding:10px 0;border-top:1px solid var(--fp-line);display:grid;gap:4px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n                  <span style=\"font-size:13px;font-weight:600\">{{ ag.model }}<\u002Fspan>\n                  <span style=\"font-size:12px;font-weight:600;color:{{ ag.color }};font-variant-numeric:tabular-nums\">{{ ag.days }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size:12px;color:var(--fp-ink-2)\">{{ ag.advice }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n            <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:10px\">Marge moyenne par canal<\u002Fdiv>\n            <sc-for list=\"{{ channelStats }}\" as=\"cs\" hint-placeholder-count=\"4\">\n              <div style=\"padding:9px 0;border-top:1px solid var(--fp-line)\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px\">\n                  <span style=\"font-size:12.5px\">{{ cs.chan }} <span style=\"color:var(--fp-ink-3);font-size:11px\">· {{ cs.count }} deal(s)<\u002Fspan><\u002Fspan>\n                  <span style=\"font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:{{ cs.color }}\">{{ cs.marge }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:6px;background:var(--fp-panel-3)\"><div style=\"height:6px;background:{{ cs.color }};width:{{ cs.w }}\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"margin-top:10px;font-size:12px;color:var(--fp-ink-3)\">Marque la provenance sur chaque carte : au bout de dix flips, le canal le plus rentable saute aux yeux.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px;background:var(--fp-line);border:1px solid var(--fp-line-strong);border-radius:var(--fp-r)\">\n          <sc-for list=\"{{ pipeCols }}\" as=\"col\" hint-placeholder-count=\"4\">\n            <div style=\"background:var(--fp-panel-2);padding:12px;display:grid;gap:10px;align-content:start;min-height:260px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--fp-line-strong);padding-bottom:7px\">\n                <span style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600\">{{ col.n }}<\u002Fspan>\n                <span style=\"font-size:11px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums\">{{ col.count }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ col.cards }}\" as=\"cd\" hint-placeholder-count=\"2\">\n                <div style=\"border:2px solid {{ cd.line }};background:var(--fp-panel);padding:11px;display:grid;gap:6px\">\n                  <span style=\"font-weight:600;font-size:13px\">{{ cd.model }}<\u002Fspan>\n                  <span style=\"font-size:11.5px;color:var(--fp-ink-2);font-variant-numeric:tabular-nums\">{{ cd.money }}<\u002Fspan>\n                  <span style=\"font-size:11px;color:{{ cd.dayColor }};font-variant-numeric:tabular-nums\">{{ cd.days }}<\u002Fspan>\n                  <sc-raw-select value=\"{{ cd.chan }}\" sc-camel-on-change=\"{{ cd.onChan }}\" style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink-2);padding:5px;font-size:11px\">\n                    <sc-for list=\"{{ chanOptions }}\" as=\"co\" hint-placeholder-count=\"4\">\n                      <option value=\"{{ co }}\">{{ co }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ cd.onAdvance }}\" style=\"border-width:1px;border-color:var(--fp-line-strong);border-radius:var(--fp-r-sm);padding:6px 9px;font-size:11px;font-weight:600;justify-content:flex-start\">{{ cd.action }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isStub }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"display:grid;gap:16px;max-width:900px\">\n        <div style=\"border-bottom:1px solid var(--fp-line);padding-bottom:14px\">\n          <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:6px\">Vue simplifiée dans cette maquette<\u002Fdiv>\n          <h2 style=\"font-size:clamp(24px,3vw,32px);margin:0 0 6px\">{{ stubTitle }}<\u002Fh2>\n          <p style=\"margin:0;color:var(--fp-ink-2);font-size:13px\">{{ stubIntro }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px\">\n          <sc-for list=\"{{ stubPoints }}\" as=\"sp\" hint-placeholder-count=\"3\">\n            <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:15px;display:grid;gap:6px;align-content:start\">\n              <span style=\"font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ sp.k }}<\u002Fspan>\n              <span style=\"font-size:13px;color:var(--fp-ink-2)\">{{ sp.d }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <sc-if value=\"{{ imeiOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:68;background:color-mix(in srgb, #000 66%, transparent);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box\">\n      <div style=\"width:min(560px,100%);background:var(--fp-panel);border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);animation:fpFade .18s ease\">\n        <div style=\"display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--fp-line);padding:14px 16px\">\n          <span style=\"font-family:var(--font-heading neuf. Sur 12 et plus, la découpe laser est fortement recommandée.\",\n     comment:[\"Sans laser : chauffe à 90 °C, fil de coupe en évitant caméra et MagSafe, résidus à la lame et à l'alcool\",\"Avec laser (sous-traitance 25–40 $) : découpe nette, anneau MagSafe intact\",\"Colle B-7000 en cordon fin, presse 4 h sous poids\"],\n     pieges:[\"L'anneau MagSafe et l'antenne NFC sont collés au verre : Apple Pay meurt si tu les arraches\",\"Sur 14 et plus, le verre arrière est structurel\",\"Jamais au-dessus de 100 °C : tu décolles l'écran de l'autre côté\"],\n     regle:\"Une vitre arrière fissurée fait chuter le prix de 80 à 120 $ dans la tête du vendeur alors qu'elle te coûte 20 à 45 $. Le meilleur levier de négociation du métier.\"},\n    {code:'R·03',casse:1,niv:1,t:'Port de charge / charge lente',piece:'port',temps:35,gain:{g11:40,g12:45,g13:50,g14:60,g15:70},\n     quoi:\"Nettoyage profond ou remplacement de la nappe de charge. Neuf fois sur dix, ce n'est que de la peluche compactée.\",\n     comment:[\"Nettoyage d'abord : cure-dent en bois, jamais de métal, puis air sec\",\"Si la charge reste instable, remplace la nappe complète (micro du bas et antenne inclus)\",\"Sur 12 et plus, certaines versions demandent un dessoudage : sous-traitance\"],\n     pieges:[\"Un port oxydé vert signale un dégât d'eau : NO-GO\",\"La nappe contient le micro du bas — teste un mémo vocal après remontage\",\"Ne force jamais un connecteur : les pins se plient\"],\n     regle:\"Nettoyage : 5 minutes, 0 $, +40 $ de valeur perçue. À faire systématiquement sur chaque appareil.\"},\n    {code:'R·04',casse:2,niv:1,t:'Vitre de caméra fêlée',piece:'lens',temps:20,gain:{g11:35,g12:40,g13:45,g14:55,g15:60},\n     quoi:\"Remplacement du verre de protection des objectifs, sans toucher au module caméra.\",\n     comment:[\"Chauffe légèrement, décolle par le bord extérieur à la lame fine\",\"Aspire tous les éclats à la poire : un seul grain sur le capteur ruine les photos\",\"Pose le verre neuf sans poussière, presse 30 minutes\"],\n     pieges:[\"Un éclat tombé dans le module = tache permanente\",\"Ne confonds pas vitre fêlée et capteur endommagé : teste les photos avant\",\"Sur 14 Pro et plus, le verre est plus dur à décoller\"],\n     regle:\"8 $ de pièce, 20 minutes, 45 $ de valeur récupérée. Une vitre fêlée effraie l'acheteur bien plus qu'elle ne coûte.\"},\n    {code:'R·05',casse:1,niv:1,t:'Remise à neuf esthétique complète',piece:null,temps:40,gain:{g11:45,g12:50,g13:60,g14:70,g15:80},\n     quoi:\"Le détaillage du téléphone : ce que 90 % des vendeurs privés ne font pas et qui justifie 50 $ de plus.\",\n     comment:[\"Grilles : brosse à dents sèche puis ruban adhésif pour lever la poussière\",\"Contour d'écran : cure-dent en bois + microfibre à l'alcool 99 %\",\"Châssis : pâte à polir plastique sur les micro-rayures d'aluminium\",\"Verre trempé neuf posé sans bulle\"],\n     pieges:[\"Jamais d'alcool directement sur l'OLED\",\"Ne polis pas un châssis en acier inoxydable (11 Pro, 12 Pro, 13 Pro)\",\"Verre trempé mal posé = crédibilité perdue\"],\n     regle:\"4 $ de consommables, 40 minutes. Le meilleur ratio effort/valeur perçue de tout le système.\"},\n    {code:'R·06',casse:7,niv:2,t:'Écran OLED fissuré',piece:'oled',temps:55,gain:{g11:120,g12:150,g13:170,g14:200,g15:250},\n     quoi:\"Remplacement du bloc écran avec migration de la puce d'origine pour conserver True Tone et Face ID.\",\n     comment:[\"Ruban adhésif large sur l'écran cassé avant retrait (les éclats volent)\",\"Transfère écouteur, capteur de proximité et nappe Face ID\",\"Migre la puce d'écran, sinon « Pièce inconnue » et perte de True Tone\",\"Teste le tactile bord à bord avant de recoller\"],\n     pieges:[\"La nappe Face ID est appariée à la carte mère : déchirée = Face ID mort\",\"Un écran soft OLED se fend pendant la pose : première cause de perte sèche\",\"Les copies tierces perdent le 120 Hz sur les Pro\"],\n     regle:\"Pas avant ton troisième flip réussi et l'achat du programmateur. Avant ça, un écran cassé est un NO-GO, pas une opportunité.\"},\n    {code:'R·07',casse:4,niv:2,t:'Caméra arrière / autofocus qui vibre',piece:'cam',temps:40,gain:{g11:70,g12:80,g13:90,g14:110,g15:130},\n     quoi:\"Remplacement du module caméra arrière quand l'autofocus bourdonne, l'image tremble ou une lentille est floue.\",\n     comment:[\"Symptôme : bourdonnement audible et image qui tremble à l'ouverture de l'app Photo\",\"Cache de carte mère, nappe caméra, module complet\",\"Sur 12 et plus, migration de puce nécessaire\"],\n     pieges:[\"Un module non apparié désactive certains modes photo\",\"Souvent causé par une chute : vérifie aussi la carte mère\",\"Le prix du module dépasse vite le gain sur les modèles récents\"],\n     regle:\"Rentable jusqu'à la génération 13. Au-delà, le module coûte plus que la remise obtenue.\"},\n    {code:'R·08',casse:2,niv:2,t:'Haut-parleur / écouteur muet',piece:'spk',temps:35,gain:{g11:45,g12:50,g13:55,g14:65,g15:75},\n     quoi:\"Remplacement du haut-parleur principal ou de l'écouteur d'appel quand le son est étouffé ou absent.\",\n     comment:[\"Nettoyage de grille d'abord : 60 % des cas se règlent sans pièce\",\"Vérifie le logiciel : redémarrage, test en mode haut-parleur\",\"Remplacement : quelques vis, une nappe, aucune soudure\"],\n     pieges:[\"Un son étouffé des deux côtés évoque un dégât d'eau\",\"L'écouteur est solidaire du capteur de proximité sur certains modèles\"],\n     regle:\"Toujours tenter le nettoyage avant de commander la pièce.\"},\n    {code:'R·09',casse:2,niv:2,t:'Boutons, silence, haptique',piece:'btn',temps:45,gain:{g11:40,g12:45,g13:50,g14:60,g15:65},\n     quoi:\"Remplacement de la nappe des boutons volume et de l'interrupteur silence, ou du Taptic Engine.\",\n     comment:[\"Nappe fine collée le long du châssis : chauffe légèrement, décolle par le haut\",\"Taptic Engine : 4 vis\",\"Teste chaque bouton 10 fois après remontage\"],\n     pieges:[\"La nappe passe sous la carte mère sur cert SMA. Un IMEI blacklisté est bloqué sur tous les réseaux canadiens.\"},\n    {id:'c03',type:'B',w:0,t:\"Aucune trace d'eau\",h:\"Tiroir SIM : l'indicateur LCI doit être blanc, jamais rouge. Fond du port de charge : aucun dépôt vert. Écran sans halo ni tache.\"},\n    {id:'c04',type:'B',w:0,t:\"Face ID enregistre un nouveau visage\",h:\"Réglages → Face ID et code → Configurer une autre apparence : le double scan doit se terminer sans erreur. Seul test qui prouve que le dot projector est vivant.\"},\n    {id:'c05',type:'B',w:0,t:\"Aucun redémarrage pendant 10 minutes\",h:\"Vidéo, caméra, navigation. Un appareil qui redémarre seul, chauffe au repos ou perd 10 % en 15 minutes a un problème de carte mère.\"},\n    {id:'c06',type:'M',w:12,t:\"Santé de la batterie ≥ 85 %\",h:\"Réglages → Batterie → État de la batterie. Sous 85 %, compte la pièce d'office dans ton PAM. « Service » = batterie déjà remplacée en tiers.\"},\n    {id:'c07',type:'M',w:10,t:\"Aucun message « Pièce inconnue »\",h:\"Réglages → Général → Informations, section historique des pièces. C'est une remise de 40 à 80 $ à demander, pas un NO-GO.\"},\n    {id:'c08',type:'M',w:11,t:\"Écran sans burn-in, ligne ni tache\",h:\"Image grise unie plein écran à luminosité max, puis blanche, puis noire. Cherche le fantôme du clavier, les lignes vertes, les points morts.\"},\n    {id:'c09',type:'M',w:9,t:\"Tactile réactif bord à bord\",h:\"Notes : trace un S continu qui touche les quatre bords, puis un quadrillage. Toute zone morte signale un écran fatigué ou mal collé.\"},\n    {id:'c10',type:'M',w:9,t:\"Toutes les caméras, tous les zooms, le flash\",h:\"0,5× puis 1× puis 2–3×, caméra avant, vidéo, flash, portrait. Un autofocus qui bourdonne annonce un module à changer.\"},\n    {id:'c11',type:'M',w:8,t:\"Les trois micros\",h:\"Micro du bas : mémo vocal. Micro du haut : vidéo caméra avant. Micro arrière : vidéo caméra arrière. Réécoute chaque enregistrement.\"},\n    {id:'c12',type:'M',w:8,t:\"Appel réel avec TA carte SIM\",h:\"Insère ta SIM, attends l'accroche réseau, appelle et parle 30 secondes. « Recherche… » persistant = panne de baseband, NO-GO déguisé.\"},\n    {id:'c13',type:'m',w:5,t:\"Vitre arrière intacte\",h:\"Ongle sur toute la surface, lumière rasante. Une fissure au dos : 20 à 45 $ pour toi, 80 à 120 $ de remise à demander.\"},\n    {id:'c14',type:'m',w:6,t:\"Châssis droit, coins non écrasés\",h:\"Écran vers le bas sur une surface plate : il ne doit pas basculer. Un châssis vrillé empêche toute pose d'écran étanche.\"},\n    {id:'c15',type:'m',w:4,t:\"Haut-parleurs et écouteur\",h:\"Musique au volume max sans grésillement, puis un appel collé à l'oreille. Un son étouffé des deux côtés évoque un dégât d'eau.\"},\n    {id:'c16',type:'m',w:4,t:\"Capteur de proximité\",h:\"Pendant un appel, approche la main du haut de l'écran : il doit s'éteindre puis se rallumer. Un capteur mort = raccrochages avec la joue.\"},\n    {id:'c17',type:'m',w:5,t:\"Charge filaire et sans fil\",h:\"La charge démarre et tient quand tu bouges le câble. Teste ensuite MagSafe ou Qi, aimant compris sur 12 et plus.\"},\n    {id:'c18',type:'m',w:3,t:\"Wi-Fi, Bluetooth, NFC\",h:\"Partage de connexion, appairage d'un écouteur, Wallet pour le NFC. L'antenne NFC est collée à la vitre arrière : elle meurt après une réparation ratée.\"},\n    {id:'c19',type:'m',w:3,t:\"Boutons, silence, haptique\",h:\"Volume haut et bas dix fois, bouton latéral, interrupteur silence dans les deux sens : la vibration doit être franche et sèche.\"},\n    {id:'c20',type:'m',w:3,t:\"Provenance cohérente\",h:\"« Tu l'as acheté où, et pourquoi tu le vends ? » Une histoire fluide avec boîte ou facture vaut mieux qu'un rabais.\"}\n  ];\n\n  PREV = [\n    {id:'v01',type:'B',w:0,t:\"IMEI communiqué par écrit\",h:\"« Tu peux m'envoyer l'IMEI ? » — Un refus est le signal le plus révélateur du métier : un vendeur honnête n'a aucune raison de le cacher.\"},\n    {id:'v02',type:'B',w:0,t:\"Capture de Réglages → Informations\",h:\"Modèle, capacité et IMEI doivent correspondre à l'annonce, historique des pièces visible. Capture rognée juste avant l'historique = signal rouge.\"},\n    {id:'v03',type:'B',w:0,t:\"Photo horodatée de l'appareil allumé\",h:\"Photo à côté d'un papier daté du jour. Ça prouve qu'il a l'appareil en main et qu'il démarre. Photos de l'annonce réutilisées = photos peut-être volées.\"},\n    {id:'v04',type:'B',w:0,t:\"Mot de passe iCloud confirmé\",h:\"« Tu as bien le mot de passe iCloud ? On fera la déconnexion ensemble avant le paiement. » Tu ne reviendras jamais chercher un mot de passe.\"},\n    {id:'v05',type:'B',w:0,t:\"Prix pré-accepté, un chiffre ferme\",h:\"« Si tout correspond, je peux offrir [PAM] $ comptant aujourd'hui. » « On verra sur place » = il compte sur ton trajet pour te faire monter.\"},\n    {id:'v06',type:'M',w:16,t:\"Capture de Réglages → Batterie\",h:\"Pourcentage lisible. Au-dessus de 85 %, aucune pièce à prévoir. « Service » ou refus d'envoyer : compte la batterie d'office.\"},\n    {id:'v07',type:'M',w:15,t:\"Aucune pièce non authentique\",h:\"Un écran, une batterie ou une caméra signalés = remise de 40 à 80 $ à négocier avant de te déplacer.\"},\n    {id:'v08',type:'M',w:14,t:\"Photos des quatre côtés + écran allumé\",h:\"Photos nettes sous bonne lumière. Ce qu'on ne montre pas est ce qu'on cache.\"},\n    {id:'v09',type:'M',w:13,t:\"Aucun solde de financement\",h:\"Un appareil encore en financement peut être bloqué à distance des semaines après ton achat.\"},\n    {id:'v10',type:'M',w:12,t:\"Profil vendeur cohérent\",h:\"Compte de plus d'un an, photo réelle, quelques avis. Trois ou quatre iPhone en vente en même temps : revendeur, ou pire.\"},\n    {id:'v11',type:'m',w:8,t:\"Lieu public accepté et créneau fixé\",h:\"Stationnement de poste de police ou entrée de centre commercial, éclairé, avec une prise pour tester la charge. Non négociable.\"},\n    {id:'v12',type:'m',w:6,t:\"Histoire de vente cohérente\",h:\"Une histoire banale est bon signe. Une histoire qui change entre deux messages ne l'est pas.\"},\n    {id:'v13',type:'m',w:6,t:\"Boîte, facture ou accessoires\",h:\"Preuve de provenance : 20 à 30 $ de plus à ta revente.\"},\n    {id:'v14',type:'m',w:5,t:\"Réactivité et ton des échanges\",h:\"Réponses en moins d'une heure, ton normal. Silence puis trois messages pressants : signal faible qui pèse.\"}\n  ];\n\n  DECOTES = [\n    {id:'bat',v:20,l:\"Batterie sous 85 %\"},\n    {id:'ecr',v:30,l:\"Écran rayé ou marqué\"},\n    {id:'cab',v:15,l:\"Ni câble ni boîte\"},\n    {id:'vit',v:25,l:\"Vitre arrière fêlée\"},\n    {id:'pie',v:40,l:\"Message « pièce inconnue »\"},\n    {id:'cha',v:20,l:\"Châssis bosselé ou tordu\"},\n    {id:'por',v:15,l:\"Charge instable\"},\n    {id:'cam',v:25,l:\"Caméra ou vitre d'objectif\"}\n  ];\n\n  NOGOS = [\n    {t:\"iCloud / Localiser actif\",d:\"au moment du paiement — l'appareil est invendable et probablement volé.\"},\n    {t:\"IMEI blacklisté\",d:\"(CWTA / GSMA) ou statut « financement impayé » chez l'opérateur.\"},\n    {t:\"Trace d'eau\",d:\": indicateur LCI rouge, corrosion verte au port de charge, écran taché.\"},\n    {t:\"Face ID mort\",d:\"sur iPhone 11 et plus — le dot projector est apparié à la carte mère.\"},\n    {t:\"Pièces > 40 % du PRV\",d:\"ou marge nette < 90 $ — tu travailles pour rien.\"},\n    {t:\"Rotation estimée > 21 jours\",d:\"— un appareil qui dort te coûte tous les flips que tu n'as pas faits.\"}\n  ];\n\n  VIEWS = [\n    {id:'pam',label:'PAM'},{id:'terrain',label:'Terrain'},{id:'repair',label:'Repair Lab'},{id:'modeles',label:'Modèles'},\n    {id:'pipeline',label:'Pipeline'},{id:'sourcing',label:'Sourcing'},{id:'prompts',label:'Prompts'},\n    {id:'reinvest',label:'Réinvestissement'},{id:'scale',label:'Scale'},{id:'gouvernance',label:'Gouvernance'},{id:'academie',label:'Académie'}\n  ];\n\n  STUBS = {\n    sourcing:{t:\"Sourcing — trouver avant les autres\",i:\"Quatre canaux, deux jeux de signaux. Le tandem CEO / COO ne double le bassin que si les te pas décoder de code-barres. Tape les 15 chiffres, ou dépose une capture de l'écran du vendeur.\"});\n      return;\n    }\n    try{\n      const det = new window.BarcodeDetector({formats:['code_128','qr_code','data_matrix','ean_13']});\n      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});\n      const v = document.createElement('video');\n      v.srcObject = stream; v.playsInline = true; await v.play();\n      this.setState({imeiMsg:'Caméra ouverte — cadre le code-barres sous la batterie ou sur la boîte.'});\n      const deadline = Date.now() + 12000;\n      const tick = async () => {\n        if(Date.now() > deadline){ stream.getTracks().forEach(t => t.stop()); this.setState({imeiMsg:'Aucun code lu. Tape les chiffres à la main.'}); return; }\n        const found = await det.detect(v).catch(() => []);\n        const hit = (found || []).map(f => (f.rawValue || '').replace(/[^0-9]/g,'')).find(x => x.length === 15);\n        if(hit){ stream.getTracks().forEach(t => t.stop()); this.setState({imei:hit, imeiMsg:'Code lu : ' + hit}); return; }\n        requestAnimationFrame(tick);\n      };\n      tick();\n    }catch(e){ this.setState({imeiMsg:\"Accès caméra refusé. Tape les 15 chiffres à la main.\"}); }\n  }\n\n  onShot(e){\n    const f = e.target.files && e.target.files[0];\n    if(!f) return;\n    const url = URL.createObjectURL(f);\n    this.setState({shot:url, imeiMsg:'Capture conservée comme preuve de ce que le vendeur a montré.'});\n  }\n\n  /* la calibration des PRV date de cette référence : la dépréciation mensuelle s'applique ensuite toute seule */\n  CAL_DATE = '2026-01-01';\n\n  monthsSince(){ return Math.max(0, (Date.now() - new Date(this.CAL_DATE).getTime()) / 2629800000); }\n  depPrv(m){\n    const base = this.prvOf(m);\n    const months = this.monthsSince();\n    return Math.max(Math.round(base * 0.55), Math.round(base * (1 - m.dep / 100 * months)));\n  }\n\n  luhn(s){\n    let sum = 0;\n    for(let i = 0; i < i ligne, tactile bord à bord, toutes les caméras, micros et haut-parleurs testés, charge filaire et sans fil, réseau vérifié avec SIM active.\\n'\n      + 'iCloud déconnecté, IMEI propre, aucun solde opérateur.\\n'\n      + 'Livré avec boîte neutre, câble tressé et verre trempé déjà posé.\\n\\n'\n      + 'Prix ferme : ' + Math.round(r.prv) + ' $. Rencontre dans un lieu public à Montréal, essai complet sur place.';\n  }\n\n  copyText(txt){\n    if(navigator.clipboard) navigator.clipboard.writeText(txt);\n    this.setState({copied:true});\n    clearTimeout(this._ct4);\n    this._ct4 = setTimeout(() => this.setState({copied:false}), 1500);\n  }\n\n  download(name, mime, text){\n    try{\n      const blob = new Blob([text], {type: mime});\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url; a.download = name;\n      document.body.appendChild(a); a.click(); a.remove();\n      setTimeout(() => URL.revokeObjectURL(url), 4000);\n    }catch(e){}\n  }\n\n  exportCsv(){\n    const head = 'type;modele;canal;achat;pieces;prv;marge_projetee;jours;statut';\n    const lines = this.state.pipe.map(p => {\n      const marge = Math.round(p.prv * 0.95 - p.achat - p.pieces - 26);\n      return ['stock', p.model, p.chan || 'Marketplace', p.achat, p.pieces, p.prv, marge, p.days, this.PIPE_COLS[p.col]].join(';');\n    }).concat(this.state.history.map(h => ['calcul', h.model, '', h.pam, h.pieces, h.prv, h.profit, '', 'PAM mémorisé'].join(';')));\n    this.download('flip-phone-mtl-' + new Date().toISOString().slice(0,10) + '.csv', 'text/csv;charset=utf-8', [head].concat(lines).join('\\n'));\n  }\n\n  exportJson(){\n    const s = this.state;\n    this.download('flip-phone-mtl-' + new Date().toISOString().slice(0,10) + '.json', 'application/json',\n      JSON.stringify({exporte: new Date().toISOString(), pipeline: s.pipe, historique: s.history, reglages: {kit:s.kit, deplac:s.deplac, garantie:s.garantie, casse:s.casse, margeAbs:s.margeAbs, roiMin:s.roiMin, taux:s.taux}, prvAjustes: s.prvOverride, stockPieces: s.stock, notes: s.notes}, null, 2));\n  }\n\n  setChan(id, chan){ this.setState(s => ({pipe: s.pipe.map(p => p.id === id ? Object.assign({}, p, {chan}) : p)})); }\n\n  num(v){ const x = parseFloat(v); return isFinite(x) ? x : 0; }\n  fmt(n){ return (n<0?'−':'') + Math.abs(Math.round(n)).toLocaleString('fr-CA') + ' $'; }\n  set(key){ return e => this.setState({[key]: e.target.value}); }\n  setIn(group,key){ return e => this.setState(s => ({[group]: Object.assign({}, s[group], {[key]: e.target.value})})); }\n\n  pamSolve(P){\n    const test = prix => {\n      const invest = prix + P.pieces + P.frais + P.temps;\n      const profit = P.prvNet - invest - P.reserve - P.casse;\n      const exig = Math.max(P.margeAbs, invest * P.roiMin / 100) + P.prime;\n      return {invest, profit, exig, ok: profit >= exig};\n    };\n    const zero = test(0);\n    if(!zero.ok) return Object.assign({pam:0, iter:0, impossible:true}, zero);\n    let lo = 0, hi = P.prvNet, it = 0;\n    while(hi - lo > 0.5 && it < 64){ const mid = (lo+hi)/2; if(test(mid).ok) lo = mid; else hi = mid; it++; }\n    return Object.assign({pam:lo, iter:it, impossible:false}, test(lo));\n  }\n\n  terrainScore(){\n    const src = this.state.terrainSub === 'pre' ? this.PREV : this.CHECKS;\n    const store = this.state.terrainSub === 'pre' ? this.state.pv : this.state.ck;\n    let ko = 0, untested = 0, blockKo = 0, filled = 0;\n    src.forEach(c => {\n      const st = store[c.id];\n      if(st) filled++;\n      if(c.type === 'B'){ if(st === 'ko') blockKo++; }\n      else if(st === 'ko') ko += c.w;\n      else if(!st) untested += c.w;\n    });\n    const risk = filled === 0 ? 0 : Math.min(100, Math.round(ko + untested * 0.5));\n    return {risk, blockKo, filled, total: src.length, src, store};\n  }\n\n  curModel(){ return this.MODELS.find(m => m.id === this.state.modelId) || null; }\n  prvOf(m){ const o = this.state.prvOverride[m.id]; return o === Change:this.setIn('pl','sst')},\n        {lab:'Minutes de travail', value:pl.min, onChange:this.setIn('pl','min')},\n        {lab:'Jours achat → paiement reçu', value:pl.jours, onChange:this.setIn('pl','jours')},\n        {lab:'Taux horaire de référence ($/h)', value:pl.taux, onChange:this.setIn('pl','taux')}\n      ]),\n      plOut: this.fmt(plProfit), plColor: plProfit < 0 ? ACC : INK,\n      plPct: plTotal > 0 ? (plProfit/plTotal*100).toFixed(0) + ' % du coût total engagé' : 'Saisis un prix payé et un prix vendu.',\n      plMinis: [\n        {lab:'Coût total', val:this.fmt(plTotal)},\n        {lab:'Profit / jour', val:this.fmt(plProfit/plDays)},\n        {lab:'Profit / heure', val: plHours > 0 ? this.fmt(plProfit/plHours) : '—'},\n        {lab:'Après ton salaire', val:this.fmt(plProfit - plSal)}\n      ],\n      plVerdict: plTotal <= 0 ? 'En attente des chiffres réels de la vente.'\n        : plProfit < 0 ? 'Perte sèche de ' + this.fmt(-plProfit) + '. Note ce qui a dérapé : PRV surestimé, pièce en trop, ou rotation trop longue.'\n        : plProfit - plSal < 0 ? 'Le deal est positif en caisse mais négatif après ton salaire : tu as acheté un emploi, pas une marge.'\n        : 'Recalibre le PRV du modèle avec ce prix de vente réel : c\\'est ce chiffre qui vaut, pas la médiane des annonces actives.',\n\n      terrainSubs: seg([{id:'pre',label:'Pré-visite'},{id:'check',label:'Checklist 20 pts'},{id:'offre',label:'Décote & offre'}], s.terrainSub, id => this.setState({terrainSub:id})),\n      timerLabel: this.fmtTime(s.timer),\n      timerColor: s.timer > 720 ? 'var(--fp-bad)' : s.timer > 300 ? 'var(--fp-warn)' : 'var(--fp-ok)',\n      timerBtn: s.timerRun ? 'Pause' : s.timer ? 'Reprendre' : 'Démarrer les 5 min',\n      onTimer: () => this.startTimer(), onTimerReset: () => this.resetTimer(),\n      timerNote: s.timer > 720 ? 'Plus de 12 minutes sur place : conclus ou pars.' : s.timer > 300 ? 'Au-delà de 5 minutes : passe aux points majeurs.' : 'Cible : bloquants en 5 minutes, inspection complète en 12.',\n      voiceOn: s.voiceOn, voiceMsg: s.voiceMsg,\n      voiceLabel: s.voiceOn && s.voiceMode === 'check' ? 'Arrêter les commandes vocales' : 'Commandes vocales',\n      onVoiceCheck: () => this.speech('check'),\n      dictLabel: s.voiceOn && s.voiceMode === 'notes' ? 'Arrêter la dictée' : 'Dicter une note',\n      onVoiceNotes: () => this.speech('notes'),\n      notesValue: s.notes, onNotes: this.set('notes'),\n      voiceBg: s.voiceOn ? ACC : 'transparent', voiceFg: s.voiceOn ? ON : INK2,\n      isTerrainList: s.terrainSub !== 'offre', isDecote: s.terrainSub === 'offre',\n      ckScore: t.filled === 0 ? '—' : t.risk + '/100',\n      ckColor: t.blockKo ? ACC : t.risk >= 55 ? ACC : INK,\n      ckTitle: t.blockKo ? t.blockKo + ' point bloquant défaillant — tu pars' : t.filled === 0 ? 'Inspection non commencée' : t.risk >= 55 ? 'Trop d\\'inconnues ou de défauts majeurs' : t.risk >= 30 ? 'Risque moyen — chaque défaut devient un argument chiffré' : 'Profil propre, la prime de risque reste basse',\n      ckProgress: t.filled + ' / ' + t.total,\n      ckToPam: () => this.setState({view:'pam', pamSub:'maxbid'}),\n      ckReset: () => this.setState(st => (st.terrainSub === 'pre' ? {pv:{}} : {ck:{}})),\n      riskBarWidth: Math.min(100, t.risk) + '%',\n      riskBarColor: this.gauge3(t.risk, 30, 55),\n      locked: s.locked,\n      lockLabel: s.locked ? 'Déverrouiller le deal' : 'NO-GO — verrouiller le deal',\n      lockBg: s.locked ? 'transparent' : ACC, lockFg: s.locked ? ACC : ON,\n      toggleLock: () => this.setState(st => ({locked: !st.locked})),\n      dcAutoNote: 'Chaque défaut constaté dans la checklist coche automatiquement la décote correspondante.',\n      ckRows: t.src.map((c,i) => {\n        const st = t.store[c.id];\n        const isB = c.type === 'B';\n        return {num: String(i+1).padStart(2,'0'), t:c.t, hint:c.h,\n          tag: isB ? 'Bloquant' : c.type === 'M' ? 'Majeur · ' + c.w + ' pts' : 'Mineur · ' + c.w + ' pts',\n          tagBg: isB ? ACC : 'transparent', tagFg: isB ? ON : INK2, tagLine: isB ? ACC : LINE,\n          line: st === 'ko' ? ACC : st === 'ok' ? LINES : LINE,\n          okBg: st === 'ok' ? INK : 'transparent', okFg: st === 'ok' ? PANEL : INK2, okLine: st === 'ok' ? INK : LINE,\n          koBg: st === 'ko' ? ACC : 'transparent', koFg: st === 'ko' ? ON : INK2, koLine: st === 'ko' ? ACC : LINE,\n          koLabel: isB ? 'Bloquant constaté' : 'Défaut constaté',\n          hasGuide: !!this.GUIDES[c.id],\n          onGuide: () => this.ov({guide:c.id}),\n          isCurrent: i === s.ckIndex,\n          onOk: () => this.setState(sx => { const g = s.terrainSub === 'pre' ? 'pv' : 'ck'; const st2 = Object.assign({}, sx[g]); if(st2[c.id] === 'ok') delete st2[c.id]; else st2[c.id] = 'ok'; const dc = Object.assign({}, sx.dc); const link = this.CKDEC[c.id]; if(link) delete dc[link]; return {[g]: st2, dc}; }),\n          onKo: () => this.setState(sx => { const g = s.terrainSub === 'pre' ? 'pv' : 'ck'; const st2 = Object.assign({}, sx[g]); const wasKo = st2[c.id] === 'ko'; if(wasKo) delete st2[c.id]; else st2[c.id] = 'ko'; const dc = Object.assign({}, sx.dc); const link = this.CKDEC[c.id]; if(link){ if(wasKo) delete dc[link]; else dc[link] = true; } return {[g]: st2, dc}; })};\n      }),\n      dcRows: this.DECOTES.map(d => ({v:'−' + d.v + ' $', l:d.l,\n        bg: s.dc[d.id] ? ACC : 'transparent', fg: s.dc[d.id] ? ON : INK, line: s.dc[d.id] ? ACC : LINE,\n        onClick: () => this.setState(sx => { const st2 = Object.assign({}, sx.dc); if(st2[d.id]) delete st2[d.id]; else st2[d.id] = true; return {dc: st2}; })})),\n      dcPlafond: this.fmt(dcPlafond),\n      dcMinis: [\n        {lab:'Décote cumulée', val:this.fmt(dcTotal)},\n        {lab:'Défauts constatés', val:String(dcCount)},\n        {lab:'Offre d\\'ouverture', val:this.fmt(dcPlafond*0.9)}\n      ],\n      dcVerdict: dcDem <= 0 ? 'Saisis le prix demandé par le vendeur pour obtenir le plafond après décote.'\n        : dcCount === 0 ? 'Aucun défaut coché : ton seul argument est le PAM. Ouvre à ' + this.fmt(dcPlafond*0.9) + ' et tiens le plafond.'\n        : 'Énumère les ' + dcCount + ' défauts dans l\\'ordre du plus objectif au plus discutable, additionne devant lui, puis propose ' + this.fmt(dcPlafond*0.9) + '. Plafond : ' + this.fmt(dcPlafond) + '.',\n\n      repairSubs: seg([{id:'matrice',label:'Matrice'},{id:'pieces',label:'Coût pièces'},{id:'compat',label:'Compatibilité'},{id:'inventaire',label:'Inventaire'},{id:'fournisseurs',label:'Fournisseurs'},{id:'outillage',label:'Outillage'}], s.repairSub, id => this.setState({repairSub:id})),\n      isMatrice: s.repairSub === 'matrice', isPiecesTab: s.repairSub === 'pieces', isFourn: s.repairSub === 'fournisseurs', isOutil: s.repairSub === 'outillage',\n      isInventaire: s.repairSub === 'inventaire', isCompat: s.repairSub === 'compat', compatRows,\n      stockRows: this.PIECES.map(p => {\n        const qty = s.stock[p.id] || 0;\n        return {n:p.n, qty:String(qty), cost: p.p[gen] ? p.p[gen] + ' $' : '—',\n          value: this.fmt(qty * (p.p[gen] || 0)),\n          color: qty === 0 ? INK3 : qty <= 1 ? 'var(--fp-warn)' : 'var(--fp-ok)',\n          status: qty === 0 ? 'à commander' : qty <= 1 ? 'dernier exemplaire' : 'en stock',\n          onMinus: () => this.consume(p.id, -1), onPlus: () => this.consume(p.id, 1)};\n      }),\n      stockValue: this.fmt(this.PIECES.reduce((a,p) => a + (s.stock[p.id] || 0) * (p.p[gen] || 0), 0)),\n      stockNote: 'Immobilisé en pièces au prix de la génération ' + this.GENLAB[gen] + '. Une pièce en stock évite 4 jours de capital dormant — au-delà de deux exemplaires par référence, c’est un demi-téléphone que tu n’as pas acheté.',\n      rpFilters: [{id:'all',label:'Tout'},{id:'1',label:'Niveau 1 · cash facile'},{id:'2',label:'Niveau 2 · valeur'},{id:'3',label:'Niveau 3 · NO-GO'}].map(x => ({\n        label:x.label, bg: s.rpFilter === x.id ? ACC : 'transparent', fg: s.rpFilter === x.id ? ON : INK2, onClick: () => this.setState({rpFilter:x.id})})),\n      rpRows,\n      genLabels: this.GENS.map(g => this.GENLAB[g]),\n      piecesRows: this.PIECES.map(p => ({n:p.n, cells: this.GENS.map(g => ({v: p.p[g] ? p.p[g] + ' $' : '—', color: p.p[g] ? (g === gen ? ACC : INK) : INK3}))})),\n      fournRows: this.FOURN.map(f => Object.assign({}, f, {\n        url: f.n.indexOf('MobileSentrix') === 0 ? 'https://www.mobilesentrix.ca/'\n          : f.n.indexOf('AliExpress') === 0 ? 'https://www.aliexpress.com/w/wholesale-iphone-screen.html'\n          : f.n.indexOf('Grossistes') === 0 ? 'https://www.google.com/maps/search/grossiste+pièces+iphone+montréal'\n          : f.n.indexOf('Appareils') === 0 ? 'https://www.facebook.com/marketplace/montreal/search/?query=iphone%20pour%20pièces'\n          : 'https://www.google.com/maps/search/micro+soudure+iphone+montréal',\n        ship: f.n.indexOf('MobileSentrix') === 0 ? 'Livraison ~12 $ · gratuite au-delà de 150 $'\n          : f.n.indexOf('AliExpress') === 0 ? 'Livraison incluse · douanes possibles au-delà de 20 $'\n          : f.n.indexOf('Grossistes') === 0 ? 'Ramassage sur place · 0 $'\n          : f.n.indexOf('Appareils') === 0 ? 'Rencontre locale · coût = ton déplacement'\n          : 'Dépôt et reprise · 0 $'\n      })),\n      outilRows: this.OUTILS.map(o => Object.assign({}, o, {color: o.lvl === 3 ? ACC : INK})),\n\n      mdFilters: [{id:'all',label:'Tout'},{id:'volume',label:'Volume 11→13'},{id:'marge',label:'Marge 13 Pro→14 PM'},{id:'ceo',label:'CEO approval'},{id:'bas',label:'Bas volume'}].map(x => ({\n        label:x.label, bg: s.mdFilter === x.id ? ACC : 'transparent', fg: s.mdFilter === x.id ? ON : INK2, onClick: () => this.setState({mdFilter:x.id})})),\n      mdRows,\n      mdGenChips: [{id:'all',label:'Toutes générations'}].concat(this.GENS.map(g => ({id:g, label:this.GENLAB[g]}))).map(x => ({\n        label:x.label, bg: s.mdGen === x.id ? ACC : 'transparent', fg: s.mdGen === x.id ? ON : INK2,\n        onClick: () => this.setState({mdGen:x.id})})),\n      mdSortCols: [\n        {key:'prv',label:'PRV'},{key:'strict',label:'PAM strict'},{key:'ton',label:'Ton PAM'},\n        {key:'roi',label:'ROI'},{key:'perDay',label:'$/jour'},{key:'rot',label:'Rotation'}\n      ].map(c => ({label: c.label + (sortKey === c.key ? (sortDir < 0 ? ' ↓' : ' ↑') : ''),\n        bg: sortKey === c.key ? ACC : 'transparent', fg: sortKey === c.key ? ON : INK2,\n        onClick: () => this.setState(st => ({mdSort: st.mdSort.key === c.key ? {key:c.key, dir: st.mdSort.dir * -1} : {key:c.key, dir:-1}}))})),\n      rcFields: mkFields([\n        {lab:'PRV du modèle ($)', value:s.rc.prv, onChange:this.setIn('rc','prv')},\n        {lab:'PAM envisagé ($)', sub:'celui d\\'un tableau de marché, par exemple', value:s.rc.pam, onChange:this.setIn('rc','pam')},\n        {lab:'Coût de reconditionnement ($)', value:s.rc.piece, onChange:this.setIn('rc','piece')}\n      ]),\n      rcMinis: [\n        {lab:'Marge brute affichée', val:this.fmt(rcBrut), color: INK},\n        {lab:'Marge nette réelle', val:this.fmt(rcNet), color: rcNet < 90 ? ACC : INK},\n        {lab:'Écart', val:this.fmt(rcBrut - rcNet), color: ACC},\n        {lab:'ROI net', val: rcRoi.toFixed(0) + ' %', color: rcRoi < this.num(s.roiMin) ? ACC : INK}\n      ],\n      rcVerdict: rcNet < 90 ? 'À ce PAM, il reste ' + this.fmt(rcNet) + ' net : sous le plancher de 90 $. La marge brute de ' + this.fmt(rcBrut) + ' est un mirage — l\\'écart de ' + this.fmt(rcBrut - rcNet) + ' part en négo acheteur, réserve, casse, frais et temps.'\n        : 'Il reste ' + this.fmt(rcNet) + ' net pour ' + this.fmt(rcNetInvest) + ' immobilisés, soit ' + rcRoi.toFixed(0) + ' % de ROI. L\\'écart avec la marge brute affichée est de ' + this.fmt(rcBrut - rcNet) + '.',\n\n      pipeCols: this.PIPE_COLS.map((n,i) => ({n, count: s.pipe.filter(p => p.col === i).length,\n        cards: s.pipe.filter(p => p.col === i).map(p => ({\n          model:p.model, money: this.fmt(p.achat) + ' + ' + this.fmt(p.pieces) + ' → PRV ' + this.fmt(p.prv),\n          days: p.col === 3 ? 'clôturé' : p.days + ' jours en stock',\n          dayColor: p.days > 14 && p.col < 3 ? ACC : p.days >= 10 && p.col < 3 ? 'var(--fp-warn)' : INK3,\n          line: p.days > 14 && p.col < 3 ? ACC : LINE,\n          chan: p.chan || 'Marketplace',\n          onChan: e => this.setChan(p.id, e.target.value),\n          action: p.col === 3 ? 'Archiver' : 'Avancer →',\n          onAdvance: () => this.advance(p.id)\n        }))}))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
