  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"bb190103-1066-4cec-9a93-a64ca16cd563\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"002d1abb-ebc5-4cca-bc3e-1ca56aa06a73\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"03856027-d8be-4e50-84d0-baa695c994d5\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"bb190103-1066-4cec-9a93-a64ca16cd563\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"002d1abb-ebc5-4cca-bc3e-1ca56aa06a73\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; adow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg r.onClick }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                    <span style=\"width:16px;height:16px;flex:0 0 auto;border:2px solid {{ r.boxLine }};background:{{ r.boxBg }}\"><\u002Fspan>\n                    <span style=\"flex:1\"><b style=\"font-size:12.5px\">{{ r.t }}<\u002Fb><small style=\"display:block;color:var(--fp-ink-3);font-size:11px\">{{ r.meta }}<\u002Fsmall><\u002Fspan>\n                    <span style=\"font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--fp-ink-2)\">{{ r.cost }}<\u002Fspan>\n                  <\u002Flabel>\n                <\u002Fsc-for>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--fp-line)\">\n                  <div><div style=\"font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">Pièces<\u002Fdiv><div style=\"font-family:var(--font-heading);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums\">{{ piecesTot }}<\u002Fdiv><\u002Fdiv>\n                  <div><div style=\"font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">Ton temps<\u002Fdiv><div style=\"font-family:var(--font-heading);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums\">{{ tempsTot }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">03 · mode de calcul<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0\">\n                  <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"cursor:pointer;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:{{ m.bg }};color:{{ m.fg }};padding:9px 6px;font-size:11.5px;font-weight:600;text-align:left\">{{ m.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--fp-ink-2)\">{{ modeNote }}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">04 · réglettes de marge<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:10px\">Les pourcentages se règlent au doigt : le PAM se recalcule à chaque cran.<\u002Fdiv>\n                <sc-for list=\"{{ pctSliders }}\" as=\"sl\" hint-placeholder-count=\"5\">\n                  <div style=\"padding:10px 0;border-top:1px solid var(--fp-line)\">\n                    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px\">\n                      <span style=\"font-size:12.5px;font-weight:600\">{{ sl.lab }}<\u002Fspan>\n                      <span style=\"font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--fp-accent)\">{{ sl.val }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <input type=\"range\" min=\"{{ sl.min }}\" max=\"{{ sl.max }}\" step=\"{{ sl.step }}\" value=\"{{ sl.value }}\" sc-camel-on-change=\"{{ sl.onChange }}\" style=\"width:100%\">\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:10px\">05 · frais &amp; planchers<\u002Fdiv>\n                <sc-for list=\"{{ floorFields }}\" as=\"f2\" hint-placeholder-count=\"7\">\n                  <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                    <span style=\"display:block\"><b style=\"font-size:12.5px\">{{ f2.lab }}<\u002Fb><small style=\"display:block;color:var(--fp-ink-3);font-size:11px\">{{ f2.sub }}<\u002Fsmall><\u002Fspan>\n                    <input type=\"number\" value=\"{{ f2.value }}\" sc-camel-on-change=\"{{ f2.onChange }}\" style=\"width:88px;border:2px solid {{ f2.line }};background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n                  <\u002Flabel>\n                <\u002Fsc-for>\n                <div style=\"margin-top:12px;padding:10px 12px;border-left:2px solid var(--fp-accent);background:var(--fp-panel-2);font-size:12px;color:var(--fp-ink-2)\">Score de risque terrain : <strong style=\"color:var(--fp-ink)\">{{ riskLabel }}<\u002Fstrong> — prime de {{ primeLabel }} ajoutée à la marge exigée. Il vient de la checklist Terrain.<\u002Fdiv>\n                <div style=\"margin-top:12px;padding-top:12px;border-top:1px solid var(--fp-line);display:grid;gap:8px\">\n                  <div style=\"font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3);font-weight:600\">Déplacement calculé à la distance<\u002Fdiv>\n                  <div style=\"display:flex;gap:8px\">\n                    <label style=\"flex:1;display:grid;gap:3px\"><span style=\"font-size:11px;color:var(--fp-ink-3)\">Distance (km)<\u002Fspan>\n                      <input type=\"number\" value=\"{{ kmValue }}\" sc-camel-on-change=\"{{ onKm }}\" style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums\"><\u002Flabel>\n                    <label style=\"flex:1;display:grid;gap:3px\"><span style=\"font-size:11px;color:var(--fp-ink-3)\">Coût au km ($)<\u002Fspan>\n                      <input type=\"number\" value=\"{{ kmRate }}\" sc-camel-on-change=\"{{ onKmRate }}\" style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums\"><\u002Flabel>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12px;color:var(--fp-ink-2)\">{{ kmNote }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;gap:16px;position:sticky;top:210px\">\n              <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel)\">\n                <div style=\"padding:18px 18px 14px;border-bottom:1px solid var(--fp-line)\">\n                  <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3)\">Prix d'achat maximal<\u002Fdiv>\n                  <div style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(46px,7vw,68px);line-height:1;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:{{ pamColor }};margin:6px 0 4px\">{{ pamValue }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:var(--fp-ink-2)\">{{ pamSub }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))\">\n                  <sc-for list=\"{{ pamMinis }}\" as=\"mi\" hint-placeholder-count=\"6\">\n                    <div style=\"padding:12px 14px;border-right:1px solid var(--fp-line);border-bottom:1px solid var(--fp-line)\">\n                      <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ mi.lab }}<\u002Fdiv>\n                      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;color:{{ mi.color }}\">{{ mi.val }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"padding:14px 18px 16px\">\n                  <div style=\"display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3);margin-bottom:6px\">\n                    <span>Poids des coûts sur le PRV<\u002Fspan><span style=\"color:var(--fp-ink);font-variant-numeric:tabular-nums\">{{ ratioVal }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:8px;background:var(--fp-panel-3)\"><div style=\"height:8px;background:{{ ratioColor }};width:{{ ratioWidth }}\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"margin-top:14px;padding:12px 14px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);font-size:12.5px;color:var(--fp-ink-2);line-height:1.6\">{{ verdictHtml }}<\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:12px\">\n                    <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onVendorCopy }}\" style=\"border-width:1px;border-radius:var(--fp-r-sm);padding:9px 13px;font-size:12px;font-weight:600;justify-content:flex-start\">Copier le message vendeur<\u002Fbutton>\n                    <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onMemorize }}\" style=\"border-width:1px;border-color:var(--fp-line-strong);border-radius:var(--fp-r-sm);padding:9px 13px;font-size:12px;font-weight:600;justify-content:flex-start\">Mémoriser ce calcul<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:12px;padding:11px 13px;border:1px solid {{ effColor }};border-radius:var(--fp-r);font-size:12.5px;color:var(--fp-ink-2)\"><strong style=\"color:{{ effColor }}\">Taux horaire effectif {{ effRate }}<\u002Fstrong> — {{ effAlert }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Marge inversée<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:9px\">Le vendeur annonce un prix : vois immédiatement ce qu'il reste.<\u002Fdiv>\n                <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                  <b style=\"font-size:12.5px\">Prix proposé par le vendeur<\u002Fb>\n                  <input type=\"number\" value=\"{{ invValue }}\" sc-camel-on-change=\"{{ onInv }}\" style=\"width:96px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:9px;font-size:14px;font-variant-numeric:tabular-nums;text-align:right\">\n                <\u002Flabel>\n                <div class=\"tag\" style=\"margin-top:8px;font-size:11px;font-weight:600;padding:5px 10px;border:1px solid {{ overLine }};border-radius:999px;background:{{ overBg }};color:{{ overFg }};letter-spacing:.06em;text-transform:uppercase\">{{ overLabel }}<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:2px;background:var(--fp-line);margin-top:10px\">\n                  <sc-for list=\"{{ invMinis }}\" as=\"iv\" hint-placeholder-count=\"3\">\n                    <div style=\"background:var(--fp-panel);padding:11px 12px\">\n                      <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ iv.lab }}<\u002Fdiv>\n                      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;color:{{ iv.color }}\">{{ iv.val }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:12px;font-size:12.5px;color:var(--fp-ink-2)\">{{ invVerdict }}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"border:1px solid var(--fp-accent);border-radius:var(--fp-r);background:color-mix(in srgb, var(--fp-accent) 12%, transparent);backdrop-filter:blur(6px);padding:16px\">\n                <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fp-accent);font-weight:600;margin-bottom:10px\">NO-GO automatiques<\u002Fdiv>\n                <sc-for list=\"{{ nogos }}\" as=\"g\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;gap:10px;padding:8px 0;border-top:1px solid color-mix(in srgb, var(--fp-accent) 40%, transparent);font-size:12.5px;color:var(--fp-ink-2)\">\n                    <span style=\"color:var(--fp-accent);font-weight:800\">—<\u002Fspan><span><strong style=\"color:var(--fp-ink)\">{{ g.t }}<\u002Fstrong> {{ g.d }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isNego }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-items:start\">\n            <div style=\"display:grid;gap:16px\">\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Trois scripts, un seul chiffre<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:var(--fp-ink-2)\">Générés depuis ton PAM courant et les défauts cochés en Terrain. Le chiffre ne change pas d'un script à l'autre — seul le ton change.<\u002Fdiv>\n                <sc-for list=\"{{ negoRows }}\" as=\"ng\" hint-placeholder-count=\"3\">\n                  <div style=\"padding:12px 0;border-top:1px solid var(--fp-line);display:grid;gap:8px;margin-top:10px\">\n                    <div style=\"display:flex;align-items:center;gap:10px\">\n                      <span class=\"tag\" style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:3px 8px;border:1px solid var(--fp-line-strong);border-radius:var(--fp-r)\">{{ ng.tone }}<\u002Fspan>\n                      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ ng.onCopy }}\" style=\"margin-left:auto;border-width:1px;border-color:var(--fp-line);border-radius:var(--fp-r-sm);padding:5px 10px;font-size:11px;font-weight:600;justify-content:flex-start\">Copier<\u002Fbutton>\n                    <\u002Fdiv>\n                    <p style=\"margin:0;font-size:12.5px;color:var(--fp-ink-2);line-height:1.65\">{{ ng.txt }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Contrôle IMEI<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:9px\">Structure et clé de contrôle vérifiées ici. Le vol et le financement se vérifient sur les registres, jamais dans une appli.<\u002Fdiv>\n                <input type=\"text\" value=\"{{ imeiValue }}\" sc-camel-on-change=\"{{ onImei }}\" placeholder=\"15 chiffres — *#06#\" style=\"width:100%;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:11px;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.08em\">\n                <div style=\"font-size:12.5px;color:{{ imeiColor }};margin-top:10px\">{{ imeiTxt }}<\u002Fdiv>\n                <sc-for list=\"{{ imeiRows }}\" as=\"ir\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--fp-line);font-size:12px\">\n                    <span style=\"color:var(--fp-ink-3);min-width:130px\">{{ ir.k }}<\u002Fspan><span style=\"color:var(--fp-ink-2)\">{{ ir.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:12px\">\n                  <sc-for list=\"{{ imeiLinks }}\" as=\"il\" hint-placeholder-count=\"3\">\n                    <a href=\"{{ il.url }}\" target=\"_blank\" rel=\"noopener\" style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);padding:7px 11px;font-size:11.5px;font-weight:600;color:var(--fp-ink-2)\">{{ il.label }}<\u002Fa>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:16px\">\n              <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Annonce de revente<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:9px\">Composée depuis le modèle, le stockage, les réparations faites et ton PRV.<\u002Fdiv>\n                <textarea value=\"{{ listingValue }}\" sc-camel-read-only=\"{{ true }}\" rows=\"14\" style=\"width:100%;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:12px;font-size:12.5px;line-height:1.6;resize:vertical\"><\u002Ftextarea>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:10px\">\n                  <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onListingCopy }}\" style=\"border-width:1px;border-radius:var(--fp-r-sm);padding:9px 13px;font-size:12px;font-weight:600;justify-content:flex-start\">Copier l'annonce<\u002Fbutton>\n                  <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onPrintFiche }}\" style=\"border-width:1px;border-color:var(--fp-line-strong);border-radius:var(--fp-r-sm);padding:9px 13px;font-size:12px;font-weight:600;justify-content:flex-start\">Fiche imprimable<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:10px\">Vérifier le PRV en un clic<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <sc-for list=\"{{ marketRows }}\" as=\"mk\" hint-placeholder-count=\"3\">\n                    <a href=\"{{ mk.url }}\" target=\"_blank\" rel=\"noopener\" style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);padding:9px 13px;font-size:12px;font-weight:600;color:var(--fp-ink)\">{{ mk.label }}<\u002Fa>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--fp-ink-3);margin-top:10px\">Recherches pré-filtrées sur le modèle et le stockage choisis. Sur eBay, seules les ventes conclues comptent.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isLot }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;align-items:start\">\n            <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n              <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Achat groupé<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:8px\">Un lot ne se négocie qu'en un seul chiffre pour le tout. La remise paye ton risque de concentration, pas l'inverse.<\u002Fdiv>\n              <sc-for list=\"{{ bulkFields }}\" as=\"bf\" hint-placeholder-count=\"2\">\n                <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                  <span style=\"display:block\"><b style=\"font-size:12.5px\">{{ bf.lab }}<\u002Fb><small style=\"display:block;color:var(--fp-ink-3);font-size:11px\">{{ bf.sub }}<\u002Fsmall><\u002Fspan>\n                  <input type=\"number\" value=\"{{ bf.value }}\" sc-camel-on-change=\"{{ bf.onChange }}\" style=\"width:88px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:14px\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px;background:var(--fp-line)\">\n                <sc-for list=\"{{ bulkMinis }}\" as=\"bm\" hint-placeholder-count=\"4\">\n                  <div style=\"background:var(--fp-panel);padding:12px\">\n                    <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ bm.lab }}<\u002Fdiv>\n                    <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums\">{{ bm.val }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:14px;padding:12px 14px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);font-size:12.5px;color:var(--fp-ink-2)\">{{ bulkVerdict }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isTournee }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;align-items:start\">\n            <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n              <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Tournée multi-rendez-vous<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:8px\">Trois achats dans la même journée partagent un seul trajet : c'est là que le déplacement s'amortit.<\u002Fdiv>\n              <sc-for list=\"{{ tourFields }}\" as=\"tf\" hint-placeholder-count=\"3\">\n                <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                  <span style=\"display:block\"><b style=\"font-size:12.5px\">{{ tf.lab }}<\u002Fb><small style=\"display:block;color:var(--fp-ink-3);font-size:11px\">{{ tf.sub }}<\u002Fsmall><\u002Fspan>\n                  <input type=\"number\" value=\"{{ tf.value }}\" sc-camel-on-change=\"{{ tf.onChange }}\" style=\"width:88px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:14px\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px;background:var(--fp-line)\">\n                <sc-for list=\"{{ tourMinis }}\" as=\"tm\" hint-placeholder-count=\"4\">\n                  <div style=\"background:var(--fp-panel);padding:12px\">\n                    <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ tm.lab }}<\u002Fdiv>\n                    <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums\">{{ tm.val }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:14px;padding:12px 14px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);font-size:12.5px;color:var(--fp-ink-2)\">{{ tourVerdict }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isRotation }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;align-items:start\">\n            <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n              <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Vélocité du capital<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:8px\">Avec moins de 1 000 $, la contrainte n'est pas la marge par appareil — c'est le nombre de fois que ton argent tourne dans le mois. 100 $ en 7 jours écrase 200 $ en 25 jours.<\u002Fdiv>\n              <sc-for list=\"{{ roFields }}\" as=\"f3\" hint-placeholder-count=\"5\">\n                <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                  <span style=\"display:block\"><b style=\"font-size:12.5px\">{{ f3.lab }}<\u002Fb><small style=\"display:block;color:var(--fp-ink-3);font-size:11px\">{{ f3.sub }}<\u002Fsmall><\u002Fspan>\n                  <input type=\"number\" value=\"{{ f3.value }}\" sc-camel-on-change=\"{{ f3.onChange }}\" style=\"width:88px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:16px\">\n              <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:14px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3)\">Profit mensuel théorique<\u002Fdiv>\n                <div style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,6vw,58px);line-height:1;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:var(--fp-accent);margin:6px 0 10px\">{{ roOut }}<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:2px;background:var(--fp-line)\">\n                  <sc-for list=\"{{ roMinis }}\" as=\"rm\" hint-placeholder-count=\"4\">\n                    <div style=\"background:var(--fp-panel);padding:11px 12px\">\n                      <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ rm.lab }}<\u002Fdiv>\n                      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums\">{{ rm.val }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:14px;font-size:12.5px;color:var(--fp-ink-2)\">{{ roVerdict }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n                <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:10px\">Ce que coûte un jour de retard<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 80px 110px 100px;gap:0;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fp-ink-3);border-bottom:1px solid var(--fp-line-strong);padding-bottom:7px\">\n                  <span>Délai de vente<\u002Fspan><span style=\"text-align:right\">Flips/mois<\u002Fspan><span style=\"text-align:right\">Profit/mois<\u002Fspan><span style=\"text-align:right\">Écart<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ roTable }}\" as=\"rt\" hint-placeholder-count=\"6\">\n                  <div style=\"display:grid;grid-template-columns:1fr 80px 110px 100px;gap:0;padding:9px 0;border-bottom:1px solid var(--fp-line);font-size:12.5px;font-variant-numeric:tabular-nums;background:{{ rt.bg }}\">\n                    <span style=\"font-weight:600\">{{ rt.j }}<\u002Fspan><span style=\"text-align:right;color:var(--fp-ink-2)\">{{ rt.flips }}<\u002Fspan><span style=\"text-align:right\">{{ rt.profit }}<\u002Fspan><span style=\"text-align:right;color:{{ rt.ecartColor }}\">{{ rt.ecart }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isPnl }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;align-items:start\">\n            <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n              <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Le vrai profit, une fois vendu<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:8px\">Rempli après la vente. C'est ce chiffre qui recalibre tes PRV, pas ton intuition.<\u002Fdiv>\n              <sc-for list=\"{{ plFields }}\" as=\"f4\" hint-placeholder-count=\"10\">\n                <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line)\">\n                  <span style=\"display:block\"><b style=\"font-size:12.5px\">{{ f4.lab }}<\u002Fb><small style=\"display:block;color:var(--fp-ink-3);font-size:11px\">{{ f4.sub }}<\u002Fsmall><\u002Fspan>\n                  <input type=\"number\" value=\"{{ f4.value }}\" sc-camel-on-change=\"{{ f4.onChange }}\" style=\"width:88px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:14px;position:sticky;top:210px\">\n              <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3)\">Profit net encaissé<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,6vw,58px);line-height:1;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:{{ plColor }};margin:6px 0 4px\">{{ plOut }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--fp-ink-2);margin-bottom:12px\">{{ plPct }}<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px;background:var(--fp-line)\">\n                <sc-for list=\"{{ plMinis }}\" as=\"pm\" hint-placeholder-count=\"4\">\n                  <div style=\"background:var(--fp-panel);padding:11px 12px\">\n                    <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ pm.lab }}<\u002Fdiv>\n                    <div style=\"font-family:var(--font-heading);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums\">{{ pm.val }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:14px;padding:12px 14px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);font-size:12.5px;color:var(--fp-ink-2)\">{{ plVerdict }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel)\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:14px 18px 10px\">\n            <span style=\"font-size:15px;font-weight:500;letter-spacing:.02em;text-transform:uppercase\">5 derniers PAM<\u002Fspan>\n            <button sc-camel-on-click=\"{{ onMemorize }}\" style=\"margin-left:auto;cursor:pointer;border:0;background:transparent;color:var(--fp-ink-3);padding:0 4px;font-size:17px;font-weight:700;line-height:1\">⋯<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ histEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:0 18px 16px;font-size:13px;color:var(--fp-ink-3)\">Rien de mémorisé. Touche ⋯ ou la touche ↵ pour garder un PAM sous la main et le comparer au suivant.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px;padding:0 18px 18px\">\n            <sc-for list=\"{{ histRows }}\" as=\"hc\" hint-placeholder-count=\"5\">\n              <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r-sm);background:var(--fp-panel-2);padding:12px;display:grid;gap:9px;align-content:start;position:relative;transition:border-color .18s ease\" style-hover=\"border-color:var(--fp-line-strong)\">\n                <button sc-camel-on-click=\"{{ hc.onRemove }}\" style=\"position:absolute;top:8px;right:8px;cursor:pointer;border:0;background:transparent;color:var(--fp-ink-3);width:20px;height:20px;font-size:14px;line-height:1\">×<\u002Fbutton>\n                <div style=\"height:86px;display:grid;place-items:center\">\n                  <span style=\"width:44px;height:74px;border-radius:9px;border:1.5px solid {{ hc.hue }};background:linear-gradient(150deg, color-mix(in srgb, {{ hc.hue }} 52%, #0c0c0c), color-mix(in srgb, {{ hc.hue }} 16%, #0c0c0c));display:grid;place-items:start center;padding-top:5px\">\n                    <span style=\"width:14px;height:3px;border-radius:2px;background:color-mix(in srgb, #000 55%, transparent)\"><\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size:12.5px;font-weight:600;line-height:1.25\">{{ hc.model }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums\">{{ hc.pam }}<\u002Fspan>\n                <span style=\"font-size:10.5px;color:var(--fp-ink-3)\">{{ hc.meta }}<\u002Fspan>\n                <span style=\"justify-self:start;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:4px 10px;border-radius:999px;background:{{ hc.badgeBg }};color:{{ hc.badgeFg }}\">{{ hc.badge }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ hc.onRestore }}\" style=\"cursor:pointer;border:1px solid var(--fp-line-strong);border-radius:var(--fp-r-sm);background:transparent;color:var(--fp-ink);padding:7px 10px;font-size:11.5px;font-weight:600;text-align:left\">Recharger<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isTerrain }}\" hint-placeholder-val=\"{{ true }}\">\n      <section data-screen-label=\"Terrain\" style=\"display:grid;gap:16px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;border-bottom:1px solid var(--fp-line);padding-bottom:14px\">\n          <div style=\"max-width:640px\">\n            <h2 style=\"font-size:clamp(24px,3vw,32px);margin:0 0 6px\">Inspection sur place — 12 minutes<\u002Fh2>\n            <p style=\"margin:0;color:var(--fp-ink-2);font-size:13px\">Les <strong>bloquants<\u002Fstrong> se testent en premier : s'il y en a un, tu te lèves et tu pars, peu importe le prix. Les autres points alimentent le score de risque qui remonte dans le PAM. Les points non testés comptent pour la moitié de leur poids.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;margin-left:auto\">\n            <sc-for list=\"{{ terrainSubs }}\" as=\"ts\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ ts.onClick }}\" style=\"cursor:pointer;border:1px solid var(--fp-line);border-radius:var(--fp-r);border-right-width:0;padding:9px 14px;font-size:12px;font-weight:600;background:{{ ts.bg }};color:{{ ts.fg }}\">{{ ts.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n            <span style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);border-left-width:0\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px;background:var(--fp-line);border:1px solid var(--fp-line-strong);border-radius:var(--fp-r)\">\n          <div style=\"background:var(--fp-panel);padding:13px\">\n            <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3)\">Score de risque<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:{{ ckColor }}\">{{ ckScore }}<\u002Fdiv>\n            <div style=\"height:8px;background:var(--fp-panel-3);margin:8px 0 6px\"><div style=\"height:8px;background:{{ riskBarColor }};width:{{ riskBarWidth }};transition:width .3s ease\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--fp-ink-2);margin-top:6px\">{{ ckTitle }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--fp-panel);padding:13px\">\n            <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3)\">Avancement<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums\">{{ ckProgress }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--fp-ink-2);margin-top:6px\">points renseignés sur la liste active<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--fp-panel);padding:13px;display:flex;flex-direction:column;gap:8px;justify-content:center\">\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ ckToPam }}\" style=\"border-width:1px;border-radius:var(--fp-r-sm);padding:10px 14px;font-size:12px;font-weight:600;justify-content:flex-start;min-height:48px\">→ Envoyer le score au PAM<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ toggleLock }}\" style=\"cursor:pointer;border:1px solid var(--fp-accent);border-radius:var(--fp-r);background:{{ lockBg }};color:{{ lockFg }};padding:10px 14px;font-size:12px;font-weight:700;text-align:left;letter-spacing:.06em;text-transform:uppercase;min-height:48px\">{{ lockLabel }}<\u002Fbutton>\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ ckReset }}\" style=\"border-width:1px;border-color:var(--fp-line-strong);border-radius:var(--fp-r-sm);padding:10px 14px;font-size:12px;font-weight:600;justify-content:flex-start;min-height:48px\">Vider la liste<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px;background:var(--fp-line);border:1px solid var(--fp-line);border-radius:var(--fp-r);margin-bottom:4px\">\n          <div style=\"background:var(--fp-panel);padding:14px;display:flex;align-items:center;gap:12px\">\n            <span style=\"font-family:var(--font-heading);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;color:{{ timerColor }}\">{{ timerLabel }}<\u002Fspan>\n            <span style=\"font-size:11.5px;color:var(--fp-ink-2);flex:1\">{{ timerNote }}<\u002Fspan>\n            <span style=\"display:flex;gap:6px\">\n              <button sc-camel-on-click=\"{{ onTimer }}\" style=\"cursor:pointer;border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:transparent;color:var(--fp-ink);padding:8px 11px;font-size:11.5px;font-weight:600\">{{ timerBtn }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onTimerReset }}\" style=\"cursor:pointer;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:transparent;color:var(--fp-ink-3);padding:8px 11px;font-size:11.5px;font-weight:600\">0:00<\u002Fbutton>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background:var(--fp-panel);padding:14px;display:grid;gap:8px\">\n            <div style=\"display:flex;gap:6px\">\n              <button sc-camel-on-click=\"{{ onVoiceCheck }}\" style=\"cursor:pointer;flex:1;border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:{{ voiceBg }};color:{{ voiceFg }};padding:9px 11px;font-size:11.5px;font-weight:600;text-align:left;min-height:44px\">{{ voiceLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onVoiceNotes }}\" style=\"cursor:pointer;flex:1;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:transparent;color:var(--fp-ink-2);padding:9px 11px;font-size:11.5px;font-weight:600;text-align:left;min-height:44px\">{{ dictLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;color:var(--fp-ink-3)\">{{ voiceMsg }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--fp-panel);padding:14px;display:grid;gap:6px\">\n            <span style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3);font-weight:600\">Notes de terrain<\u002Fspan>\n            <textarea value=\"{{ notesValue }}\" sc-camel-on-change=\"{{ onNotes }}\" rows=\"3\" placeholder=\"Vices cachés, ce que le vendeur a dit, ce qu'il a esquivé…\" style=\"width:100%;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:9px;font-size:12.5px;resize:vertical\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isTerrainList }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px\">\n            <sc-for list=\"{{ ckRows }}\" as=\"c\" hint-placeholder-count=\"20\">\n              <div style=\"border:1px solid {{ c.line }};border-radius:var(--fp-r);background:var(--fp-panel);padding:13px 15px;display:grid;gap:8px;transition:border-color .18s ease\" style-hover=\"border-color:var(--fp-line-strong)\">\n                <div style=\"display:flex;gap:10px;align-items:flex-start\">\n                  <span style=\"font-size:11px;font-variant-numeric:tabular-nums;color:var(--fp-ink-3);padding-top:2px\">{{ c.num }}<\u002Fspan>\n                  <span style=\"flex:1;font-weight:600;font-size:13.5px\">{{ c.t }}<\u002Fspan>\n                  <span class=\"tag\" style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:3px 7px;border:2px solid {{ c.tagLine }};color:{{ c.tagFg }};background:{{ c.tagBg }};white-space:nowrap\">{{ c.tag }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--fp-ink-2);line-height:1.6\">{{ c.hint }}<\u002Fdiv>\n                <div style=\"display:flex;gap:8px\">\n                  <button sc-camel-on-click=\"{{ c.onOk }}\" style=\"cursor:pointer;flex:1;min-height:52px;border:1px solid {{ c.okLine }};border-radius:var(--fp-r-sm);background:{{ c.okBg }};color:{{ c.okFg }};padding:9px 12px;font-size:13px;font-weight:600;text-align:left\">Conforme<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ c.onKo }}\" style=\"cursor:pointer;flex:1;min-height:52px;border:1px solid {{ c.koLine }};border-radius:var(--fp-r-sm);background:{{ c.koBg }};color:{{ c.koFg }};padding:9px 12px;font-size:13px;font-weight:600;text-align:left\">{{ c.koLabel }}<\u002Fbutton>\n                  <sc-if value=\"{{ c.hasGuide }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button sc-camel-on-click=\"{{ c.onGuide }}\" style=\"cursor:pointer;min-height:52px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:transparent;color:var(--fp-accent);padding:9px 12px;font-size:13px;font-weight:700\">?<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isDecote }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;align-items:start\">\n            <div style=\"border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel);padding:13px\">\n              <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-accent);margin-bottom:4px\">Décote terrain<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--fp-ink-3);margin-bottom:10px\">Touche chaque défaut constaté qui n'était pas annoncé. Tu ne négocies jamais un pourcentage : tu énumères, tu additionnes, tu proposes un chiffre. {{ dcAutoNote }}<\u002Fdiv>\n              <label style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--fp-line);margin-bottom:10px\">\n                <b style=\"font-size:12.5px\">Prix demandé par le vendeur<\u002Fb>\n                <input type=\"number\" value=\"{{ f.dcDemande }}\" sc-camel-on-change=\"{{ h.dcDemande }}\" style=\"width:88px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);color:var(--fp-ink);padding:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right\">\n              <\u002Flabel>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px\">\n                <sc-for list=\"{{ dcRows }}\" as=\"d\" hint-placeholder-count=\"8\">\n                  <button sc-camel-on-click=\"{{ d.onClick }}\" style=\"cursor:pointer;border:2px solid {{ d.line }};background:{{ d.bg }};color:{{ d.fg }};padding:10px;text-align:left;display:grid;gap:2px\">\n                    <span style=\"font-family:var(--font-heading);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums\">{{ d.v }}<\u002Fspan>\n                    <span style=\"font-size:11.5px\">{{ d.l }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--fp-line-strong);border-radius:var(--fp-r);background:var(--fp-panel);padding:14px\">\n              <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fp-ink-3)\">Plafond après décote<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,6vw,58px);line-height:1;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:var(--fp-accent);margin:6px 0 10px\">{{ dcPlafond }}<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px;background:var(--fp-line)\">\n                <sc-for list=\"{{ dcMinis }}\" as=\"dm\" hint-placeholder-count=\"3\">\n                  <div style=\"background:var(--fp-panel);padding:11px 12px\">\n                    <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3)\">{{ dm.lab }}<\u002Fdiv>\n                    <div style=\"font-family:var(--font-heading);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums\">{{ dm.val }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:14px;padding:12px 14px;border:1px solid var(--fp-line);border-radius:var(--fp-r);background:var(--fp-panel-2);font-size:12.5px;color:var(--fp-ink-2)\">{{ dcVerdict }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isRepair }}\" hint-placeholder-val=\"{{ true }}\">\n      <section data-screen-label=\"Repair Lab\" style=\"display:grid;gap:16px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;border-bottom:1px solid var(--fp-line);padding-bottom:14px\">\n          <div style=\"max-width:640px\">\n            <h2 style=\"font-size:clamp(24px,3vw,32px);margin:0 0 6px\">Repair Lab<\u002Fh2>\n            <p style=\"margin:0;color:var(--fp-ink-2);font-size:13px\">Chaque réparation est classée par valeur ajoutée nette : le coût de la pièce compte moins que l'écart de prix qu'elle débloque à la revente.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;margin-left:auto\">\n            <sc-for list=\"{{ repairSubs }}\" as=\"rs\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ rs.onClick }}\" style=\"cursor:pointer;border:1px solid var(--fp-line);border-radius:var(--fp-r);border-right-width:0;padding:9px 14px;font-size:12px;font-weight:600;background:{{ rs.bg }};color:{{ rs.fg }}\">{{ rs.label
